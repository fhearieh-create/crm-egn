<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRM — EGN Rénovation</title>
<!-- PWA : installation en application sur téléphone -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A2B3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EGN CRM">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --black:#000;--navy:#1A2B3D;--navy2:#243549;--navy3:#2E4256;
  --green:#7CC242;--green-light:#9BD651;--green-dark:#5BA82E;--green-deep:#3D7A1E;
  --white:#FFF;--bg:#EEF7E2;--bg2:#E2EFD0;--bg-soft:#F5FAEC;
  --card:#FFF;--border:#D5E5BE;--border-soft:#E4EFD2;--border-grey:#E3E8EE;
  --text:#1A2B3D;--text-soft:#3E4D5C;--text-mut:#6B7785;
  --orange:#F77F00;--gold:#FCBF49;--coral:#E63946;--blue:#2D7DD2;--purple:#7B5FD6;--teal:#06A77D;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Saira',sans-serif;background:var(--bg-soft);color:var(--text);min-height:100vh}
button,input,select,textarea{font-family:'Saira',sans-serif}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c3d2b1;border-radius:6px}::-webkit-scrollbar-track{background:transparent}

/* ============ LOGIN ============ */
.login{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy2) 60%,#16242F);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem}
.login-card{background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.4);width:400px;max-width:100%;overflow:hidden;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.login-head{background:linear-gradient(135deg,var(--navy),var(--navy2) 70%,#16242F);padding:1.7rem 1.6rem 1.4rem;color:#fff;text-align:center}
.login-logo{display:flex;justify-content:center;align-items:center;min-height:44px}.login-logo img{max-height:48px;width:auto;max-width:80%}
.login-sub{font-size:.72rem;opacity:.9;margin-top:.3rem;letter-spacing:2px;text-transform:uppercase}
.login-body{padding:1.6rem}
.login-body label{display:block;font-size:.72rem;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.5px;margin:.9rem 0 .35rem}
.login-body input{width:100%;border:1.5px solid var(--border-grey);border-radius:10px;padding:.7rem .85rem;font-size:.95rem;color:var(--text);transition:.15s}
.login-body input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(124,194,66,.18)}
.login-btn{width:100%;margin-top:1.3rem;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border:none;border-radius:10px;padding:.8rem;font-weight:800;font-size:.95rem;letter-spacing:.5px;cursor:pointer;transition:.15s}
.login-btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.login-err{background:rgba(230,57,70,.1);color:var(--coral);border-radius:8px;padding:.6rem .8rem;font-size:.8rem;margin-top:1rem;text-align:center;display:none}
.login-hint{font-size:.7rem;color:var(--text-mut);text-align:center;margin-top:1.1rem;line-height:1.5;border-top:1px dashed var(--border-grey);padding-top:.9rem}

/* ============ APP SHELL ============ */
.app{display:none;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}
.app.on{display:grid}
/* sidebar */
.sidebar{background:var(--navy);color:#cdd6df;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sb-brand{padding:1.2rem 1.1rem;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand img{max-width:155px;width:82%;height:auto;display:block}
.sb-brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--green-dark));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.05rem;flex-shrink:0}
.sb-brand .nm{font-weight:800;color:#fff;font-size:.92rem;letter-spacing:.4px;line-height:1.1}.sb-brand .nm small{display:block;font-size:.6rem;font-weight:600;color:var(--green-light);letter-spacing:1.5px;text-transform:uppercase}
.sb-section{font-size:.6rem;font-weight:700;color:#6b7c8d;text-transform:uppercase;letter-spacing:1.2px;padding:1rem 1.2rem .35rem}
.sb-link{display:flex;align-items:center;gap:.7rem;padding:.6rem 1.2rem;cursor:pointer;font-size:.85rem;font-weight:600;color:#b9c4d0;border-left:3px solid transparent;transition:.12s}
.sb-link:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-link.act{background:rgba(124,194,66,.16);color:#fff;border-left-color:var(--green)}
.sb-link .ic{width:20px;text-align:center;font-size:1rem;flex-shrink:0}
.sb-link .bdg{margin-left:auto;background:rgba(255,255,255,.12);border-radius:10px;padding:.05rem .45rem;font-size:.65rem;font-weight:700}
.sb-link.act .bdg{background:var(--green);color:#fff}
.sb-foot{margin-top:auto;padding:.9rem 1rem;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:.6rem}
.sb-foot .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-deep));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.9rem;flex-shrink:0}
.sb-foot .info{flex:1;min-width:0}.sb-foot .info .n{font-size:.82rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb-foot .info .r{font-size:.66rem;color:var(--green-light);text-transform:uppercase;letter-spacing:.5px}
.sb-foot .out{background:rgba(255,255,255,.1);border:none;color:#cdd6df;width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:.95rem;flex-shrink:0;transition:.12s}.sb-foot .out:hover{background:var(--coral);color:#fff}
/* sidebar réduite (icônes seules) */
.sb-toggle{background:#f0f3ee;border:none;width:38px;height:38px;border-radius:9px;cursor:pointer;font-size:1.05rem;color:var(--navy);flex-shrink:0;transition:.12s;line-height:1}
.sb-toggle:hover{background:var(--green);color:#fff}
.app.collapsed{grid-template-columns:64px 1fr}
.app.collapsed .sb-brand{display:none}
.app.collapsed .sb-section{display:none}
.app.collapsed .sb-link{justify-content:center;padding:.7rem 0;gap:0}
.app.collapsed .sb-link .lbl,.app.collapsed .sb-link .bdg{display:none}
.app.collapsed .sb-link .ic{width:auto;font-size:1.2rem}
.app.collapsed .sb-foot{flex-direction:column;gap:.5rem;padding:.8rem 0;align-items:center}
.app.collapsed .sb-foot .info{display:none}

/* main */
.main{height:100vh;overflow-y:auto;background:var(--bg-soft);position:relative}
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border-grey);padding:.9rem 1.6rem;display:flex;align-items:center;gap:1rem}
.topbar h1{font-size:1.15rem;font-weight:800;color:var(--navy);letter-spacing:.3px}.topbar h1 span{color:var(--green-dark)}
.home-btn{width:42px;height:42px;border-radius:11px;background:var(--navy);border:none;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.14s}
.home-btn:hover{background:var(--navy3);transform:translateY(-1px)}
.home-btn img{max-width:100%;max-height:100%;display:block}
.topbar .sub{font-size:.74rem;color:var(--text-mut);margin-top:.05rem}
.topbar .sp{margin-left:auto;display:flex;gap:.55rem;align-items:center}
.content{padding:1.5rem 1.6rem 4rem}

/* buttons */
.btn{border:none;border-radius:9px;padding:.55rem 1rem;font-weight:700;font-size:.82rem;cursor:pointer;letter-spacing:.3px;display:inline-flex;align-items:center;gap:.4rem;transition:.13s}
.btn-pri{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff}.btn-pri:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy3)}
.btn-ghost{background:#fff;border:1.5px solid var(--border-grey);color:var(--text-soft)}.btn-ghost:hover{border-color:var(--green);color:var(--green-dark)}
.btn-danger{background:rgba(230,57,70,.1);color:var(--coral)}.btn-danger:hover{background:var(--coral);color:#fff}
.btn-sm{padding:.35rem .7rem;font-size:.74rem;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important}

/* cards / kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-bottom:1.4rem}
.kpi{background:#fff;border:1px solid var(--border-grey);border-radius:14px;padding:1.1rem 1.2rem;box-shadow:0 2px 8px rgba(26,43,61,.05);position:relative;overflow:hidden}
.kpi .kico{position:absolute;top:.9rem;right:1rem;font-size:1.5rem;opacity:.9}
.kpi .klab{font-size:.68rem;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.8px}
.kpi .kval{font-size:2.1rem;font-weight:800;color:var(--navy);line-height:1.1;margin-top:.2rem}
.kpi .ksub{font-size:.72rem;color:var(--text-mut);margin-top:.15rem}
.kpi.accent{background:linear-gradient(135deg,var(--green-dark),var(--green-deep));border:none;color:#fff}
.kpi.accent .klab,.kpi.accent .ksub{color:rgba(255,255,255,.85)}.kpi.accent .kval{color:#fff}

.panel{background:#fff;border:1px solid var(--border-grey);border-radius:14px;box-shadow:0 2px 8px rgba(26,43,61,.05);margin-bottom:1.4rem}
.panel-h{padding:.95rem 1.2rem;border-bottom:1px solid var(--border-grey);display:flex;align-items:center;gap:.7rem}
.panel-h h3{font-size:.92rem;font-weight:800;color:var(--navy);letter-spacing:.3px}.panel-h .sp{margin-left:auto}
.panel-b{padding:1.1rem 1.2rem}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:1.4rem;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}

/* pipeline */
.pipe-row{display:flex;align-items:center;gap:.8rem;margin-bottom:.55rem;font-size:.82rem}
.pipe-row .pl{width:150px;font-weight:600;color:var(--text-soft);flex-shrink:0;display:flex;align-items:center;gap:.4rem}
.pipe-row .pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pipe-row .pbar{flex:1;height:13px;background:#f0f3ee;border-radius:7px;overflow:hidden}
.pipe-row .pfill{height:100%;border-radius:7px;transition:width .4s}
.pipe-row .pn{width:30px;text-align:right;font-weight:800;color:var(--navy)}

/* status badge */
.badge{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .6rem;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap}
.badge .bd{width:7px;height:7px;border-radius:50%}

/* tables */
.tbl-wrap{background:#fff;border:1px solid var(--border-grey);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(26,43,61,.05)}
.tbl-toolbar{padding:.85rem 1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border-grey)}
.bulk-bar{padding:.6rem 1rem;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;background:rgba(124,194,66,.1);border-bottom:1px solid var(--border-grey);font-size:.85rem}
.bulk-bar select{padding:.4rem .6rem;border-radius:8px;border:1px solid var(--border-grey);font-size:.82rem}
.gsearch-input{width:280px;padding:.5rem .8rem;border-radius:10px;border:1px solid var(--border-grey);font-size:.84rem;background:#fafbf8}
.gsearch-results{position:absolute;top:calc(100% + 6px);left:0;width:360px;max-height:400px;overflow:auto;background:#fff;border:1px solid var(--border-grey);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200}
.gsearch-item{padding:.6rem .8rem;border-bottom:1px solid #f1f4ee;cursor:pointer;display:flex;flex-direction:column;gap:.15rem}
.gsearch-item:last-child{border-bottom:none}
.gsearch-item:hover{background:#f6f8f2}
.gsearch-item .gs-name{font-weight:700;font-size:.85rem;color:var(--navy)}
.gsearch-item .gs-meta{font-size:.72rem;color:var(--text-mut)}
.notif-dot{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:1.5px solid #fff}
.notif-panel{position:absolute;top:calc(100% + 8px);right:0;width:340px;max-height:420px;overflow:auto;background:#fff;border:1px solid var(--border-grey);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200}
.notif-item{padding:.65rem .9rem;border-bottom:1px solid #f1f4ee;cursor:pointer;font-size:.82rem}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:#f6f8f2}
.notif-item.unread{background:rgba(124,194,66,.06)}
.notif-item .ni-msg{color:var(--text-soft)}
.notif-item .ni-date{font-size:.68rem;color:var(--text-mut);margin-top:.2rem}
.notif-panel-h{padding:.6rem .9rem;border-bottom:1px solid var(--border-grey);display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.03em}
.notif-empty{padding:1.2rem;text-align:center;color:var(--text-mut);font-size:.82rem}
.tbl-toolbar .srch{flex:1;min-width:180px;position:relative}
.tbl-toolbar .srch input{width:100%;border:1.5px solid var(--border-grey);border-radius:9px;padding:.5rem .8rem .5rem 2rem;font-size:.85rem}
.tbl-toolbar .srch input:focus{outline:none;border-color:var(--green)}
.tbl-toolbar .srch::before{content:'🔍';position:absolute;left:.65rem;top:50%;transform:translateY(-50%);font-size:.8rem;opacity:.5}
.tbl-toolbar select{border:1.5px solid var(--border-grey);border-radius:9px;padding:.5rem .7rem;font-size:.82rem;color:var(--text-soft);background:#fff;cursor:pointer}
table.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
table.tbl th{text-align:left;padding:.7rem 1rem;font-size:.66rem;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border-grey);background:#fafbf8}
table.tbl td{padding:.7rem 1rem;border-bottom:1px solid #f1f4ee;color:var(--text-soft);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr{transition:.1s}table.tbl tbody tr:hover{background:#f8fbf4}
.dossier-tag{font-family:monospace;font-size:.76rem;background:#eef3ff;color:#3358b8;border-radius:6px;padding:.12rem .45rem;font-weight:700}
.tbl-name{font-weight:700;color:var(--navy)}
.row-act{display:flex;gap:.35rem;justify-content:flex-end}
.iconbtn{background:#f0f3ee;border:none;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:.85rem;color:var(--text-soft);transition:.12s;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--green);color:#fff}
.iconbtn.del:hover{background:var(--coral)}
.empty{text-align:center;color:var(--text-mut);padding:3rem 1rem;font-size:.9rem;line-height:1.6}.empty .big{font-size:2.5rem;margin-bottom:.5rem;opacity:.6}

/* mini status select in table */
.status-sel{border:1.5px solid transparent;border-radius:20px;padding:.18rem .5rem;font-size:.72rem;font-weight:700;cursor:pointer;background:#f0f3ee}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,40,.55);backdrop-filter:blur(2px);z-index:120;display:none;align-items:flex-start;justify-content:center;padding:2.5rem 1rem;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;width:640px;max-width:100%;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .25s ease;margin:auto}
.modal.wide{width:860px}
.modal-h{padding:1.1rem 1.4rem;border-bottom:1px solid var(--border-grey);display:flex;align-items:center;gap:.7rem;position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.modal-h h3{font-size:1.05rem;font-weight:800;color:var(--navy);flex:1}
.modal-h .x{background:#f0f3ee;border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1.1rem;color:var(--text-soft)}.modal-h .x:hover{background:var(--coral);color:#fff}
.modal-b{padding:1.3rem 1.4rem}
.modal-f{padding:1rem 1.4rem;border-top:1px solid var(--border-grey);display:flex;gap:.6rem;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 16px 16px}

/* form */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem 1rem}
.fgrid.c3{grid-template-columns:1fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:.25rem}.fld.full{grid-column:1/-1}
.fld label{font-size:.7rem;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--border-grey);border-radius:9px;padding:.5rem .7rem;font-size:.86rem;color:var(--text);width:100%;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(124,194,66,.15)}
.fld textarea{resize:vertical;min-height:64px}
.sectitle{font-size:.74rem;font-weight:800;color:var(--green-dark);text-transform:uppercase;letter-spacing:.6px;margin:1.3rem 0 .6rem;padding-bottom:.3rem;border-bottom:1px solid var(--border-soft)}
.sectitle:first-child{margin-top:0}

/* permissions grid */
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .9rem;margin-top:.4rem}
.perm-item{display:flex;align-items:center;gap:.55rem;background:#fafbf8;border:1px solid var(--border-grey);border-radius:9px;padding:.5rem .7rem;font-size:.8rem;color:var(--text-soft);cursor:pointer}
.perm-item input{width:17px;height:17px;accent-color:var(--green-dark);cursor:pointer}
.perm-item:hover{border-color:var(--green-light)}

/* settings list */
.cfg-list{display:flex;flex-direction:column;gap:.5rem}
.cfg-item{display:flex;align-items:center;gap:.7rem;background:#fafbf8;border:1px solid var(--border-grey);border-radius:10px;padding:.55rem .8rem}
.cfg-item .grip{cursor:grab;color:#b6c0ca;font-size:1rem}
.col-item{cursor:default}.col-item .grip{cursor:grab}
.info-row{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid #f1f4ee;font-size:.86rem}
.info-row:last-child{border-bottom:none}
.info-row .il{color:var(--text-mut);font-weight:600;flex-shrink:0}
.info-row .iv{color:var(--navy);font-weight:600;text-align:right;word-break:break-word}
.zone-box{display:flex;align-items:center;gap:1rem;background:linear-gradient(135deg,#fff,var(--bg-soft));border:1px solid var(--border);border-radius:14px;padding:.8rem 1.2rem;margin-bottom:1.2rem;box-shadow:0 2px 8px rgba(26,43,61,.05)}
.zone-box .zinfo{display:flex;flex-direction:column}
.zone-box .zl{font-size:.66rem;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.7px}
.zone-box .zaddr{font-size:.92rem;font-weight:700;color:var(--navy);margin-top:.1rem}
.zone-box .zbig{margin-left:auto;font-size:1.6rem;font-weight:800;color:#fff;background:var(--green-dark);border-radius:12px;min-width:64px;height:52px;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.zbig.z-H1{background:var(--blue)}.zbig.z-H2{background:var(--green-dark)}.zbig.z-H3{background:var(--orange)}.zbig.z-na{background:#9aa5b1}
.cmt{background:#fafbf8;border:1px solid var(--border-grey);border-radius:10px;padding:.6rem .8rem}
.cmt-txt{font-size:.86rem;color:var(--text);line-height:1.5}
.cmt-meta{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.4rem;font-size:.7rem;color:var(--text-mut);font-weight:600}
.deal-panel{border:1px solid var(--green-dark);box-shadow:0 2px 10px rgba(124,194,66,.12)}
.deal-panel .panel-h{background:linear-gradient(135deg,var(--bg-soft),#fff)}
.deal-fields{display:flex;flex-direction:column;gap:.65rem}
.deal-fields .fld{width:100%}
.grid-bottom{display:grid;grid-template-columns:1.7fr 1fr;gap:1.2rem;margin-top:0}
@media(max-width:900px){.grid-bottom{grid-template-columns:1fr}}
.deal-prime{font-size:1.25rem;font-weight:800;color:var(--green-deep);padding:.2rem 0;line-height:1.1}
.deal-tag{background:var(--green-dark);color:#fff;font-weight:700;font-size:.74rem;padding:.22rem .6rem;border-radius:20px}
.deal-info{font-size:.74rem;margin-top:.5rem;min-height:1em}

   RESPONSIVE MOBILE — menu en tiroir, tableaux défilants,

}

<script>
/* ====================================================================
   CRM EGN RÉNOVATION — moteur (données en localStorage)
   ==================================================================== */
const K={users:'egncrm_users',recs:'egncrm_recs',stat:'egncrm_statuses',rdv:'egncrm_rdvs',
  prod:'egncrm_products',src:'egncrm_sources',team:'egncrm_teams',set:'egncrm_settings',
  items:'egncrm_items',factures:'egncrm_factures_poseurs',
  sess:'egncrm_session',cnt:'egncrm_counter'};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const _localSave=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
/* ---- synchronisation Supabase (étape 3) : miroir automatique des clés locales ---- */
const SYNC_TABLES=[
  {key:'egncrm_recs',table:'records',shape:'record'},
  {key:'egncrm_rdvs',table:'rdvs',shape:'rdv'},
  {key:'egncrm_statuses',table:'cfg_statuses',shape:'blob'},
  {key:'egncrm_products',table:'cfg_operations',shape:'blob'},
  {key:'egncrm_sources',table:'cfg_sources',shape:'blob'},
  {key:'egncrm_teams',table:'cfg_equipes',shape:'blob'},
  {key:'egncrm_doctypes',table:'cfg_doctypes',shape:'blob'},
  {key:'egncrm_vt',table:'cfg_vt',shape:'blob'},
  {key:'egncrm_auditeurs',table:'cfg_auditeurs',shape:'blob'},
  {key:'egncrm_delegataires',table:'cfg_delegataires',shape:'blob'},
  {key:'egncrm_mailtpl',table:'cfg_mailtpl',shape:'blob'},
  {key:'egncrm_items',table:'cfg_items',shape:'blob'},
  {key:'egncrm_sav',table:'sav_tickets',shape:'sav'},
  {key:'egncrm_poseurs',table:'cfg_poseurs',shape:'blob'},
  {key:'egncrm_coefsu',table:'cfg_uvalues',shape:'blob'},
  {key:'egncrm_pac',table:'cfg_pac',shape:'blob'},
  {key:'egncrm_doctemplates',table:'cfg_doc_templates',shape:'blob'},
  {key:'egncrm_settings',table:'cfg_societe',shape:'single'}
];
function save(k,v){
  _localSave(k,v);
  if(!ME)return; // pas encore connecté : seed() initialise des valeurs par défaut en local uniquement
  const cfg=SYNC_TABLES.find(c=>c.key===k);
  if(cfg)pushTable(cfg,v);
}
async function pushTable(cfg,v){
  try{
    if(cfg.shape==='single'){
      await SUPA.from(cfg.table).upsert({id:'main',data:v||{},updated_at:new Date().toISOString()});
      return;
    }
    const arr=Array.isArray(v)?v:[];
    let rows;
    if(cfg.shape==='record')rows=arr.map(r=>({id:r.id,user_id:r.userId||null,dossier:r.dossier||null,data:r,updated_at:new Date().toISOString()}));
    else if(cfg.shape==='rdv')rows=arr.map(r=>({id:r.id,record_id:r.recordId||null,user_id:r.userId||null,data:r}));
    else if(cfg.shape==='sav')rows=arr.map(x=>({id:x.id,record_id:x.recordId||null,data:x,created_at:x.created?new Date(x.created).toISOString():new Date().toISOString()}));
    else rows=arr.map(x=>({id:x.id,data:x,updated_at:new Date().toISOString()}));
    if(rows.length)await SUPA.from(cfg.table).upsert(rows);
    // NB : les suppressions ne se déduisent jamais d'une comparaison avec le cache local
    // (qui peut être partiel/périmé selon les droits de l'utilisateur) — voir deleteRemoteRow(),
    // appelée explicitement par chaque fonction de suppression (delRec, delCfg, delStatus...).
  }catch(e){console.error('[sync push]',cfg.table,e);toast('⚠️ Synchronisation Supabase échouée ('+cfg.table+')','err');}
}
async function deleteRemoteRow(localKey,id){
  const cfg=SYNC_TABLES.find(c=>c.key===localKey);
  if(!cfg||!ME||!id)return;
  try{await SUPA.from(cfg.table).delete().eq('id',id);}
  catch(e){console.error('[sync delete]',cfg.table,e);toast('⚠️ Suppression Supabase échouée ('+cfg.table+')','err');}
}
async function pullTable(cfg){
  try{
    const{data,error}=await SUPA.from(cfg.table).select('*');
    if(error)throw error;
    if(cfg.shape==='single'){
      const row=(data||[])[0];
      if(row)_localSave(cfg.key,row.data);
      else{const local=load(cfg.key,null);if(local)await pushTable(cfg,local);} // rien côté Supabase : on y pousse les valeurs locales par défaut
      return;
    }
    if(!(data||[]).length){
      const local=load(cfg.key,[]);
      if(local.length){await pushTable(cfg,local);return;} // 1er lancement : Supabase est vide, on publie les valeurs par défaut locales au lieu de les effacer
    }
    const arr=(data||[]).map(row=>({...row.data,id:row.id}));
    _localSave(cfg.key,arr);
  }catch(e){console.error('[sync pull]',cfg.table,e);}
}
async function pullProfiles(){
  try{
    const{data,error}=await SUPA.from('profiles').select('*');
    if(error)throw error;
    const users=(data||[]).map(p=>({id:p.id,code:p.code,prenom:p.prenom,nom:p.nom,email:p.email,team:p.team,role:p.role,perms:p.perms||{},active:p.active,assignedUsers:p.assigned_users||[],sourceId:p.source_id||'',created:p.created_at?new Date(p.created_at).getTime():Date.now()}));
    _localSave(K.users,users);
  }catch(e){console.error('[sync pull] profiles',e);}
}
async function pushAssignedUsers(userId,assignedUsers,sourceId){
  try{await SUPA.from('profiles').update({assigned_users:assignedUsers||[],source_id:sourceId||null}).eq('id',userId);}
  catch(e){console.error('[sync] assigned_users/source',e);toast('⚠️ Synchronisation des accès/source affiliée échouée','err');}

/* ---- déperditions thermiques — méthode NF EN 12831 simplifiée (estimation) ----
   Q (kW) = Σ [U (W/m².K) × Surface (m²) × ΔT (K)] / 1000 pour chaque paroi, + ventilation, + majoration ponts thermiques.
   Réservé Admin/Super Admin. Résultat toujours indicatif ("estimé"), pas un calcul réglementaire certifié. */
const TBASE_ZONE={H1:-10,H2:-7,H3:-2};
const PONTS_THERMIQUES_FORFAIT=0.20; // +20%, valeur usuelle par défaut
const MARGE_SECURITE_DIM=0.20; // +20% sur la puissance dimensionnée
function coefU(typeId){const list=load('egncrm_coefsu',[]);const c=list.find(x=>x.id===typeId);return c?(parseFloat(c.uValue)||0):0;}
function computeDeperditions(r){
  const e=etudeOf(r);
  const zone=zoneClimatiqueOf(r);
  const tbase=TBASE_ZONE[zone];
  if(tbase==null)return null; // zone climatique inconnue (CP manquant/hors table)
  const ti=e.tempInterieure!=null?e.tempInterieure:20;
  const dT=ti-tbase;
  if(dT<=0)return null;
  const uMur=coefU(e.typeMur),uFen=coefU(e.typeFenetre),uPb=coefU(e.typePlancherBas),uPh=coefU(e.typePlancherHaut);
  const qMurs=(uMur*(e.surfaceMurs||0)*dT)/1000;
  const qFenetres=(uFen*(e.surfaceFenetres||0)*dT)/1000;
  const qPlancherBas=(uPb*(e.surfacePlancherBas||0)*dT)/1000;
  const qPlancherHaut=(uPh*(e.surfacePlancherHaut||0)*dT)/1000;
  const qVentilation=(0.34*(e.volumeChauffe||0)*(e.tauxRenouvAir!=null?e.tauxRenouvAir:0.6)*dT)/1000;
  const sousTotal=qMurs+qFenetres+qPlancherBas+qPlancherHaut+qVentilation;
  const qPonts=sousTotal*PONTS_THERMIQUES_FORFAIT;
  const total=sousTotal+qPonts;
  const puissanceDimensionnee=total*(1+MARGE_SECURITE_DIM);
  const postes=[
    {label:'Renouvellement d\'air (ventilation)',kw:qVentilation},
    {label:'Murs',kw:qMurs},
    {label:'Fenêtres et portes',kw:qFenetres},
    {label:'Ponts thermiques (forfait +'+(PONTS_THERMIQUES_FORFAIT*100)+'%)',kw:qPonts},
    {label:'Plancher bas',kw:qPlancherBas},
    {label:'Plancher haut / combles',kw:qPlancherHaut}
  ].map(p=>({...p,part:total>0?(p.kw/total*100):0})).sort((a,b)=>b.kw-a.kw);
  return{zone,tbase,ti,dT,postes,total,puissanceDimensionnee,margePct:MARGE_SECURITE_DIM*100};
}
/* ---- Facteur R (BAT-TH-163 et fiches similaires) = puissance PAC / puissance totale chaufferie (PAC + appoint) ---- */
/* ---- sélection automatique de la PAC la plus adaptée à la puissance requise ----
   Choisit la plus petite PAC du catalogue qui couvre le besoin ; à défaut, la plus puissante disponible. */
/* ---- Thermitube / AGRI-EQ-108 : métrage linéaire, devis estimé, cumac indicatif ----
   Métrage linéaire = Longueur de la serre × Nb rangs par chapelle × Nb chapelles (sauf saisie manuelle qui prévaut).
   kWh cumac (indicatif) = 390 × Surface de la serre (m²) — coefficient fourni par l'utilisateur pour AGRI-EQ-108. */
const THERMITUBE_COEF_CUMAC=390;
function computeThermitube(r){
  const e=etudeOf(r);
  const surface=surfaceFieldValue(r);
  const auto=(e.longueurSerre||0)*(e.nbRangsChapelle||0)*(e.nbChapelles||0);
  const metrage=(e.metrageLineaireManuel!=null&&e.metrageLineaireManuel!=='')?parseFloat(e.metrageLineaireManuel):auto;
  const s=getSettings();
  const prixMl=s.tarifThermitube||0;
  const coutCalcule=metrage*prixMl; // coût théorique métrage × tarif — indicatif uniquement, sert de comparaison
  const cumacEstime=surface?Math.round(THERMITUBE_COEF_CUMAC*surface):0;
  const primeCEE=(dealOf(r).prime)||0;
  const devisEstime=primeCEE; // dans l'étude uniquement : le devis présenté = la prime CEE (reste à payer = 0€) — géré manuellement partout ailleurs (Comptabilité)
  return{surface,auto,metrage,prixMl,coutCalcule,devisEstime,primeCEE,cumacEstime,manuel:e.metrageLineaireManuel!=null&&e.metrageLineaireManuel!==''};
}
function bestPacFor(puissanceRequise){
  const list=load('egncrm_pac',[]);
  if(!list.length||!puissanceRequise)return null;
  const suffisantes=list.filter(p=>(parseFloat(p.puissance)||0)>=puissanceRequise).sort((a,b)=>(parseFloat(a.puissance)||0)-(parseFloat(b.puissance)||0));
  if(suffisantes.length)return suffisantes[0];
  return list.slice().sort((a,b)=>(parseFloat(b.puissance)||0)-(parseFloat(a.puissance)||0))[0];
}
function computeFacteurR(r){
  const e=etudeOf(r);
  const pac=load('egncrm_pac',[]).find(x=>x.id===e.pacCatalogueId);
  const puissancePac=pac?(parseFloat(pac.puissance)||0):0;
  const puissanceTotale=parseFloat(e.puissanceTotaleChaufferie)||0;
  if(!puissancePac||!puissanceTotale)return null;
  const pct=puissancePac/puissanceTotale*100;
  return{puissancePac,puissanceTotale,pct,r:pct>=40?1:0,conforme:pct>=40};
}

function deperditionsPreviewHtml(deperd){

  const eur=n=>(n||0).toLocaleString('fr-FR',{maximumFractionDigits:1});
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Poste de déperdition</th><th style="text-align:right">Puissance</th><th style="text-align:right">Part</th></tr></thead><tbody>
    ${deperd.postes.map(p=>`<tr><td>${esc(p.label)}</td><td style="text-align:right">${eur(p.kw)} kW</td><td style="text-align:right">${eur(p.part)} %</td></tr>`).join('')}
    <tr style="font-weight:700"><td>Déperditions totales</td><td style="text-align:right">${eur(deperd.total)} kW</td><td style="text-align:right">100 %</td></tr>
    <tr style="font-weight:700;color:var(--green-deep)"><td>Puissance dimensionnée (+${deperd.margePct}%)</td><td style="text-align:right" colspan="2">${eur(deperd.puissanceDimensionnee)} kW</td></tr>
  </tbody></table></div><p class="muted" style="font-size:.7rem;margin-top:.3rem">ΔT = ${deperd.ti}°C (intérieur) − ${deperd.tbase}°C (Tbase zone ${deperd.zone}) = ${deperd.dT} K · Estimation indicative, pas un calcul réglementaire certifié.</p>`;
}
function factRPreviewHtml(factR){

const ETUDE_PHOTO_FIELDS={
  chaufferieGrande:{col:'photoChaufferieGrande',label:'Photo de la chaufferie (grand format, couverture)'},
  chaufferie:{col:'photoChaufferie',label:'Photo de la chaufferie'},

};
async function uploadEtudePhoto(recId,key,file){
  if(!file)return;
  const cfg=ETUDE_PHOTO_FIELDS[key];if(!cfg)return;
  const r=recById(recId);if(!r)return;
  const e=etudeOf(r);
  const path=`${recId}/etude-${key}-${uid()}-${file.name}`.replace(/[^a-zA-Z0-9/_.\-]/g,'_');
  try{
    const{error}=await SUPA.storage.from(ATTACH_BUCKET).upload(path,file,{contentType:file.type||undefined});
    if(error)throw error;
    const oldPath=e[cfg.col];
    e[cfg.col]=path;
    await persistEtude(recId);
    if(oldPath)try{await SUPA.storage.from(ATTACH_BUCKET).remove([oldPath]);}catch(err){}
    toast('Photo ajoutée ✓','ok');
    renderEtudePanel(recId);
  }catch(err){console.error('[uploadEtudePhoto]',err);toast('Échec de l\'envoi de la photo : '+(err.message||err),'err');}
}
async function removeEtudePhoto(recId,key){
  const cfg=ETUDE_PHOTO_FIELDS[key];if(!cfg)return;
  const r=recById(recId);if(!r)return;
  const e=etudeOf(r);
  const path=e[cfg.col];
  if(path)try{await SUPA.storage.from(ATTACH_BUCKET).remove([path]);}catch(err){}
  e[cfg.col]='';
  await persistEtude(recId);
  renderEtudePanel(recId);
}
async function etudePhotoThumbUrl(path){
  if(!path)return '';
  try{const{data,error}=await SUPA.storage.from(ATTACH_BUCKET).createSignedUrl(path,300);if(error)throw error;return data.signedUrl;}
  catch(e){console.error('[etudePhotoThumbUrl]',e);return '';}
}
function etudePhotoFieldHtml(recId,key,path){
  const cfg=ETUDE_PHOTO_FIELDS[key];
  const inputId='etph_'+key;
  return `<div class="fld">
    <label>${cfg.label}</label>
    ${path?`<div style="margin-bottom:.4rem" id="${inputId}_thumb"><span class="muted" style="font-size:.72rem">⏳ Chargement de l'aperçu…</span></div>`:''}
    <input type="file" accept="image/*" id="${inputId}" onchange="uploadEtudePhoto('${recId}','${key}',this.files[0])">
    ${path?`<button class="btn btn-ghost btn-sm" style="margin-top:.3rem" onclick="removeEtudePhoto('${recId}','${key}')">🗑️ Retirer la photo</button>`:''}
  </div>`;
}
async function loadEtudePhotoThumbs(recId){
  const r=recById(recId);if(!r)return;
  const e=etudeOf(r);
  for(const key in ETUDE_PHOTO_FIELDS){
    const cfg=ETUDE_PHOTO_FIELDS[key];const path=e[cfg.col];
    const el=document.getElementById('etph_'+key+'_thumb');
    if(!path||!el)continue;
    const url=await etudePhotoThumbUrl(path);
    if(el)el.innerHTML=url?`<img src="${url}" style="max-height:90px;border-radius:6px;border:1px solid var(--border-grey)">`:`<span class="muted" style="font-size:.72rem">Aperçu indisponible</span>`;
  }
}
function suggestPac(recId){
  const r=recById(recId);if(!r)return;
  const e=etudeOf(r);
  // recapture les champs de déperditions actuellement saisis dans le formulaire
  e.tempInterieure=parseFloat(String(val('et_ti')||'').replace(',','.'));
  e.surfaceMurs=parseFloat(String(val('et_smur')||'').replace(',','.'))||null;
  e.typeMur=val('et_tmur')||'';
  e.surfaceFenetres=parseFloat(String(val('et_sfen')||'').replace(',','.'))||null;
  e.typeFenetre=val('et_tfen')||'';
  e.surfacePlancherBas=parseFloat(String(val('et_spb')||'').replace(',','.'))||null;
  e.typePlancherBas=val('et_tpb')||'';
  e.surfacePlancherHaut=parseFloat(String(val('et_sph')||'').replace(',','.'))||null;
  e.typePlancherHaut=val('et_tph')||'';
  e.volumeChauffe=parseFloat(String(val('et_vol')||'').replace(',','.'))||null;
  e.tauxRenouvAir=parseFloat(String(val('et_taux')||'').replace(',','.'));
  const deperd=computeDeperditions(r);
  if(!deperd||!deperd.puissanceDimensionnee){toast('Renseignez d\'abord les surfaces / zone climatique pour calculer le besoin','err');return;}
  const suggested=bestPacFor(deperd.puissanceDimensionnee);
  if(!suggested){toast('Aucune PAC dans le catalogue — ajoutez-en dans Paramètres ▸ Solutions PAC','err');return;}
  e.pacCatalogueId=suggested.id;
  const sel=document.getElementById('et_pac');if(sel)sel.value=suggested.id;
  const note=document.getElementById('et_pac_note');
  if(note)note.innerHTML=`<p class="muted" style="font-size:.72rem;color:var(--green-deep)">✓ PAC suggérée automatiquement : ${esc(suggested.name)} (${suggested.puissance} kW ≥ besoin de ${deperd.puissanceDimensionnee.toFixed(1)} kW)</p>`;
  document.getElementById('et_deperd_preview').innerHTML=deperditionsPreviewHtml(deperd);
  document.getElementById('et_factr_preview').innerHTML=factRPreviewHtml(computeFacteurR(r));
  toast('PAC suggérée : '+suggested.name,'ok');
}
async function fetchEtudePhotoDataUrl(path){
  if(!path)return '';
  try{
    const{data,error}=await SUPA.storage.from(ATTACH_BUCKET).download(path);
    if(error)throw error;
    return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(data);});
  }catch(e){console.error('[fetchEtudePhotoDataUrl]',path,e);return '';}
}

function coordsFor(rec){
  if(rec.lat&&rec.lng)return [rec.lat,rec.lng];
  let d=rec.dept||deptFromCP(rec.cp);
  let c=DEPT[d];
  if(!c)return null;
  // léger décalage pour éviter la superposition exacte
  const j=(rec.id||'').split('').reduce((a,ch)=>a+ch.charCodeAt(0),0);
  return [c[0]+((j%20)-10)/120, c[1]+((Math.floor(j/3)%20)-10)/90];
}

function rdvIntervenantOptions(type,selectedId){

async function bulkDelete(){
  const isAdmin=ME&&(ME.role==='superadmin'||ME.role==='admin');
  if(!isAdmin){toast('Réservé aux administrateurs','err');return;}
  const n=REC_SELECTED.size;if(!n)return;
  modalConfirm(`Supprimer ${n} dossier${n>1?'s':''} ?`,'Cette action est définitive (RDV liés et pièces jointes inclus).',async()=>{
    const ids=[...REC_SELECTED];
    let recs=getRecs();let rdvsAll=getRdvs();
    for(const id of ids){
      const rec=recs.find(x=>x.id===id);
      if(rec&&rec.docs)for(const d of rec.docs){try{if(d.path)await SUPA.storage.from(ATTACH_BUCKET).remove([d.path]);}catch(e){console.error('[storage remove]',e);}try{await idbDel(d.id);}catch(e){}}
      const linkedRdvs=rdvsAll.filter(r=>r.recordId===id);
      for(const rd of linkedRdvs)await deleteRemoteRow(K.rdv,rd.id);
      await deleteRemoteRow(K.recs,id);
    }
    recs=recs.filter(r=>!ids.includes(r.id));
    rdvsAll=rdvsAll.filter(r=>!ids.includes(r.recordId));
    save(K.recs,recs);save(K.rdv,rdvsAll);
    REC_SELECTED.clear();
    closeModal();buildNav();
    CUR==='clients'?applyRecFilter('clients'):applyRecFilter('leads');
    toast(`${n} dossier${n>1?'s':''} supprimé${n>1?'s':''} ✓`,'ok');
    logActivity('action',`🗑️ Suppression groupée de ${n} dossier(s)`);
  });
}

function colExportVal(r,key){

function runExport(){
  const scope=val('exp_scope');
  let recs;
  if(scope==='selection')recs=REC_LAST_LIST.filter(r=>REC_SELECTED.has(r.id));
  else if(scope==='filtered')recs=REC_LAST_LIST.slice();
  else{
    recs=visibleRecs();
    const sts=getStatuses();const cIds=sts.filter(s=>s.phase==='client').map(s=>s.id);
    recs=REC_MODE==='clients'?recs.filter(r=>cIds.includes(r.statusId)):recs.filter(r=>!cIds.includes(r.statusId));
    if(scope==='access'){const uid2=val('exp_access');if(!uid2){toast('Choisissez un accès','err');return;}recs=recs.filter(r=>r.userId===uid2);}
    else if(scope==='status'){const sid=val('exp_status');if(!sid){toast('Choisissez un statut','err');return;}recs=recs.filter(r=>r.statusId===sid);}
  }
  const cols=EXPORT_COLS.filter(c=>c.checked);
  if(!cols.length){toast('Choisissez au moins une colonne','err');return;}
  if(!recs.length){toast('Aucun dossier à exporter pour cette sélection','err');return;}
  const rows=recs.map(r=>{const o={};cols.forEach(c=>{o[COLS[c.key].label]=colExportVal(r,c.key);});return o;});
  const fmt=(document.querySelector('input[name="exp_fmt"]:checked')||{value:'xlsx'}).value;

  const fname=`export_${REC_MODE}_${new Date().toISOString().slice(0,10)}.${fmt}`;
  XLSX.writeFile(wb,fname,{bookType:fmt});
  closeModal();
  toast(`Export généré : ${rows.length} dossier${rows.length>1?'s':''} ✓`,'ok');
  logActivity('action',`⬇️ Export ${fmt.toUpperCase()} de ${rows.length} dossier(s) (${REC_MODE})`);
}

const ALL_COL_KEYS=['dossier','name','tel','telFixe','email','ville','dept','adresse','siret','fonction','nomSite','operation','statut','source','intervenant','zone','delegataire','prime','created','updated'];
const DEFAULT_VISIBLE=['dossier','name','tel','ville','operation','statut','source'];
function defaultCols(){return ALL_COL_KEYS.map(k=>({key:k,visible:DEFAULT_VISIBLE.includes(k)}));}
function getCols(mode){
  const key=mode==='clients'?'egncrm_cols_clients':'egncrm_cols_leads';
  let saved=load(key,null);
  if(!saved||!Array.isArray(saved))return defaultCols();
  saved=saved.filter(c=>ALL_COL_KEYS.includes(c.key));
  const have=new Set(saved.map(c=>c.key));
  ALL_COL_KEYS.forEach(k=>{if(!have.has(k))saved.push({key:k,visible:false});});
  return saved;
}
function saveColsCfg(mode,cfg){save(mode==='clients'?'egncrm_cols_clients':'egncrm_cols_leads',cfg);}
let COLWORK=[],COLMODE='leads',COLDRAG=null;
function openColsModal(mode){

  renderColList();
}
function renderColList(){
  const el=document.getElementById('colList');if(!el)return;
  const isAdminCompta=ME&&(ME.role==='superadmin'||ME.role==='admin');
  const RESTRICTED_COLS=['prime','delegataire'];
  const list=isAdminCompta?COLWORK:COLWORK.filter(c=>!RESTRICTED_COLS.includes(c.key));
  el.innerHTML='<div class="cfg-list">'+list.map((c)=>{const i=COLWORK.indexOf(c);return `<div class="cfg-item col-item" draggable="true" ondragstart="colDragStart(event,${i})" ondragover="event.preventDefault()" ondrop="colDrop(event,${i})"><span class="grip">⠿</span><label style="display:flex;align-items:center;gap:.55rem;flex:1;cursor:pointer;font-weight:600;color:var(--navy)"><input type="checkbox" ${c.visible?'checked':''} onchange="COLWORK[${i}].visible=this.checked" style="width:17px;height:17px;accent-color:var(--green-dark);cursor:pointer"> ${esc(COLS[c.key].label)}</label><span class="sp"><button class="iconbtn" onclick="colMove(${i},-1)" style="${i===0?'opacity:.3;pointer-events:none':''}">↑</button><button class="iconbtn" onclick="colMove(${i},1)" style="${i===COLWORK.length-1?'opacity:.3;pointer-events:none':''}">↓</button></span></div>`;}).join('')+'</div>';
}
function colMove(i,d){const j=i+d;if(j<0||j>=COLWORK.length)return;const t=COLWORK[i];COLWORK[i]=COLWORK[j];COLWORK[j]=t;renderColList();}
function colDragStart(e,i){COLDRAG=i;e.dataTransfer.effectAllowed='move';}
function colDrop(e,i){e.preventDefault();if(COLDRAG==null||COLDRAG===i)return;const [m]=COLWORK.splice(COLDRAG,1);COLWORK.splice(i,0,m);COLDRAG=null;renderColList();}
function colReset(){COLWORK=defaultCols();renderColList();}
function colApply(){saveColsCfg(COLMODE,COLWORK);closeModal();applyRecFilter(COLMODE);toast('Colonnes mises à jour ✓','ok');}

/* ---- comptabilité du dossier (Super Admin / Admin) : faux frais & rentabilité ---- */
function comptaOf(r){
  if(!COMPTA_CACHE[r.id])COMPTA_CACHE[r.id]=rowToCompta(null); // valeurs par défaut en attendant le chargement async
  return COMPTA_CACHE[r.id];
}
function surfaceFieldValue(r){
  const op=getProducts().find(p=>p.id===r.productId);if(!op)return 0;
  const fields=op.fields||[];
  // 1) champ standard (clé stable "surface_m2")
  let f=fields.find(x=>x.key==='surface_m2');
  let v=f?(r.opFields&&r.opFields[f.id]):null;
  // 2) repli : tout champ numérique dont le libellé contient "surface" (ex : ancien champ créé à la main avant l'ajout du champ standard)
  if(v==null||v===''){
    const alt=fields.filter(x=>x.type==='number'&&/surface/i.test(x.label||''));
    for(const a of alt){const av=r.opFields&&r.opFields[a.id];if(av!=null&&av!==''){v=av;break;}}
  }
  return parseFloat(String(v||0).replace(',','.'))||0;
}
/* ---- override manuel simple : si un montant est saisi à la main, il prend la place du calcul auto ---- */
function effectiveCost(r,key,autoFn){
  const c=comptaOf(r);
  const ovr=(c.overrides||{})[key];
  const auto=autoFn(r);
  if(ovr!=null&&ovr!=='')return{...auto,montant:parseFloat(ovr)||0,overridden:true};
  return{...auto,overridden:false};
}
function poseurCostFor(r){
  const c=comptaOf(r);
  if(!c.poseurUserId)return{mode:null,montant:0,label:'Aucun poseur assigné'};
  const fam=load('egncrm_poseurs',[]).find(f=>(f.userIds||[]).includes(c.poseurUserId));
  if(!fam)return{mode:null,montant:0,label:"Ce poseur n'appartient à aucune famille"};
  const prices=fam.prices||[];
  const rule=prices.find(p=>p.opId===r.productId)||prices.find(p=>!p.opId);
  if(!rule)return{mode:null,montant:0,label:`Aucun tarif défini pour cette opération dans « ${fam.name} »`};
  let montant=0;
  if(rule.mode==='pourcentage')montant=(c.devisTTC||0)*(rule.value||0)/100;
  else if(rule.mode==='fixe')montant=rule.value||0;
  else if(rule.mode==='jour')montant=(rule.value||0)*(c.jours||0);
  else if(rule.mode==='m2')montant=(rule.value||0)*surfaceFieldValue(r);
  const detail=rule.mode==='pourcentage'?`${rule.value}% du devis`:rule.mode==='m2'?`${rule.value} €/m²`:rule.mode==='jour'?`${rule.value} €/jour`:`${rule.value} € fixe`;
  return{mode:rule.mode,montant,label:`${fam.name} — ${detail}`};
}
function callCenterCostFor(r){
  const c=comptaOf(r);
  if(!r.sourceId)return{mode:null,montant:0,label:'Aucune source / régie sur ce dossier'};
  const src=getSources().find(s=>s.id===r.sourceId);
  if(!src)return{mode:null,montant:0,label:'Source introuvable'};
  const prices=src.prices||[];
  const rule=prices.find(p=>p.opId===r.productId)||prices.find(p=>!p.opId);
  if(!rule)return{mode:null,montant:0,label:`Aucun tarif call center défini pour cette opération sur « ${src.name} »`,src};
  let montant=0;
  if(rule.mode==='rdv')montant=(rule.value||0)*(c.nbRdv||0);
  else if(rule.mode==='m2')montant=(rule.value||0)*surfaceFieldValue(r);
  else if(rule.mode==='pourcentage')montant=(c.devisTTC||0)*(rule.value||0)/100;
  const detail=rule.mode==='m2'?`${rule.value} €/m²`:rule.mode==='pourcentage'?`${rule.value}% du devis`:`${rule.value} €/RDV`;
  return{mode:rule.mode,montant,label:`${src.name} — ${detail}`,src};
}
/* -- VT (Visite technique) & Auditeur : tarif fixe par opération, ajouté automatiquement selon le statut du dossier -- */
function statusNameOf(r){const st=statById(r.statusId);return st?st.name:'';}
function subAssignedFor(r,kind){
  const rdvs=rdvsOf(r).filter(x=>rdvKind(x.type)===kind&&x.subId).sort((a,b)=>((a.date||'')+(a.heure||'')).localeCompare((b.date||'')+(b.heure||'')));
  return rdvs.length?rdvs[rdvs.length-1]:null;
}
function subCostFor(r,kind){
  const listKey=kind==='vt'?'egncrm_vt':'egncrm_auditeurs';
  const label=kind==='vt'?'VT':'Audit';
  const c=comptaOf(r);
  const manualSubId=kind==='vt'?c.vtSubId:c.auditSubId;
  const list=load(listKey,[]);
  let sub=null;
  if(manualSubId)sub=list.find(x=>x.id===manualSubId)||null;
  if(!sub){
    const rdv=subAssignedFor(r,kind);
    if(!rdv)return{montant:0,active:true,label:`Aucun ${label==='VT'?'RDV Visite technique':'RDV Audit'} avec sous-traitant assigné, ni sélection manuelle`,sub:null};
    sub=list.find(x=>x.id===rdv.subId)||null;
  }
  if(!sub)return{montant:0,active:true,label:'Sous-traitant introuvable',sub:null};
  const prices=sub.prices||[];
  const rule=prices.find(p=>p.opId===r.productId)||prices.find(p=>!p.opId);
  if(!rule)return{montant:0,active:true,label:`Aucun tarif défini pour cette opération sur « ${sub.name} »`,sub};
  return{montant:rule.value||0,active:true,label:`${sub.name} — ${rule.value} € fixe`,sub};
}
function vtCostFor(r){return subCostFor(r,'vt');}
function auditCostFor(r){return subCostFor(r,'auditeur');}
/* -- produits installés : plusieurs lignes possibles (quantité, marques différentes) -- */
function produitLigneCost(r,ligne){
  const it=getItems().find(i=>i.id===ligne.produitId);if(!it)return{montant:0,label:'Produit introuvable',qty:ligne.qty||1};
  const qty=ligne.qty||1;
  const unit=it.mode==='m2'?(it.price||0)*surfaceFieldValue(r):(it.price||0);
  return{montant:unit*qty,label:it.name,unit,mode:it.mode,qty,item:it};
}
function produitsCostFor(r){
  const c=comptaOf(r);
  const lignes=(c.produits||[]).map(l=>({...l,calc:produitLigneCost(r,l)}));
  const montant=lignes.reduce((s,l)=>s+l.calc.montant,0);
  return{montant,lignes};
}

  const c=comptaOf(r);
  const poseurs=getUsers().filter(u=>u.role==='poseur');
  const pc=effectiveCost(r,'poseur',poseurCostFor);

  const vtC=effectiveCost(r,'vt',vtCostFor);

  const ffSociete=ffTotal-ffPoseur;
  const prime=dealOf(r).prime||0;
  const recettes=(prime||0);
  const charges=pc.montant+ccC.montant+vtC.montant+auditC.montant+prC.montant+ffTotal;
  const marge=recettes-charges;
  const margePct=recettes>0?(marge/recettes*100):0;
  const poseurLocked=factureActive(r,'poseur');

  const vtLocked=factureActive(r,'vt');
  const auditLocked=factureActive(r,'auditeur');
  const poseurAnnule=c.facturePoseur&&c.facturePoseur.statut==='annule';
  const ccAnnule=c.factureCallCenter&&c.factureCallCenter.statut==='annule';
  const vtAnnule=c.factureVt&&c.factureVt.statut==='annule';
  const audAnnule=c.factureAudit&&c.factureAudit.statut==='annule';
  const aPayerPoseur=poseurAnnule?0:pc.montant+ffPoseur;

  let prRows=prC.lignes.length?prC.lignes.map(l=>`<div class="cfg-item"><span class="nm">${l.calc.qty}× ${esc(l.calc.label)}</span><span class="tag" style="background:#eef0f2;color:#6b7785">${l.calc.mode==='m2'?'au m²':'à la pièce'}</span><span class="tag" style="background:rgba(45,125,210,.12);color:#2D7DD2">${eur(l.calc.montant)} <span style="font-size:.62rem;font-weight:500">· HT ${eur(htOf(l.calc.montant))}</span></span><span class="sp"><button class="iconbtn del" onclick="delProduitLigne('${r.id}','${l.id}')">🗑️</button></span></div>`).join(''):`<div class="muted" style="font-size:.82rem;padding:.4rem 0">Aucun produit ajouté.</div>`;
  const sourceAssignee=r.sourceId?getSources().find(s=>s.id===r.sourceId):null;
  return `<div class="panel" style="border:1.5px solid rgba(230,57,70,.25)">

    <div class="panel-b">

      <div class="fgrid c3">

  </div>`;
}
function genererRapportCompta(recId){

  const m=recordComptaMetrics(r);
  const s=getSettings();
  const eur=n=>(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
  const op=getProducts().find(o=>o.id===r.productId);

  const siege=`${r.adresse||''}${r.cp||r.ville?', ':''}${r.cp||''} ${r.ville||''}`.trim();
  const wa=recWorkAddr(r);
  const travaux=`${wa.adresse||''}${wa.cp||wa.ville?', ':''}${wa.cp||''} ${wa.ville||''}`.trim();
  const diffAddr=r.adresseTravauxDiff&&travaux&&travaux!==siege;
  const pc=m.pc,ccC=m.ccC,prC=m.prC,c=m.c;
  const ff=c.fauxFrais||[];
  // base de recette du rapport : prime CEE si le Deal est inclus, sinon montant du devis (affichage uniquement, ne change rien au CRM)
  const rptRecettes=includeDeal?m.recettes:(c.devisTTC||0);
  const rptMarge=rptRecettes-m.charges;
  const rptMargePct=rptRecettes>0?(rptMarge/rptRecettes*100):0;
  const dateStr=new Date().toLocaleDateString('fr-FR');
  const prRows=prC.lignes.length?prC.lignes.map(l=>`<tr><td>${l.calc.qty}× ${esc(l.calc.label)}</td><td>${l.calc.mode==='m2'?'au m²':'à la pièce'}</td><td style="text-align:right;color:#6b7785">${eur(htOf(l.calc.montant))}</td><td style="text-align:right">${eur(l.calc.montant)}</td></tr>`).join(''):`<tr><td colspan="4" style="color:#9aa5b1">Aucun produit installé</td></tr>`;
  const ffRows=ff.length?ff.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.origin==='poseur'?'🔧 Poseur':'🏢 Société'}</td><td style="text-align:right;color:#6b7785">${eur(htOf(x.amount))}</td><td style="text-align:right">${eur(x.amount)}</td></tr>`).join(''):`<tr><td colspan="4" style="color:#9aa5b1">Aucun faux frais</td></tr>`;
  const doc=`<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Rapport comptable — ${esc(r.dossier||'')}</title>

    table{width:100%;border-collapse:collapse;margin-top:6px}
    th,td{padding:7px 9px;border-bottom:1px solid #e5e8ec;font-size:.85rem;text-align:left}

    .totrow td{font-weight:800;border-top:2px solid #1A2B3D;border-bottom:none}
    .marge-box{margin-top:18px;padding:14px 18px;border-radius:10px;background:${rptMarge>=0?'rgba(124,194,66,.1)':'rgba(230,57,70,.08)'};display:flex;justify-content:space-between;align-items:center}
    .marge-box .lbl{font-weight:800;font-size:1rem}

    .print-btn{margin-top:30px}
    @media print{.print-btn{display:none}}
  </style></head><body>

  </div>`:''}

  <h2>Produits installés</h2>

      <tr><td>Coût Call Center${ccC.mode?' — '+esc(ccC.label):''}</td><td style="text-align:right">${eur(htOf(ccC.montant))}</td><td style="text-align:right">${eur(tvaOf(ccC.montant))}</td><td style="text-align:right">${eur(ccC.montant)}</td></tr>
      <tr><td>Coût VT — ${esc(m.vtC.label)}</td><td style="text-align:right">${eur(htOf(m.vtC.montant))}</td><td style="text-align:right">${eur(tvaOf(m.vtC.montant))}</td><td style="text-align:right">${eur(m.vtC.montant)}</td></tr>

function recordComptaMetrics(r){
  const c=comptaOf(r);
  const pc=effectiveCost(r,'poseur',poseurCostFor);
  const ccC=effectiveCost(r,'callcenter',callCenterCostFor);
  const vtC=effectiveCost(r,'vt',vtCostFor);
  const auditC=effectiveCost(r,'audit',auditCostFor);
  const prC=produitsCostFor(r);
  const ff=c.fauxFrais||[];
  const ffTotal=ff.reduce((s,x)=>s+(x.amount||0),0);
  const ffPoseur=ff.filter(x=>x.origin==='poseur').reduce((s,x)=>s+(x.amount||0),0);
  const prime=dealOf(r).prime||0;
  const recettes=prime;
  const charges=pc.montant+ccC.montant+vtC.montant+auditC.montant+prC.montant+ffTotal;
  const marge=recettes-charges;
  const margePct=recettes>0?(marge/recettes*100):0;
  const aPayerPoseur=pc.montant+ffPoseur;
  const aPayerCallCenter=ccC.montant;
  const aPayerVt=vtC.montant;
  const aPayerAudit=auditC.montant;
  return{c,pc,ccC,vtC,auditC,prC,ffTotal,ffPoseur,prime,recettes,charges,marge,margePct,aPayerPoseur,aPayerCallCenter,aPayerVt,aPayerAudit};
}

let LAST_APF_GEN=0;
async function genererFactureAgent(){

    th{background:#f4f6f8;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:#6b7785}
    tfoot td{font-weight:800;font-size:1.05rem;border-top:2px solid #1A2B3D;border-bottom:none}
    .meta{margin:18px 0;font-size:.9rem;line-height:1.7}
    .print-btn{margin-top:28px}
    @media print{.print-btn{display:none}}
  </style></head><body>
  <div class="hd">
    <div class="hd-left">
      ${s.logo?`<img class="hd-logo" src="${s.logo}" alt="Logo">`:''}
      <div><h1>Appel à facturation — ${esc(at.label)}</h1><div class="sub">${esc(s.company||'')}</div><div class="apf-num">${esc(apfNum)}</div></div>
    </div>
    <div class="sub">Édité le ${dateStr}</div>
  </div>
  <div class="meta"><b>${esc(at.label)} :</b> ${esc(agentName)}<br>${agent&&agent.email?'<b>Email :</b> '+esc(agent.email)+'<br>':''}<b>TVA :</b> ${tvaRate()}% incluse — montants dus exprimés TTC ; les colonnes HT / TVA sont fournies pour l'établissement de votre facture.</div>
  <table><thead><tr><th>N° Dossier</th><th>Client</th><th>Opération</th><th style="text-align:right">Montant HT</th><th style="text-align:right">TVA (${tvaRate()}%)</th><th style="text-align:right">Montant dû TTC</th></tr></thead>
  <tbody>${rowsHtml}</tbody>
  <tfoot><tr><td colspan="3">Total à verser</td><td style="text-align:right">${eur(htOf(total))}</td><td style="text-align:right">${eur(tvaOf(total))}</td><td style="text-align:right">${eur(total)}</td></tr></tfoot>
  </table>

    const rr=recs.find(x=>x.id===l.r.id);
    if(rr&&installStatus&&rr.statusId!==installStatus.id){rr.statusId=installStatus.id;rr.updated=Date.now();nbPasse++;}
  }
  save(K.recs,recs);
  toast(`Appel à facturation ${apfNum} généré et archivé ✓${nbPasse?` — ${nbPasse} dossier${nbPasse>1?'s':''} passé${nbPasse>1?'s':''} au statut « Installé »`:''}`,'ok');
  logActivity('action',`📄 Appel à facturation ${apfNum} généré (${at.label} — ${agentName}) — ${lignes.length} dossier${lignes.length>1?'s':''}, ${total.toLocaleString('fr-FR')} €`);
  renderComptaTabs();
}

const getDocTypes=()=>load('egncrm_doctypes',[]);
function fmtSize(b){if(!b)return '';if(b<1024)return b+' o';if(b<1048576)return (b/1024).toFixed(0)+' Ko';return (b/1048576).toFixed(1)+' Mo';}
const ATTACH_BUCKET='attachments';
// ---- ancien stockage local (IndexedDB), conservé en secours pour migrer les fichiers déjà uploadés avant l'étape 4 ----
function idbOpen(){return new Promise((res,rej)=>{const rq=indexedDB.open('egncrm_files',1);rq.onupgradeneeded=()=>{rq.result.createObjectStore('files');};rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function idbGet(key){try{const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const rq=tx.objectStore('files').get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}catch(e){return null;}}
async function idbDel(key){try{const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}catch(e){}}

async function startScanner(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});
    SCANNER_STREAM=stream;
    const v=document.getElementById('scan_video');if(v)v.srcObject=stream;
  }catch(e){toast('Impossible d\'accéder à la caméra — vérifiez les permissions','err');console.error('[scanner]',e);}
}
function scanCapture(){
  const v=document.getElementById('scan_video');const c=document.getElementById('scan_canvas');
  const img=document.getElementById('scan_img');const preview=document.getElementById('scan_preview');
  if(!v||!c)return;
  c.width=v.videoWidth||1280;c.height=v.videoHeight||720;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const dataUrl=c.toDataURL('image/jpeg',0.92);
  if(img)img.src=dataUrl;
  if(preview){preview.style.display='flex';}
}
function scanRetake(){
  const preview=document.getElementById('scan_preview');
  if(preview)preview.style.display='none';
}
function scanAddPage(){
  const c=document.getElementById('scan_canvas');if(!c)return;
  const dataUrl=c.toDataURL('image/jpeg',0.92);
  SCAN_PAGES.push(dataUrl);
  const preview=document.getElementById('scan_preview');if(preview)preview.style.display='none';
  const bar=document.getElementById('scan_pages_bar');if(bar)bar.style.display='block';
  const thumbs=document.getElementById('scan_thumbs');
  if(thumbs){
    const idx=SCAN_PAGES.length-1;
    const thumb=document.createElement('div');
    thumb.style.cssText='position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:3px';
    thumb.innerHTML=`<img src="${dataUrl}" style="height:72px;width:54px;object-fit:cover;border-radius:5px;border:1.5px solid var(--border-grey)"><span style="font-size:.62rem;color:var(--text-mut)">p.${SCAN_PAGES.length}</span><button onclick="scanDeletePage(${idx})" style="position:absolute;top:-5px;right:-5px;background:#E63946;color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>`;
    thumbs.appendChild(thumb);
  }
  const btn=document.getElementById('scan_finalize_btn');
  if(btn)btn.textContent=`✅ Finaliser le PDF (${SCAN_PAGES.length} page${SCAN_PAGES.length>1?'s':''})`;
  toast(`Page ${SCAN_PAGES.length} ajoutée ✓`,'ok');
}
function scanDeletePage(idx){
  SCAN_PAGES.splice(idx,1);
  const thumbs=document.getElementById('scan_thumbs');
  if(thumbs){thumbs.innerHTML='';SCAN_PAGES.forEach((url,i)=>{const t=document.createElement('div');t.style.cssText='position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:3px';t.innerHTML=`<img src="${url}" style="height:72px;width:54px;object-fit:cover;border-radius:5px;border:1.5px solid var(--border-grey)"><span style="font-size:.62rem;color:var(--text-mut)">p.${i+1}</span><button onclick="scanDeletePage(${i})" style="position:absolute;top:-5px;right:-5px;background:#E63946;color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>`;thumbs.appendChild(t);});}

async function scanFinalize(recId){
  if(!SCAN_PAGES.length){toast('Ajoutez au moins une page avant de finaliser','err');return;}
  const loading=document.getElementById('scan_loading');if(loading)loading.style.display='flex';
  try{
    const r=recById(recId);if(!r)throw new Error('Dossier introuvable');
    const typeEl=document.getElementById('scan_type');const nameEl=document.getElementById('scan_name');
    const typeId=typeEl?typeEl.value:'';const dts=getDocTypes();const dt=dts.find(x=>x.id===typeId);
    const rawName=nameEl&&nameEl.value.trim()?nameEl.value.trim():(dt?dt.name:'scan');
    const filename=rawName.replace(/[^a-zA-Z0-9\-_. àâäéèêëîïôùûüç]/g,'_')+'.pdf';
    // Construire un PDF minimal en pur JS (sans librairie externe)
    const pdfBytes=await buildScanPdf(SCAN_PAGES);
    const blob=new Blob([pdfBytes],{type:'application/pdf'});
    const fid=uid();const path=`${recId}/${fid}-${filename}`;
    const{error}=await SUPA.storage.from(ATTACH_BUCKET).upload(path,blob,{contentType:'application/pdf'});
    if(error)throw error;
    const recs=getRecs();const rec=recs.find(x=>x.id===recId);if(!rec)throw new Error('Dossier introuvable');
    rec.docs=rec.docs||[];
    rec.docs.push({id:fid,typeId,typeName:dt?dt.name:'Document scanné',filename,path,mime:'application/pdf',size:blob.size,date:Date.now(),user:(ME.prenom+' '+ME.nom).trim()||ME.code});
    save(K.recs,recs);
    logActivity('action',`📷 Document scanné (${SCAN_PAGES.length} p.) : ${filename} sur ${rec.dossier||recId}`,recId);
    closeScanner();openDossier(recId);toast(`PDF créé (${SCAN_PAGES.length} page${SCAN_PAGES.length>1?'s':''}) et joint ✓`,'ok');
  }catch(e){console.error('[scanFinalize]',e);toast('Échec : '+(e.message||e),'err');if(loading)loading.style.display='none';}
}
async function buildScanPdf(dataUrls){
  const A4_W=595,A4_H=842;
  const enc=s=>new TextEncoder().encode(s);
  // Lire les données JPEG de chaque image
  const imgs=dataUrls.map(url=>{
    const base64=url.split(',')[1];
    const raw=atob(base64);
    const bytes=new Uint8Array(raw.length);
    for(let j=0;j<raw.length;j++)bytes[j]=raw.charCodeAt(j);
    let iw=A4_W,ih=A4_H;
    for(let p=0;p<bytes.length-8;p++){if(bytes[p]===0xFF&&bytes[p+1]>=0xC0&&bytes[p+1]<=0xC3){ih=bytes[p+5]*256+bytes[p+6];iw=bytes[p+7]*256+bytes[p+8];break;}}
    return{bytes,iw,ih};
  });
  const n=imgs.length;
  // Plan des objets : 1=catalog, 2=pages, puis par page : imgObj, contentObj, pageObj (3 objets par page)
  // obj 1: catalog, obj 2: pages, obj 3+3i: image XObject, obj 4+3i: content stream, obj 5+3i: page
  const catalogId=1,pagesId=2;
  const imgId=i=>3+3*i;
  const contentId=i=>4+3*i;
  const pageId=i=>5+3*i;
  const totalObjs=2+3*n;
  // Construire les objets dans l'ordre et tracer les offsets
  const offsets=new Array(totalObjs+1).fill(0);
  const chunks=[];let off=0;
  const push=s=>{const b=enc(s);chunks.push(b);off+=b.length;};
  const pushRaw=b=>{chunks.push(b);off+=b.length;};
  push('%PDF-1.4\n%\xFF\xFF\n');
  // Catalog
  offsets[catalogId]=off;
  push(`${catalogId} 0 obj\n<</Type/Catalog/Pages ${pagesId} 0 R>>\nendobj\n`);
  // Pages
  offsets[pagesId]=off;
  const kids=Array.from({length:n},(_,i)=>`${pageId(i)} 0 R`).join(' ');
  push(`${pagesId} 0 obj\n<</Type/Pages/Kids[${kids}]/Count ${n}>>\nendobj\n`);
  // Pour chaque image : image XObject, content stream, page
  for(let i=0;i<n;i++){
    const{bytes,iw,ih}=imgs[i];
    const scale=Math.min(A4_W/iw,A4_H/ih);
    const sw=Math.round(iw*scale),sh=Math.round(ih*scale);
    const dx=Math.round((A4_W-sw)/2),dy=Math.round((A4_H-sh)/2);
    const imgName=`Im${i}`;
    // Image XObject
    offsets[imgId(i)]=off;
    push(`${imgId(i)} 0 obj\n<</Type/XObject/Subtype/Image/Width ${iw}/Height ${ih}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${bytes.length}>>\nstream\n`);
    pushRaw(bytes);
    push('\nendstream\nendobj\n');
    // Content stream
    const cs=`q ${sw} 0 0 ${sh} ${dx} ${dy} cm /${imgName} Do Q`;
    const csBytes=enc(cs);
    offsets[contentId(i)]=off;
    push(`${contentId(i)} 0 obj\n<</Length ${csBytes.length}>>\nstream\n`);
    pushRaw(csBytes);
    push('\nendstream\nendobj\n');
    // Page
    offsets[pageId(i)]=off;
    push(`${pageId(i)} 0 obj\n<</Type/Page/Parent ${pagesId} 0 R/MediaBox[0 0 ${A4_W} ${A4_H}]/Resources<</XObject<</${imgName} ${imgId(i)} 0 R>>>>/Contents ${contentId(i)} 0 R>>\nendobj\n`);
  }
  // xref
  const xrefOff=off;
  push(`xref\n0 ${totalObjs+1}\n`);
  push('0000000000 65535 f \n');
  for(let i=1;i<=totalObjs;i++)push(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<</Size ${totalObjs+1}/Root ${catalogId} 0 R>>\nstartxref\n${xrefOff}\n%%EOF\n`);
  // Assembler
  const total=chunks.reduce((s,c)=>s+c.length,0);
  const out=new Uint8Array(total);let pos=0;
  for(const c of chunks){out.set(c,pos);pos+=c.length;}
  return out;
}
function closeScanner(){
  if(SCANNER_STREAM){SCANNER_STREAM.getTracks().forEach(t=>t.stop());SCANNER_STREAM=null;}
  SCAN_PAGES=[];closeModal();
}
async function attachDoc(id){
  const fileEl=document.getElementById('doc_file');const typeEl=document.getElementById('doc_type');
  const file=fileEl&&fileEl.files&&fileEl.files[0];
  if(!file){toast('Sélectionnez un fichier','err');return;}
  if(!getDocTypes().length){toast('Créez d\'abord des types dans Paramètres ▸ Types de docs','err');return;}
  if(file.size>15*1048576){toast('Fichier trop volumineux (max 15 Mo)','err');return;}
  const typeId=typeEl?typeEl.value:'';const typeName=(getDocTypes().find(t=>t.id===typeId)||{}).name||'Document';
  const fid=uid();
  const path=`${id}/${fid}-${file.name}`.replace(/[^a-zA-Z0-9/_.\-]/g,'_');
  try{
    const{error}=await SUPA.storage.from(ATTACH_BUCKET).upload(path,file,{contentType:file.type||undefined});
    if(error)throw error;
    const recs=getRecs();const r=recs.find(x=>x.id===id);if(!r)return;
    r.docs=r.docs||[];
    r.docs.push({id:fid,path,typeId,typeName,filename:file.name,size:file.size,mime:file.type,date:Date.now(),user:(ME.prenom+' '+ME.nom).trim()||ME.code});
    save(K.recs,recs);openDossier(id);toast('Pièce jointe ajoutée ✓ (partagée avec les accès autorisés)','ok');
  }catch(e){console.error('[attachDoc]',e);toast('Échec de l\'envoi du fichier : '+(e.message||e),'err');}
}
async function viewDoc(fid,recId){
  try{
    const r=recId?recById(recId):null;
    const doc=r?(r.docs||[]).find(d=>d.id===fid):null;
    if(doc&&doc.path){
      const{data,error}=await SUPA.storage.from(ATTACH_BUCKET).createSignedUrl(doc.path,60);
      if(error)throw error;
      window.open(data.signedUrl,'_blank');
      return;
    }
    // secours : ancien fichier stocké localement avant l'étape 4 -> on l'ouvre et on le migre vers Supabase au passage
    const blob=await idbGet(fid);
    if(!blob){toast('Fichier introuvable','err');return;}
    const url=URL.createObjectURL(blob);
    window.open(url,'_blank');
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    if(r&&doc){
      const path=`${r.id}/${fid}-${doc.filename||'fichier'}`.replace(/[^a-zA-Z0-9/_.\-]/g,'_');
      SUPA.storage.from(ATTACH_BUCKET).upload(path,blob,{contentType:doc.mime||undefined}).then(({error})=>{
        if(!error){doc.path=path;const recs=getRecs();const rr=recs.find(x=>x.id===r.id);if(rr){rr.docs=(rr.docs||[]).map(d=>d.id===fid?doc:d);save(K.recs,recs);}idbDel(fid);}
      });
    }
  }catch(e){console.error('[viewDoc]',e);toast('Lecture impossible : '+(e.message||e),'err');}
}
function delDoc(recId,fid){
  modalConfirm('Supprimer cette pièce jointe ?','',async()=>{
    const recs=getRecs();const r=recs.find(x=>x.id===recId);
    const doc=r?(r.docs||[]).find(d=>d.id===fid):null;
    try{if(doc&&doc.path)await SUPA.storage.from(ATTACH_BUCKET).remove([doc.path]);}catch(e){console.error('[delDoc]',e);}
    try{await idbDel(fid);}catch(e){}
    if(r){r.docs=(r.docs||[]).filter(d=>d.id!==fid);save(K.recs,recs);}
    closeModal();if(DOSSIER_OPEN===recId)openDossier(recId);toast('Pièce jointe supprimée','ok');
  });
}

const getDelegataires=()=>load('egncrm_delegataires',[]);
function computeCumac(r){
  const op=getProducts().find(p=>p.id===r.productId);
  if(!op||!op.cumac)return null;
  if(op.cumac.mode==='coef'){
    const c=op.cumac;
    const fv=parseFloat((r.opFields&&r.opFields[c.field])||'')||0;
    if(!fv)return null;
    let coef=0;
    if(c.byField){const choice=(r.opFields&&r.opFields[c.byField])||'';coef=parseFloat((c.coefs&&c.coefs[choice])||0)||0;}
    else coef=parseFloat(c.coef||0)||0;
    if(!coef)return null;
    return Math.round(coef*fv);
  }
  if(op.cumac.mode==='multi'){
    const factors=op.cumac.factors||[];
    if(!factors.length)return null;
    let product=1;
    for(const f of factors){
      let v=0;
      if(f.type==='fixed')v=parseFloat(f.value)||0;
      else if(f.type==='field')v=parseFloat((r.opFields&&r.opFields[f.field])||'')||0;
      else if(f.type==='table1d'){const ch=(r.opFields&&r.opFields[f.field])||'';v=parseFloat((f.table&&f.table[ch])||0)||0;}
      else if(f.type==='table2d'){const c1=(r.opFields&&r.opFields[f.field1])||'';const c2=(r.opFields&&r.opFields[f.field2])||'';v=parseFloat((f.table&&f.table[c1+'|'+c2])||0)||0;}
      if(!v)return null;
      product*=v;
    }
    return Math.round(product);
  }
  return null;
}
function dealRecalc(){
  const delegs=getDelegataires();
  const did=(document.getElementById('deal_deleg')||{}).value||'';
  const type=(document.getElementById('deal_type')||{}).value||'classique';
  const cumac=parseFloat((document.getElementById('deal_cumac')||{}).value||'')||0;
  const d=delegs.find(x=>x.id===did);
  const valo=d?(type==='precaire'?(parseFloat(d.valoPrecaire)||0):(parseFloat(d.valoClassique)||0)):0;
  const prime=cumac/1000*valo;
  const el=document.getElementById('deal_prime');
  if(el)el.textContent=(d&&cumac&&valo)?prime.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' € TTC':'—';
  const hel=document.getElementById('deal_ht');
  if(hel)hel.textContent=(d&&cumac&&valo)?htOf(prime).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' € HT · TVA '+tvaOf(prime).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €':'—';
  const vl=document.getElementById('deal_valoinfo');
  if(vl)vl.textContent=d?`Valorisation ${d.name} : ${(parseFloat(d.valoClassique)||0).toString().replace('.',',')} €/MWhc classique · ${(parseFloat(d.valoPrecaire)||0).toString().replace('.',',')} €/MWhc précaire`:'';
}
function dealAutoCumac(id){
  const r=recById(id);const c=computeCumac(r);
  if(c==null){toast('Renseignez d\'abord les champs de calcul (ex. type + puissance) et les coefficients dans Paramètres ▸ Opérations','err');return;}
  const el=document.getElementById('deal_cumac');if(el){el.value=c;dealRecalc();}
  toast('Cumac calculé : '+c.toLocaleString('fr-FR')+' kWhc','ok');
}
async function saveDeal(id){
  const recs=getRecs();const r=recs.find(x=>x.id===id);if(!r)return;
  const did=(document.getElementById('deal_deleg')||{}).value||'';
  const type=(document.getElementById('deal_type')||{}).value||'classique';
  const cumac=parseFloat((document.getElementById('deal_cumac')||{}).value||'')||0;
  const delegs=getDelegataires();const d=delegs.find(x=>x.id===did);
  const valo=d?(type==='precaire'?(parseFloat(d.valoPrecaire)||0):(parseFloat(d.valoClassique)||0)):0;
  const prime=Math.round(cumac/1000*valo*100)/100;
  Object.assign(dealOf(r),{delegataireId:did,delegataireName:d?d.name:'',type,cumac,valo,prime});
  await persistDeal(id);
  r.updated=Date.now();
  r.history=r.history||[];
  r.history.unshift({date:Date.now(),user:(ME.prenom+' '+ME.nom).trim()||ME.code,text:'Deal mis à jour'});
  logActivity('action',`💰 Deal enregistré sur ${r.dossier||id} — ${prime.toLocaleString('fr-FR')} € TTC`,id);
  save(K.recs,recs);openDossier(id);toast('Deal enregistré ✓','ok');
}

async function lookupSiret(fieldId){
  const inp=document.getElementById('opf_'+fieldId);if(!inp)return;

let LAST_LEAD_SAVE=0;
async function saveLead(){
  if(Date.now()-LAST_LEAD_SAVE<1500)return; // anti double-clic : évite de créer deux dossiers d'un coup
  LAST_LEAD_SAVE=Date.now();
  const id=val('lf_id');
  const opId=val('lf_op');
  const op=getProducts().find(p=>p.id===opId);
  // validation des champs obligatoires de l'opération (on ignore les champs masqués)
  if(op&&op.fields){for(const f of op.fields){if(f.required){const el=document.getElementById('opf_'+f.id);if(el&&el.offsetParent!==null&&!el.value.trim()){toast('Champ requis : '+f.label,'err');return;}}}}
  const recs=getRecs();
  let r=id?recs.find(x=>x.id===id):null;
  const isNew=!r;
  if(isNew){r={id:uid(),dossier:await nextDossier(),created:Date.now(),history:[]};recs.push(r);}
  const prevStatus=r.statusId;
  r.productId=opId;r.statusId=val('lf_status');r.sourceId=val('lf_src');r.userId=val('lf_user');r.updated=Date.now();
  // champs personnalisés de l'opération + synchronisation des données canoniques (par clé)
  const opVals={...(r.opFields||{})};
  if(op&&op.fields){op.fields.forEach(f=>{
    const el=document.getElementById('opf_'+f.id);
    const v=el?el.value.trim():(opVals[f.id]||'');
    if(el)opVals[f.id]=v;
    if(f.key){
      if(f.key==='adresse_travaux_diff')r.adresseTravauxDiff=(v==='Oui');
      else if(CANON_KEYS[f.key])r[CANON_KEYS[f.key]]=v;
    }
  });}
  r.opFields=opVals;
  r.dept=deptFromCP(r.cp)||r.dept||'';
  r.lat=null;r.lng=null; // recalcul auto par centroïde dept
  r.history=r.history||[];
  const note=val('lf_note');
  if(isNew)r.history.unshift({date:Date.now(),user:ME.prenom,text:'Dossier créé'});
  else if(prevStatus!==r.statusId){const o=statById(prevStatus),n=statById(r.statusId);r.history.unshift({date:Date.now(),user:ME.prenom,text:`Statut : ${o?o.name:'—'} → ${n?n.name:'—'}`});}
  if(note)r.history.unshift({date:Date.now(),user:ME.prenom,text:note});
  logActivity('action',isNew?`➕ Création du dossier ${r.dossier||r.id} — ${recName(r)}`:`✏️ Modification du dossier ${r.dossier||r.id} — ${recName(r)}`,r.id);
  save(K.recs,recs);closeModal();buildNav();
  if(DOSSIER_OPEN&&DOSSIER_OPEN===r.id)openDossier(r.id);
  else if(CUR==='leads')applyRecFilter('leads');else if(CUR==='clients')applyRecFilter('clients');else go(CUR);
  toast(isNew?'Lead créé ✓':'Dossier enregistré ✓','ok');
}

function initMap(){

function refreshMarkers(){

function saveRdv(){
  const id=val('rd_id');const rdvs=getRdvs();
  let r=id?rdvs.find(x=>x.id===id):null;const isNew=!r;
  if(isNew){r={id:uid(),created:Date.now()};rdvs.push(r);}
  const type=val('rd_type');const kind=rdvKind(type);const interId=val('rd_user');
  let userId='',subId='',subName='',subKind='';
  if(kind==='user'||kind==='poseur'){userId=interId;}
  else{subId=interId;subKind=kind;const it=rdvList(kind).find(x=>x.id===interId);subName=it?it.name:'';}
  Object.assign(r,{recordId:val('rd_rec'),client:val('rd_client'),tel:val('rd_tel'),date:val('rd_date'),heure:val('rd_heure'),
    type,userId,subId,subName,subKind,ownerId:r.ownerId||ME.id,adresse:val('rd_adresse'),cp:val('rd_cp'),ville:val('rd_ville'),
    dept:val('rd_dept')||deptFromCP(val('rd_cp')),statusId:val('rd_status'),notes:val('rd_notes')});
  if(!r.date){toast('Date requise','err');return;}
  if(isNew&&userId&&userId!==ME.id){
    const rec=r.recordId?recById(r.recordId):null;
    createNotification(userId,'rdv_upcoming',`📅 Nouveau RDV le ${fmtDateLong(r.date)}${r.heure?' à '+r.heure:''} — ${rec?recName(rec):(r.client||'')}`,r.recordId);
  }
  // RDV lié à un dossier : on trace dans l'historique SANS jamais modifier le statut (le statut ne change que manuellement)
  if(r.recordId){const recs=getRecs();const rec=recs.find(x=>x.id===r.recordId);if(rec){rec.history=rec.history||[];rec.history.unshift({date:Date.now(),user:(ME.prenom+' '+ME.nom).trim()||ME.code,text:`${isNew?'RDV planifié':'RDV modifié'} : ${r.type||'RDV'} le ${fmtDateLong(r.date)}${r.heure?' à '+r.heure:''}`});save(K.recs,recs);logActivity('action',`📅 ${isNew?'RDV planifié':'RDV modifié'} sur ${rec.dossier||r.recordId} : ${r.type||'RDV'} le ${fmtDateLong(r.date)}${r.heure?' à '+r.heure:''}`,r.recordId);}}
  save(K.rdv,rdvs);closeModal();buildNav();
  if(DOSSIER_OPEN){openDossier(DOSSIER_OPEN);}else if(CUR==='planning'){renderPlanning();}else if(CUR==='rdvs'){renderRdvs();}else if(CUR==='dash'){renderDash();}
  toast(isNew?'RDV créé ✓':'RDV mis à jour ✓','ok');
}
function delRdv(id){save(K.rdv,getRdvs().filter(r=>r.id!==id));deleteRemoteRow(K.rdv,id);closeModal();buildNav();if(DOSSIER_OPEN)openDossier(DOSSIER_OPEN);else if(CUR==='planning')renderPlanning();else if(CUR==='rdvs')renderRdvs();toast('RDV supprimé','ok');}
async function geocodeRdv(){
  const q=[val('rd_adresse'),val('rd_cp'),val('rd_ville')].filter(Boolean).join(', ');
  if(!q){toast('Renseignez une adresse','err');return;}
  toast('Géolocalisation…');
  try{
    const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q='+encodeURIComponent(q));
    const j=await res.json();
    if(j&&j[0]){const id=val('rd_id');const rdvs=getRdvs();let r=id?rdvs.find(x=>x.id===id):null;
      if(!r){toast('Enregistrez d\'abord le RDV','err');return;}
      r.lat=parseFloat(j[0].lat);r.lng=parseFloat(j[0].lon);save(K.rdv,rdvs);
      toast('Position trouvée ✓','ok');if(CUR==='planning')refreshMarkers();
    }else toast('Adresse introuvable','err');
  }catch(e){toast('Géolocalisation indisponible','err');}
}
