  let csv='Date;Fournisseur;Materiel;Quantite;Remise HT;Frais HT;Total HT;TVA;Total TTC;Facture jointe;Statut;Reference paiement;Date paiement\n';
  mvts.forEach(v=>{

  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});

  a.href=url;a.download='paiements_fournisseurs_egn.csv';a.click();URL.revokeObjectURL(url);

/* ============================================================
   TVA — collectee sur le chiffre d'affaires, deductible sur les
   charges, et solde a payer (ou credit si negatif).
   ============================================================ */
let TVA_ANNEE=new Date().getFullYear(), TVA_MOIS=''; // '' = annee entiere
function setTvaPeriode(annee,mois){TVA_ANNEE=annee;TVA_MOIS=mois;renderComptaTva();}
const MOIS_FR=['Janv','Févr','Mars','Avril','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
function periodeDe(ts){
  if(!ts)return null;
  const d=new Date(ts);
  if(isNaN(d.getTime()))return null;
  return{annee:d.getFullYear(),mois:d.getMonth()};
}
/* Ecritures de TVA — regime sur encaissements et decaissements.
   Une piece n'entre dans la TVA que lorsqu'elle est reellement reglee :
     - Entree  : APF delegataire en « virement recu »   -> date du virement
     - Sortie  : APF agent en « paye »                   -> date de paiement
     - Sortie  : facture fournisseur en « payee »        -> date de paiement
   Les pieces en attente sont comptees a part, sans etre rattachees a un mois. */
function collecterEcrituresTva(){
  const retenues=[],attente=[];
  const t=tvaRate()/100;
  const r2=v=>Math.round(v*100)/100;

  // --- Entrees : APF delegataires ---
  segApfDeleg().forEach(a=>{
    const recu=a.statut==='recu';
    const ts=recu?(a.dateVirement?new Date(a.dateVirement+'T12:00:00').getTime():a.date):null;
    (a.recIds||[]).forEach(id=>{
      const r=recById(id);if(!r)return;
      const k=primeDetailOf(r);
      const ttc=k.primeCEE||0;if(!ttc)return;
      const ht=k.estime?htOf(ttc):(k.primeHT||0);
      const e={sens:'ca',r,ttc,ht,tva:r2(ttc-ht),piece:a.numApf||'APF délégataire',p:periodeDe(ts)};
      (recu&&e.p?retenues:attente).push(e);
    });
  });

  // --- Sorties : APF agents (poseurs, call center, VT, auditeurs) ---
  segFactures().forEach(f=>{
    const pm=f.paiements||{};
    const paye=pm.statut_apf==='paye';
    const ts=paye?(pm.datePaiement?new Date(pm.datePaiement+'T12:00:00').getTime():f.date):null;
    (f.lignes||[]).forEach(l=>{
      const r=recById(l.recId);if(!r)return;
      const ttc=l.montant||0;if(!ttc)return;
      const ht=(l.ht!=null)?l.ht:(l.tvaMode==='sans_tva'?ttc:htOf(ttc));
      const e={sens:'charge',r,ttc,ht,tva:r2(ttc-ht),piece:f.apfNum||'APF',p:periodeDe(ts)};
      (paye&&e.p?retenues:attente).push(e);
    });
  });

  // --- Sorties : factures fournisseurs (achats de stock) ---
  getMvts().filter(v=>['entree','reception'].includes(v.sens)).forEach(v=>{
    const pm=v.paiement||{};
    const paye=pm.statut==='paye';
    const ht=v.totalHT||0;if(!ht)return;
    const tva=v.tvaRecup!=null?v.tvaRecup:r2(ht*t);
    const ts=paye?(pm.date?new Date(pm.date+'T12:00:00').getTime():v.date):null;
    const mat=getMats().find(m=>m.id===v.materielId);
    const e={sens:'charge',r:null,ttc:r2(ht+tva),ht,tva,
             piece:(v.fournisseurNom||'Fournisseur')+(mat?' — '+mat.nom:''),p:periodeDe(ts)};
    (paye&&e.p?retenues:attente).push(e);
  });

  return{retenues,attente};
}

function renderComptaTva(){
  const eur=n=>(n||0).toLocaleString('fr-FR',{maximumFractionDigits:2})+' €';
  const T=comptaTotaux();
  // Pieces reglees uniquement, filtrees ensuite sur la periode choisie
  const{retenues:toutes,attente:nonDatees}=collecterEcrituresTva();
  const opOk=e=>!COMPTA_OP||(e.r&&e.r.productId===COMPTA_OP)||(!e.r&&!COMPTA_OP);
  const annees=[...new Set(toutes.filter(e=>e.p).map(e=>e.p.annee))].sort((a,b)=>b-a);
  if(annees.length&&!annees.includes(TVA_ANNEE))TVA_ANNEE=annees[0];
  const dansPeriode=e=>{
    if(!e.p)return false;
    if(e.p.annee!==TVA_ANNEE)return false;
    return TVA_MOIS===''||e.p.mois===TVA_MOIS;
  };
  const retenues=toutes.filter(e=>dansPeriode(e)&&opOk(e));
  const som=(arr,sens,champ)=>Math.round(arr.filter(e=>e.sens===sens).reduce((s,e)=>s+(e[champ]||0),0)*100)/100;
  const caTTC=som(retenues,'ca','ttc'), caHT=som(retenues,'ca','ht');
  const chTTC=som(retenues,'charge','ttc'), chHT=som(retenues,'charge','ht');
  const tvaCollectee=som(retenues,'ca','tva');
  const tvaDeductible=som(retenues,'charge','tva');
  const solde=Math.round((tvaCollectee-tvaDeductible)*100)/100;

  let h=opFilterBar('renderComptaTva');

  // Barre de periode
  const btn=(lib,actif,onclick,titre)=>`<button onclick="${onclick}" ${titre?`title="${titre}"`:''} style="font-family:'Saira',sans-serif;font-size:.76rem;font-weight:700;border:1.5px solid ${actif?'var(--green)':'var(--border-grey)'};background:${actif?'var(--green)':'#fff'};color:${actif?'#fff':'var(--text)'};border-radius:8px;padding:.3rem .62rem;cursor:pointer">${lib}</button>`;
  h+=`<div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.5rem">
    <span style="font-size:.7rem;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.5px">Année</span>
    ${(annees.length?annees:[TVA_ANNEE]).map(a=>btn(a,a===TVA_ANNEE,`setTvaPeriode(${a},'${TVA_MOIS}')`)).join('')}
  </div>`;
  h+=`<div style="display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem">
    ${btn('Année entière',TVA_MOIS==='',`setTvaPeriode(${TVA_ANNEE},'')`)}
    ${MOIS_FR.map((lib,i)=>{
      const n=toutes.filter(e=>e.p&&e.p.annee===TVA_ANNEE&&e.p.mois===i&&opOk(e)).length;
      return btn(lib,TVA_MOIS===i,`setTvaPeriode(${TVA_ANNEE},${i})`,n?`${n} écriture${n>1?'s':''}`:'aucune écriture');
    }).join('')}
  </div>`;

  const libPeriode=TVA_MOIS===''?`Année ${TVA_ANNEE}`:`${MOIS_FR[TVA_MOIS]} ${TVA_ANNEE}`;
  h+=`<div class="kpis">
    <div class="kpi"><div class="kico">💶</div><div class="klab">CA TTC</div><div class="kval">${eur(caTTC)}</div><div class="ksub">HT ${eur(caHT)}</div></div>
    <div class="kpi" style="border:1.5px solid rgba(230,57,70,.25)"><div class="kico">🏛️</div><div class="klab">TVA collectée</div><div class="kval" style="color:var(--coral)">${eur(tvaCollectee)}</div><div class="ksub">sur le chiffre d'affaires</div></div>
    <div class="kpi"><div class="kico">📤</div><div class="klab">Charges variables TTC</div><div class="kval">${eur(chTTC)}</div><div class="ksub">HT ${eur(chHT)}</div></div>
    <div class="kpi" style="border:1.5px solid rgba(45,125,210,.25)"><div class="kico">✅</div><div class="klab">TVA déductible</div><div class="kval" style="color:var(--blue)">${eur(tvaDeductible)}</div><div class="ksub">charges et marchandise</div></div>
  </div>`;

  const crediteur=solde<0;
  h+=`<div style="background:${crediteur?'rgba(45,125,210,.08)':'rgba(230,57,70,.07)'};border:1.5px solid ${crediteur?'rgba(45,125,210,.35)':'rgba(230,57,70,.3)'};border-radius:14px;padding:1.1rem 1.3rem;margin-bottom:1rem;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap">
    <div style="font-size:2rem">${crediteur?'💙':'🏛️'}</div>

      <div style="font-size:.7rem;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.5px">${crediteur?'Crédit de TVA':'TVA à payer'} — ${esc(libPeriode)}</div>

      <div class="muted" style="font-size:.76rem">${eur(tvaCollectee)} collectée − ${eur(tvaDeductible)} déductible</div>
    </div>
  </div>`;

  if(nonDatees.length){
    const tvaEnt=Math.round(nonDatees.filter(e=>e.sens==='ca').reduce((s,e)=>s+e.tva,0)*100)/100;
    const tvaSor=Math.round(nonDatees.filter(e=>e.sens==='charge').reduce((s,e)=>s+e.tva,0)*100)/100;
    h+=`<div style="background:#FFF7ED;border:1.5px solid #F0C486;border-radius:10px;padding:.6rem 1rem;margin-bottom:.9rem;font-size:.8rem">
      ⏳ <b>${nonDatees.length} pièce${nonDatees.length>1?'s':''} non réglée${nonDatees.length>1?'s':''}</b> — hors TVA tant que le règlement n'est pas enregistré :

      <span class="muted" style="display:block;margin-top:.15rem">La TVA est calculée sur les encaissements et décaissements réels : APF délégataire reçu, APF agent payé, facture fournisseur payée.</span>

  }

  // Ventilation par mois de l'annee

    <thead><tr><th>Mois</th><th class="r">CA TTC</th><th class="r">TVA collectée</th><th class="r">Charges TTC</th><th class="r">TVA déductible</th><th class="r">Solde</th></tr></thead><tbody>`;
  let cumul=0;
  MOIS_FR.forEach((lib,i)=>{
    const e=toutes.filter(x=>x.p&&x.p.annee===TVA_ANNEE&&x.p.mois===i&&opOk(x));

    <td style="text-align:right;color:${cumul>=0?'var(--coral)':'var(--blue)'}">${eur(cumul)}</td>
  </tr></tbody></table></div></div></div>`;

function exportTvaCSV(){
  const nb=n=>(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const lib=TVA_MOIS===''?String(TVA_ANNEE):`${MOIS_FR[TVA_MOIS]}_${TVA_ANNEE}`;
  const{retenues}=collecterEcrituresTva();
  let csv='Sens;N Dossier;Client;Operation;Piece;Mois;TTC;HT;TVA\n';
  retenues.forEach(e=>{
    if(!e.p||e.p.annee!==TVA_ANNEE)return;
    if(TVA_MOIS!==''&&e.p.mois!==TVA_MOIS)return;
    if(COMPTA_OP&&(!e.r||e.r.productId!==COMPTA_OP))return;
    const op=e.r?getAllProducts().find(o=>o.id===e.r.productId):null;
    csv+=`${e.sens==='ca'?'Entree':'Sortie'};${e.r?e.r.dossier||'':''};${e.r?clientNameOf(e.r):''};${op?op.name:''};${e.piece||''};${MOIS_FR[e.p.mois]} ${e.p.annee};${nb(e.ttc)};${nb(e.ht)};${nb(e.tva)}\n`;
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='tva_'+lib+'.csv';a.click();URL.revokeObjectURL(url);
}

async function signedUrl(path,secondes){

}

/* Met un numéro au format international sans espaces ni séparateurs */
function normWaNumber(v){
  let s=String(v||'').replace(/[^\d+]/g,'');
  if(!s)return '';
  if(s.startsWith('00'))s='+'+s.slice(2);
  if(!s.startsWith('+')){
    // 06… / 07… français -> +336… / +337…
    if(s.startsWith('0')&&s.length===10)s='+33'+s.slice(1);
    else s='+'+s;
  }
  return s;
}
function waEnabled(){const s=getSettings();return !!(s.waEnabled);}
/* Envoi unitaire — n'interrompt jamais le flux du CRM en cas d'échec */
async function sendWhatsApp(numero,texte,contexte){
  const to=normWaNumber(numero);
  if(!waEnabled()||!to)return{ok:false,skip:true};
  try{
    const{data,error}=await SUPA.functions.invoke('send-whatsapp',{body:{to,message:texte,contexte:contexte||''}});
    if(error)throw error;
    if(data&&data.error)throw new Error(data.error);
    return{ok:true};
  }catch(e){
    console.error('[whatsapp]',e);
    return{ok:false,error:e.message||String(e)};
  }
}
/* Envoi à un utilisateur du CRM */
async function sendWhatsAppToUser(userId,texte,contexte){
  const u=getUsers().find(x=>x.id===userId);
  if(!u||!u.whatsapp)return{ok:false,skip:true};
  return sendWhatsApp(u.whatsapp,texte,contexte);
}

/* ---- mentions @utilisateur dans les commentaires ---- */
let MENTION_TA=null,MENTION_IDX=0,MENTION_LIST=[];
const nrm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const rxEsc=s=>(s||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function mentionCandidates(){return getUsers().filter(u=>u.active!==false);}
/* Détecte les utilisateurs cités dans un texte, à la saisie ou collés à la main */
function extractMentions(txt){
  const t=nrm(txt);const out=[];
  mentionCandidates().forEach(u=>{
    const full=nrm((u.prenom||'')+' '+(u.nom||'')).trim();
    const first=nrm(u.prenom||'');
    if(full&&t.includes('@'+full))out.push(u.id);
    else if(first&&new RegExp('@'+rxEsc(first)+'(?![a-z0-9])').test(t))out.push(u.id);
  });
  return [...new Set(out)];
}
function mentionToken(ta){
  const pos=ta.selectionStart||0;
  const before=ta.value.slice(0,pos);
  const m=before.match(/@([\p{L}\-]*(?: [\p{L}\-]*)?)$/u);
  return m?{q:m[1],start:pos-m[0].length,end:pos}:null;
}
function mentionInput(ta){
  MENTION_TA=ta;
  const box=document.getElementById('mentionBox');if(!box)return;
  const tok=mentionToken(ta);
  if(!tok){box.style.display='none';return;}
  const q=nrm(tok.q);
  MENTION_LIST=mentionCandidates().filter(u=>nrm((u.prenom||'')+' '+(u.nom||'')).includes(q)).slice(0,6);
  if(!MENTION_LIST.length){box.style.display='none';return;}
  MENTION_IDX=0;
  const r=ta.getBoundingClientRect();
  box.style.left=r.left+'px';
  box.style.width=Math.min(Math.max(r.width,220),320)+'px';
  const below=window.innerHeight-r.bottom;
  if(below<200&&r.top>200){box.style.top='';box.style.bottom=(window.innerHeight-r.top+4)+'px';}
  else{box.style.bottom='';box.style.top=(r.bottom+4)+'px';}
  renderMentionBox();
  box.style.display='block';
}
function renderMentionBox(){
  const box=document.getElementById('mentionBox');if(!box)return;
  box.innerHTML=MENTION_LIST.map((u,i)=>`<div class="mention-item ${i===MENTION_IDX?'act':''}" onmousedown="event.preventDefault();pickMention('${u.id}')">
    <span class="mi-av">${esc(((u.prenom||'')[0]||'')+((u.nom||'')[0]||''))}</span>
    <span><b>${esc((u.prenom||'')+' '+(u.nom||''))}</b><span class="muted" style="font-size:.66rem;display:block">${esc(ROLES[u.role]||u.role||'')}</span></span>
  </div>`).join('');
}
function mentionKeydown(ta,e){
  const box=document.getElementById('mentionBox');
  if(!box||box.style.display==='none'||!MENTION_LIST.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();MENTION_IDX=(MENTION_IDX+1)%MENTION_LIST.length;renderMentionBox();}
  else if(e.key==='ArrowUp'){e.preventDefault();MENTION_IDX=(MENTION_IDX-1+MENTION_LIST.length)%MENTION_LIST.length;renderMentionBox();}
  else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pickMention(MENTION_LIST[MENTION_IDX].id);}
  else if(e.key==='Escape'){box.style.display='none';}
}
function pickMention(uid){
  const u=getUsers().find(x=>x.id===uid);const ta=MENTION_TA;
  const box=document.getElementById('mentionBox');
  if(!u||!ta){if(box)box.style.display='none';return;}
  const tok=mentionToken(ta);if(!tok){box.style.display='none';return;}
  const ins='@'+(u.prenom||'')+' '+(u.nom||'')+' ';
  ta.value=ta.value.slice(0,tok.start)+ins+ta.value.slice(tok.end);
  const np=tok.start+ins.length;
  ta.focus();ta.setSelectionRange(np,np);
  box.style.display='none';
}
function hideMentionBox(){setTimeout(()=>{const b=document.getElementById('mentionBox');if(b)b.style.display='none';},120);}
/* Rend le texte d'un commentaire avec les mentions surlignées */
function renderCommentText(txt,mentions){
  const users=getUsers();const toks=[];
  (mentions||[]).forEach(uid=>{
    const u=users.find(x=>x.id===uid);if(!u)return;
    toks.push('@'+(u.prenom||'')+' '+(u.nom||''));
    if(u.prenom)toks.push('@'+u.prenom);
  });
  toks.sort((a,b)=>b.length-a.length);
  let s=txt||'';const map={};let i=0;
  toks.forEach(t=>{
    if(!t||!s.includes(t))return;
    const ph='\u0001M'+(i++)+'\u0001';map[ph]=t;s=s.split(t).join(ph);
  });
  let h=esc(s).replace(/\n/g,'<br>');
  Object.keys(map).forEach(ph=>{h=h.split(ph).join(`<span class="mention-tag">${esc(map[ph])}</span>`);});
  return h;
}
/* Envoie une notification à chaque personne citée */
async function notifyMentions(mentions,r,txt){
  const who=((ME.prenom||'')+' '+(ME.nom||'')).trim()||ME.code;
  const label=r.dossier||recName(r);
  const extrait=txt.length>70?txt.slice(0,70)+'…':txt;
  const client=clientNameOf(r);
  let envoyes=0;
  for(const uid of (mentions||[])){
    if(uid===ME.id)continue;
    await createNotification(uid,'mention',`💬 ${who} vous a mentionné sur ${label} : « ${extrait} »`,r.id);
    // Notification WhatsApp — le texte complet, pas l'extrait
    const msg=`💬 *${who}* vous a mentionné\n\n`
      +`📁 Dossier ${label}\n`
      +`👤 ${client}\n\n`
      +`"${txt}"\n\n`
      +`${lienDossier(r)}`;
    const res=await sendWhatsAppToUser(uid,msg,'mention');
    if(res.ok)envoyes++;
  }
  if(envoyes)toast(`📱 ${envoyes} notification${envoyes>1?'s':''} WhatsApp envoyée${envoyes>1?'s':''}`,'ok');
}

async function buildScanPdf(dataUrls){
  const A4_W=595,A4_H=842;
  const enc=s=>new TextEncoder().encode(s);
  // Lire les données JPEG de chaque image
  const imgs=dataUrls.map(url=>{
    const base64=url.split(',')[1];
    const raw=atob(base64);
    const bytes=new Uint8Array(raw.length);
    for(let j=0;j<raw.length;j++)bytes[j]=raw.charCodeAt(j);
    let iw=A4_W,ih=A4_H;
    for(let p=0;p<bytes.length-8;p++){if(bytes[p]===0xFF&&bytes[p+1]>=0xC0&&bytes[p+1]<=0xC3){ih=bytes[p+5]*256+bytes[p+6];iw=bytes[p+7]*256+bytes[p+8];break;}}
    return{bytes,iw,ih};
  });
  const n=imgs.length;
  // Plan des objets : 1=catalog, 2=pages, puis par page : imgObj, contentObj, pageObj (3 objets par page)
  // obj 1: catalog, obj 2: pages, obj 3+3i: image XObject, obj 4+3i: content stream, obj 5+3i: page
  const catalogId=1,pagesId=2;
  const imgId=i=>3+3*i;
  const contentId=i=>4+3*i;
  const pageId=i=>5+3*i;
  const totalObjs=2+3*n;
  // Construire les objets dans l'ordre et tracer les offsets
  const offsets=new Array(totalObjs+1).fill(0);
  const chunks=[];let off=0;
  const push=s=>{const b=enc(s);chunks.push(b);off+=b.length;};
  const pushRaw=b=>{chunks.push(b);off+=b.length;};
  push('%PDF-1.4\n%\xFF\xFF\n');
  // Catalog
  offsets[catalogId]=off;
  push(`${catalogId} 0 obj\n<</Type/Catalog/Pages ${pagesId} 0 R>>\nendobj\n`);
  // Pages
  offsets[pagesId]=off;
  const kids=Array.from({length:n},(_,i)=>`${pageId(i)} 0 R`).join(' ');
  push(`${pagesId} 0 obj\n<</Type/Pages/Kids[${kids}]/Count ${n}>>\nendobj\n`);
  // Pour chaque image : image XObject, content stream, page
  for(let i=0;i<n;i++){
    const{bytes,iw,ih}=imgs[i];
    const scale=Math.min(A4_W/iw,A4_H/ih);
    const sw=Math.round(iw*scale),sh=Math.round(ih*scale);
    const dx=Math.round((A4_W-sw)/2),dy=Math.round((A4_H-sh)/2);
    const imgName=`Im${i}`;
    // Image XObject
    offsets[imgId(i)]=off;
    push(`${imgId(i)} 0 obj\n<</Type/XObject/Subtype/Image/Width ${iw}/Height ${ih}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${bytes.length}>>\nstream\n`);
    pushRaw(bytes);
    push('\nendstream\nendobj\n');
    // Content stream
    const cs=`q ${sw} 0 0 ${sh} ${dx} ${dy} cm /${imgName} Do Q`;
    const csBytes=enc(cs);
    offsets[contentId(i)]=off;
    push(`${contentId(i)} 0 obj\n<</Length ${csBytes.length}>>\nstream\n`);
    pushRaw(csBytes);
    push('\nendstream\nendobj\n');
    // Page
    offsets[pageId(i)]=off;
    push(`${pageId(i)} 0 obj\n<</Type/Page/Parent ${pagesId} 0 R/MediaBox[0 0 ${A4_W} ${A4_H}]/Resources<</XObject<</${imgName} ${imgId(i)} 0 R>>>>/Contents ${contentId(i)} 0 R>>\nendobj\n`);
  }
  // xref
  const xrefOff=off;
  push(`xref\n0 ${totalObjs+1}\n`);
  push('0000000000 65535 f \n');
  for(let i=1;i<=totalObjs;i++)push(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<</Size ${totalObjs+1}/Root ${catalogId} 0 R>>\nstartxref\n${xrefOff}\n%%EOF\n`);
  // Assembler
  const total=chunks.reduce((s,c)=>s+c.length,0);
  const out=new Uint8Array(total);let pos=0;
  for(const c of chunks){out.set(c,pos);pos+=c.length;}
  return out;
}

const getDelegataires=()=>load('egncrm_delegataires',[]);
/* Valeur d'un critere de calcul.
   __zone__ est un pseudo-champ : la zone climatique H1/H2/H3 deduite du code postal. */
function critereValue(r,fieldId){
  if(fieldId==='__zone__')return zoneClimatiqueOf(r)||'';
  return (r.opFields&&r.opFields[fieldId])||'';
}
function computeCumac(r){
  const op=getAllProducts().find(p=>p.id===r.productId);
  if(!op||!op.cumac)return null;
  if(op.cumac.mode==='coef'){
    const c=op.cumac;
    const fv=parseFloat((r.opFields&&r.opFields[c.field])||'')||0;
    if(!fv)return null;
    let coef=0;
    if(c.byField){const choice=critereValue(r,c.byField);coef=parseFloat((c.coefs&&c.coefs[choice])||0)||0;}
    else coef=parseFloat(c.coef||0)||0;
    if(!coef)return null;
    return Math.round(coef*fv);
  }
  if(op.cumac.mode==='multi'){
    const factors=op.cumac.factors||[];
    if(!factors.length)return null;
    let product=1;
    for(const f of factors){
      let v=0;
      if(f.type==='fixed')v=parseFloat(f.value)||0;
      else if(f.type==='field')v=parseFloat((r.opFields&&r.opFields[f.field])||'')||0;
      else if(f.type==='table1d'){const ch=critereValue(r,f.field);v=parseFloat((f.table&&f.table[ch])||0)||0;}
      else if(f.type==='table2d'){const c1=critereValue(r,f.field1);const c2=critereValue(r,f.field2);v=parseFloat((f.table&&f.table[c1+'|'+c2])||0)||0;}
      if(!v)return null;
      product*=v;
    }
    return Math.round(product);
  }
  return null;
}
/* ============================================================
   CALCUL DE LA PRIME CEE
   Deux lignes, calculees chacune sur le cumac total :
     - Prime client       : versee au client, sans TVA
     - Commission installateur : votre remuneration, TVA 20 %
   ============================================================ */
function calcPrimeCEE(delegId,type,cumac){
  const d=getDelegataires().find(x=>x.id===delegId);
  const mwhc=(parseFloat(cumac)||0)/1000;
  const n=v=>parseFloat(String(v??'').replace(',','.'))||0;
  const precaire=type==='precaire';
  const valoClient=d?(precaire?n(d.valoPrecaire):n(d.valoClassique)):0;
  // Retrocompatibilite : sans commission configuree, on reprend la valo client
  const brutCom=d?(precaire?d.valoComPrecaire:d.valoComClassique):null;
  const valoCom=(brutCom===undefined||brutCom===null||brutCom==='')?valoClient:n(brutCom);
  const r2=v=>Math.round(v*100)/100;
  const t=tvaRate()/100;
  // La prime client est negociee en TTC, mais la TVA ayant deja ete recuperee
  // sur la facture client, elle est comptabilisee en HT.
  const primeClientBrut=r2(mwhc*valoClient);
  const primeClient=r2(primeClientBrut/(1+t));
  const comHT=r2(mwhc*valoCom);
  const comTVA=r2(comHT*t);
  const comTTC=r2(comHT+comTVA);
  return{
    d,mwhc,valoClient,valoCom,
    primeClientBrut,      // base negociee, TTC
    primeClient,          // comptabilisee en HT
    comHT,comTVA,comTTC,  // commission installateur
    primeHT:r2(primeClient+comHT),          // base comptabilisee hors TVA
    // Prime CEE TTC = prime client a sa valeur negociee + commission HT
    primeCEE:r2(primeClientBrut+comHT),
    totalEncaisse:r2(primeClientBrut+comTTC) // virement reel du delegataire
  };
}
/* Prime CEE TTC d'un dossier.
   Recalculee a la volee des que le cumac et le delegataire sont renseignes,
   pour que la compta suive les valos sans avoir a rouvrir chaque dossier.
   La valeur stockee sert de repli (dossiers anciens, valo supprimee). */
/* Decomposition de la prime d'un dossier : client, commission, total */
function primeDetailOf(r){
  const d=dealOf(r);
  if(!d.delegataireId||!d.cumac){
    const st=parseFloat(d.prime)||0;
    return{primeClient:0,comHT:0,comTVA:0,comTTC:0,primeCEE:st,estime:true};
  }
  const k=calcPrimeCEE(d.delegataireId,d.type,d.cumac);
  if(!k.valoClient&&!k.valoCom){
    const st=parseFloat(d.prime)||0;
    return{primeClient:0,comHT:0,comTVA:0,comTTC:0,primeCEE:st,estime:true};
  }
  return{...k,estime:false};
}
function primeOf(r){
  const d=dealOf(r);
  const stockee=parseFloat(d.prime)||0;
  if(!d.delegataireId||!d.cumac)return stockee;
  const k=calcPrimeCEE(d.delegataireId,d.type,d.cumac);
  if(!k.valoClient&&!k.valoCom)return stockee;
  return k.primeCEE;
}

function dealAutoCumac(id){

async function saveDeal(id){
  const recs=getRecs();const r=recs.find(x=>x.id===id);if(!r)return;
  const did=(document.getElementById('deal_deleg')||{}).value||'';
  const type=(document.getElementById('deal_type')||{}).value||'classique';
  const cumac=parseFloat((document.getElementById('deal_cumac')||{}).value||'')||0;
  const delegs=getDelegataires();const d=delegs.find(x=>x.id===did);
  // Prime entierement calculee : prime client + commission TTC
  const k=calcPrimeCEE(did,type,cumac);
  const valo=k.valoClient;
  const prime=k.primeCEE;
  Object.assign(dealOf(r),{delegataireId:did,delegataireName:d?d.name:'',type,cumac,valo,prime});
  // Synchroniser r.deal dans localStorage
  r.deal=r.deal||{};
  Object.assign(r.deal,{delegataireId:did,delegataireName:d?d.name:'',type,cumac,valo,prime});
  await persistDeal(id);
  // Mettre à jour le cache avec la nouvelle prime pour que la compta globale la voit immédiatement
  DEAL_CACHE[id]=DEAL_CACHE[id]||rowToDeal(null);
  Object.assign(DEAL_CACHE[id],{delegataireId:did,delegataireName:d?d.name:'',type,cumac,valo,prime});
  // Invalider la compta globale pour forcer le rechargement depuis Supabase au prochain accès

  r.history=r.history||[];
  r.history.unshift({date:Date.now(),user:(ME.prenom+' '+ME.nom).trim()||ME.code,text:'Deal mis à jour'});
  logActivity('action',`💰 Deal enregistré sur ${r.dossier||id} — prime ${prime.toLocaleString('fr-FR')} € TTC`,id);

}

async function notifierPassageClient(r,old,nw){
  const who=((ME.prenom||'')+' '+(ME.nom||'')).trim()||ME.code;
  const label=r.dossier||recName(r);
  const op=getAllProducts().find(o=>o.id===r.productId);
  const prime=primeOf(r)||0;
  const msg=`🎉 *Nouveau client !*\n\n`
    +`📁 Dossier ${label}\n`
    +`👤 ${clientNameOf(r)}${r.ville?' — '+r.ville:''}\n`
    +(op?`⚡ ${op.name}\n`:'')
    +(prime?`💰 Prime : ${prime.toLocaleString('fr-FR')} €\n`:'')
    +`\n${old?old.name:'—'} → *${nw.name}*\n`
    +`Par ${who}\n\n`
    +`${lienDossier(r)}`;
  // Destinataires : propriétaire du dossier + comptes ayant la vue globale, sans doublon ni soi-même
  const dest=new Set();
  if(r.userId)dest.add(r.userId);
  getUsers().forEach(u=>{
    if(u.active===false||!u.whatsapp)return;
    const p=normalizePerms(u.perms,u.role);
    if(u.role==='superadmin'||p.dash_global)dest.add(u.id);
  });
  dest.delete(ME.id);
  let envoyes=0;
  for(const uid of dest){
    await createNotification(uid,'client',`🎉 ${label} — ${clientNameOf(r)} est passé en ${nw.name}`,r.id);
    const res=await sendWhatsAppToUser(uid,msg,'passage_client');
    if(res.ok)envoyes++;
  }
  if(envoyes)toast(`📱 ${envoyes} notification${envoyes>1?'s':''} WhatsApp envoyée${envoyes>1?'s':''}`,'ok');
}

    if(f.key){
      if(f.key==='adresse_travaux_diff')r.adresseTravauxDiff=(v==='Oui');
      else if(CANON_KEYS[f.key])r[CANON_KEYS[f.key]]=v;
    }
  });}
  r.opFields=opVals;
  r.dept=deptFromCP(r.cp)||r.dept||'';
  r.lat=null;r.lng=null; // recalcul auto par centroïde dept
  r.history=r.history||[];
  const note=val('lf_note');
  if(isNew)r.history.unshift({date:Date.now(),user:ME.prenom,text:'Dossier créé'});
  else if(prevStatus!==r.statusId){const o=statById(prevStatus),n=statById(r.statusId);r.history.unshift({date:Date.now(),user:ME.prenom,text:`Statut : ${o?o.name:'—'} → ${n?n.name:'—'}`});}
  if(note)r.history.unshift({date:Date.now(),user:ME.prenom,text:note});
  logActivity('action',isNew?`➕ Création du dossier ${r.dossier||r.id} — ${recName(r)}`:`✏️ Modification du dossier ${r.dossier||r.id} — ${recName(r)}`,r.id);
  const nouveauStatut=statById(r.statusId);
  const devientClient=!isNew&&nouveauStatut&&nouveauStatut.phase==='client'&&(!ancienStatut||ancienStatut.phase!=='client');
  save(K.recs,recs);closeModal();buildNav();
  if(DOSSIER_OPEN&&DOSSIER_OPEN===r.id)openDossier(r.id);
  else if(CUR==='leads')applyRecFilter('leads');else if(CUR==='clients')applyRecFilter('clients');else go(CUR);
  toast(isNew?'Lead créé ✓':'Dossier enregistré ✓','ok');
  if(devientClient)notifierPassageClient(r,ancienStatut,nouveauStatut);
}

const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DOW=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function drawCalendar(){
  const area=document.getElementById('calArea');if(!area)return;
  if(CAL.view==='liste'){drawCalList(area);return;}
  if(CAL.view==='semaine'){drawCalWeek(area);return;}
  // mois
  const first=new Date(CAL.y,CAL.m,1);let start=(first.getDay()+6)%7;
  const days=new Date(CAL.y,CAL.m+1,0).getDate();
  const rdvs=filteredRdvs();const byDay={};rdvs.forEach(r=>{(byDay[r.date]=byDay[r.date]||[]).push(r);});
  const todayStr=new Date().toISOString().slice(0,10);
  let h=`<div class="cal"><div class="cal-head"><button class="nav" onclick="calMove(-1)">‹</button><div class="mlabel">${MONTHS[CAL.m]} ${CAL.y}</div><button class="nav" onclick="calMove(1)">›</button><div style="margin-left:auto"><button class="btn btn-ghost btn-sm" onclick="calToday()">Aujourd'hui</button></div></div>
  <div class="cal-grid">`+DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<start;i++){const pm=new Date(CAL.y,CAL.m,0-(start-1-i)).getDate();h+=`<div class="cal-cell other"><div class="dnum">${pm}</div></div>`;}
  for(let d=1;d<=days;d++){
    const ds=`${CAL.y}-${String(CAL.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=(byDay[ds]||[]).sort((a,b)=>(a.heure||'').localeCompare(b.heure||''));
    let ev='';evs.slice(0,3).forEach(e=>{ev+=`<div class="cal-ev" style="background:${rdvTypeColor(e.type)}" onclick="event.stopPropagation();openRdv('${e.id}')">${e.heure?e.heure+' ':''}${esc(e.client||'RDV')}</div>`;});
    if(evs.length>3)ev+=`<div class="cal-more">+${evs.length-3} autres</div>`;
    h+=`<div class="cal-cell ${ds===todayStr?'today':''}" onclick="${can('rdv_manage')?`openRdvDate('${ds}')`:''}"><div class="dnum">${d}</div>${ev}</div>`;
  }
  h+=`</div></div>`;area.innerHTML=h;
}
function drawCalWeek(area){
  // semaine contenant le 1er jour sélectionné ou aujourd'hui
  const base=CAL.sel?new Date(CAL.sel):new Date();
  const dow=(base.getDay()+6)%7;const mon=new Date(base);mon.setDate(base.getDate()-dow);
  const rdvs=filteredRdvs();const byDay={};rdvs.forEach(r=>{(byDay[r.date]=byDay[r.date]||[]).push(r);});
  const todayStr=new Date().toISOString().slice(0,10);
  let h=`<div class="cal"><div class="cal-head"><button class="nav" onclick="calMove(-1)">‹</button><div class="mlabel">Semaine du ${mon.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</div><button class="nav" onclick="calMove(1)">›</button><div style="margin-left:auto"><button class="btn btn-ghost btn-sm" onclick="calToday()">Cette semaine</button></div></div><div class="cal-grid">`;
  const ws=[];for(let i=0;i<7;i++){const dd=new Date(mon);dd.setDate(mon.getDate()+i);ws.push(dd);}
  ws.forEach((dd,i)=>h+=`<div class="cal-dow">${DOW[i]} ${dd.getDate()}</div>`);
  ws.forEach(dd=>{const ds=dd.toISOString().slice(0,10);const evs=(byDay[ds]||[]).sort((a,b)=>(a.heure||'').localeCompare(b.heure||''));
    let ev='';evs.forEach(e=>{ev+=`<div class="cal-ev" style="background:${rdvTypeColor(e.type)}" onclick="event.stopPropagation();openRdv('${e.id}')">${e.heure?e.heure+' ':''}${esc(e.client||'RDV')}</div>`;});
    h+=`<div class="cal-cell ${ds===todayStr?'today':''}" style="min-height:240px" onclick="${can('rdv_manage')?`openRdvDate('${ds}')`:''}">${ev||'<div class="muted" style="font-size:.7rem">—</div>'}</div>`;});
  h+=`</div></div>`;area.innerHTML=h;
}
function drawCalList(area){
  const today=new Date();today.setHours(0,0,0,0);
  const rdvs=filteredRdvs().sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure));
  let h=`<div class="panel"><div class="panel-h"><h3>Tous les rendez-vous</h3></div><div class="panel-b">`;

  else{h+=`<div class="rdv-list" style="max-height:600px">`;rdvs.forEach(r=>{const past=new Date(r.date)<today;
    h+=`<div class="rdv-card" style="border-left-color:${rdvTypeColor(r.type)};${past?'opacity:.6':''}" onclick="openRdv('${r.id}')"><div class="rt"><span class="rn">${esc(r.client||'RDV')}</span><span class="rtime">${fmtDateLong(r.date)} ${r.heure||''}</span></div><div class="rm"><span style="color:${rdvTypeColor(r.type)};font-weight:700">${esc(r.type||'')}</span>${r.ville?' • '+esc(r.ville):''}${rdvWho(r)?' • '+esc(rdvWho(r)):''}</div></div>`;});h+=`</div>`;}
  h+=`</div></div>`;area.innerHTML=h;
}

function calMove(d){if(CAL.view==='semaine'){const b=CAL.sel?new Date(CAL.sel):new Date();b.setDate(b.getDate()+d*7);CAL.sel=b.toISOString().slice(0,10);}else{CAL.m+=d;if(CAL.m<0){CAL.m=11;CAL.y--;}if(CAL.m>11){CAL.m=0;CAL.y++;}}drawCalendar();}

function saveRdv(){
  const id=val('rd_id');const rdvs=getRdvs();
  let r=id?rdvs.find(x=>x.id===id):null;const isNew=!r;
  if(isNew){r={id:uid(),created:Date.now()};rdvs.push(r);}
  const type=val('rd_type');const kind=rdvKind(type);const interId=val('rd_user');
  let userId='',subId='',subName='',subKind='';
  if(kind==='user'||kind==='poseur'){userId=interId;}
  else{subId=interId;subKind=kind;const it=rdvList(kind).find(x=>x.id===interId);subName=it?it.name:'';}
  Object.assign(r,{recordId:val('rd_rec'),client:val('rd_client'),tel:val('rd_tel'),date:val('rd_date'),heure:val('rd_heure'),
    type,userId,subId,subName,subKind,ownerId:r.ownerId||ME.id,adresse:val('rd_adresse'),cp:val('rd_cp'),ville:val('rd_ville'),
    dept:val('rd_dept')||deptFromCP(val('rd_cp')),statusId:val('rd_status'),notes:val('rd_notes')});
  if(!r.date){toast('Date requise','err');return;}
  if(isNew&&userId&&userId!==ME.id){
    const rec=r.recordId?recById(r.recordId):null;
    createNotification(userId,'rdv_upcoming',`📅 Nouveau RDV le ${fmtDateLong(r.date)}${r.heure?' à '+r.heure:''} — ${rec?recName(rec):(r.client||'')}`,r.recordId);
  }
  // RDV lié à un dossier : on trace dans l'historique SANS jamais modifier le statut (le statut ne change que manuellement)

async function geocodeRdv(){

  if(!q){toast('Renseignez une adresse','err');return;}
  toast('Géolocalisation…');
  try{
    const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q='+encodeURIComponent(q));
    const j=await res.json();
    if(j&&j[0]){const id=val('rd_id');const rdvs=getRdvs();let r=id?rdvs.find(x=>x.id===id):null;
      if(!r){toast('Enregistrez d\'abord le RDV','err');return;}

    }else toast('Adresse introuvable','err');
  }catch(e){toast('Géolocalisation indisponible','err');}

function handleFile(file){

  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(!rows.length){toast('Fichier vide','err');return;}
      IMPORTED=rows;previewImport(rows);

      `</tbody></table></div>`;

function genCode(){
  const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let c;const ex=getUsers().map(u=>u.code.toUpperCase());
  do{c='';for(let i=0;i<3;i++)c+=L[Math.floor(Math.random()*L.length)];c+=Math.floor(100+Math.random()*900);}while(ex.includes(c));
  const f=document.getElementById('us_code');if(f)f.value=c;
}
function roleOptions(sel){
  let roles=Object.keys(ROLES);
  if(ME.role!=='superadmin')roles=roles.filter(r=>r!=='superadmin'&&r!=='admin');
  return roles.map(r=>`<option value="${r}" ${r===sel?'selected':''}>${ROLES[r]}</option>`).join('');
}
function permGrid(perms){
  const p=perms||{};

    const nbOn=g.items.filter(it=>p[it.k]).length;
    return `<div class="perm-group" data-group="${gi}" style="margin-bottom:.9rem">
      <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem;padding-bottom:.3rem;border-bottom:1px solid var(--border-grey)">
        <span style="font-size:.72rem;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;flex:1">${esc(g.g)}</span>
        <span class="muted" id="pg_count_${gi}" style="font-size:.68rem">${nbOn}/${g.items.length}</span>
        <button type="button" class="btn btn-ghost btn-sm" style="font-size:.66rem;padding:.15rem .5rem" onclick="toggleGroupPerms(${gi},true)">Tout</button>
        <button type="button" class="btn btn-ghost btn-sm" style="font-size:.66rem;padding:.15rem .5rem" onclick="toggleGroupPerms(${gi},false)">Aucun</button>
      </div>
      <div class="perm-grid">${g.items.map(it=>`<label class="perm-item"><input type="checkbox" data-perm="${it.k}" data-grp="${gi}" ${p[it.k]?'checked':''} onchange="updatePermCount(${gi})">${esc(it.l)}</label>`).join('')}</div>
    </div>`;

function toggleGroupPerms(gi,val){
  document.querySelectorAll(`#us_perms input[data-grp="${gi}"]`).forEach(c=>c.checked=val);
  updatePermCount(gi);
}
function updatePermCount(gi){
  const boxes=[...document.querySelectorAll(`#us_perms input[data-grp="${gi}"]`)];
  const el=document.getElementById('pg_count_'+gi);
  if(el)el.textContent=`${boxes.filter(b=>b.checked).length}/${boxes.length}`;
}
function setAllPerms(val){
  document.querySelectorAll('#us_perms input[data-perm]').forEach(c=>c.checked=val);
  PERM_GROUPS.forEach((g,gi)=>updatePermCount(gi));

async function callAdminManageUser(payload){
  const{data:{session}}=await SUPA.auth.getSession();
  if(!session)throw new Error('Session Supabase expirée — reconnectez-vous.');
  const{data,error}=await SUPA.functions.invoke('admin-manage-user',{
    body:payload,
    headers:{Authorization:'Bearer '+session.access_token}
  });
  if(error)throw error;
  if(data&&data.error)throw new Error(data.error);
  return data;
}
/* ---- envoi réel d'e-mail (Gmail via Edge Function "send-email") ---- */
async function callSendEmail(payload){
  const{data:{session}}=await SUPA.auth.getSession();
  if(!session)throw new Error('Session Supabase expirée — reconnectez-vous.');
  const{data,error}=await SUPA.functions.invoke('send-email',{
    body:payload,
    headers:{Authorization:'Bearer '+session.access_token}
  });

}
async function blobToBase64(blob){
  return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob);});
}
async function saveUser(){
  const id=val('us_id');const code=val('us_code').toUpperCase();const pwd=val('us_pwd');
  const prenom=val('us_prenom'),nom=val('us_nom');
  if(!prenom&&!nom){toast('Nom requis','err');return;}
  if(!code){toast('Code utilisateur requis','err');return;}
  if(!pwd){toast('Mot de passe requis','err');return;}
  const role=val('us_role');
  const familyId=val('us_family');
  if(role==='poseur'&&!familyId){
    const hasFamilies=load('egncrm_poseurs',[]).length>0;
    toast(hasFamilies?'Famille de poseurs requise pour ce rôle':'Créez d\'abord une famille dans Paramètres ▸ Poseur','err');
    return;
  }
  const users=getUsers();
  if(users.some(u=>u.code.toUpperCase()===code&&u.id!==id)){toast('Ce code est déjà utilisé','err');return;}
  let u=id?users.find(x=>x.id===id):null;const isNew=!u;
  const perms={};document.querySelectorAll('#us_perms input[data-perm]').forEach(cb=>perms[cb.dataset.perm]=cb.checked);
  const email=val('us_email'),team=val('us_team'),whatsapp=normWaNumber(val('us_whatsapp'));
  const passwordChanged=!isNew&&u.pwd!==pwd;

  if(isNew){
    try{
      const res=await callAdminManageUser({action:'create',code,password:pwd,prenom,nom,email,team,role,perms,active:true});
      u={id:res.id,created:Date.now(),active:true};
      users.push(u);
    }catch(e){toast('Erreur Supabase : '+e.message,'err');return;}
  }else if(passwordChanged||true){
    // synchronise systématiquement le profil (rôle/perms/actif), + mot de passe si modifié
    try{
      await callAdminManageUser({action:'update',userId:u.id,password:passwordChanged?pwd:undefined,prenom,nom,email,team,role,perms,active:u.active});
    }catch(e){toast('⚠️ Compte enregistré localement mais non synchronisé avec Supabase : '+e.message,'err');}
  }

  Object.assign(u,{prenom,nom,email,whatsapp,team,role,code,pwd,perms,sourceId:role==='commercial'?(val('us_source')||''):(u.sourceId||''),assignedUsers:US_ASSIGN.filter(x=>x!==u.id)});
  assignUserToFamily(u.id,role==='poseur'?familyId:'');
  save(K.users,users);
  await pushAssignedUsers(u.id,u.assignedUsers,u.sourceId,u.whatsapp);
  if(u.id===ME.id){ME=u;document.getElementById('meName').textContent=ME.prenom+' '+ME.nom;document.getElementById('meRole').textContent=ROLES[ME.role]||ME.role;}
  closeModal();buildNav();renderUsers();toast(isNew?'Utilisateur créé ✓':'Utilisateur enregistré ✓','ok');
}
async function toggleUser(id){const users=getUsers();const u=users.find(x=>x.id===id);if(!u)return;
  if(u.id===ME.id){toast('Vous ne pouvez pas vous désactiver','err');return;}
  if(u.role==='superadmin'){toast('Compte Super Admin protégé','err');return;}
  u.active=!u.active;
  try{await callAdminManageUser({action:'update',userId:u.id,prenom:u.prenom,nom:u.nom,email:u.email,team:u.team,role:u.role,perms:u.perms,active:u.active});}
  catch(e){toast('⚠️ Non synchronisé avec Supabase : '+e.message,'err');}
  save(K.users,users);renderUsers();buildNav();toast(u.active?'Compte activé':'Compte désactivé','ok');}
async function delUser(id){const u=userById(id);if(!u)return;
  if(u.role==='superadmin'){toast('Compte Super Admin non supprimable','err');return;}
  if(u.id===ME.id){toast('Vous ne pouvez pas vous supprimer','err');return;}

    try{await callAdminManageUser({action:'delete',userId:u.id});}

/* ---- Calcul sorties automatiques depuis dossiers ---- */
function calcSortiesAuto(mat){
  const champs=[].concat(mat.champsDossier||mat.champDossier||[]).filter(Boolean);
  const triggerIds=[].concat(mat.statutsDeclencheur||mat.statutDeclencheur||[]).filter(Boolean);
  if(!champs.length||!triggerIds.length)return 0;
  const stats=getStatuses();
  const triggerOrders=triggerIds.map(id=>{const s=stats.find(x=>x.id===id);return s?s.order??999:999;});
  const minOrder=Math.min(...triggerOrders);
  const fournisseursMat=(mat.fournisseurs||[]).map(f=>f.nom).filter(Boolean);
  const recs=getRecs().filter(r=>{
    if(mat.operationId&&r.productId!==mat.operationId)return false;
    const s=stats.find(x=>x.id===r.statusId);
    if(!s||(s.order??999)<minOrder)return false;
    // Filtre strict : le dossier DOIT avoir un fournisseur renseigné correspondant à ce matériel
    if(!r.fournisseurDossier)return false;
    return fournisseursMat.includes(r.fournisseurDossier);
  });
  let total=0;
  recs.forEach(r=>{
    if(!r.opFields)return;
    champs.forEach(champId=>{
      let val=r.opFields[champId];
      if(val==null){
        const op=getAllProducts().find(p=>p.id===r.productId);
        const field=(op?op.fields||[]:[] ).find(f=>f.key===champId||f.label===champId);
        if(field)val=r.opFields[field.id];
      }
      total+=parseFloat(val)||0;
    });
  });
  return Math.round(total*100)/100;
}

/* Dossiers contribuant aux sorties auto pour un matériel */
function getDossiersSorties(mat){
  const champs=[].concat(mat.champsDossier||mat.champDossier||[]).filter(Boolean);
  const triggerIds=[].concat(mat.statutsDeclencheur||mat.statutDeclencheur||[]).filter(Boolean);
  if(!champs.length||!triggerIds.length)return [];
  const stats=getStatuses();
  const triggerOrders=triggerIds.map(id=>{const s=stats.find(x=>x.id===id);return s?s.order??999:999;});
  const minOrder=Math.min(...triggerOrders);
  const fournisseursMat=(mat.fournisseurs||[]).map(f=>f.nom).filter(Boolean);
  return getRecs().filter(r=>{
    if(mat.operationId&&r.productId!==mat.operationId)return false;
    const s=stats.find(x=>x.id===r.statusId);
    if(!s||(s.order??999)<minOrder)return false;
    if(!r.fournisseurDossier)return false;
    return fournisseursMat.includes(r.fournisseurDossier);
  }).map(r=>{
    let qte=0;
    if(r.opFields){
      champs.forEach(champId=>{
        let val=r.opFields[champId];
        if(val==null){
          const op=getAllProducts().find(p=>p.id===r.productId);
          const field=(op?op.fields||[]:[] ).find(f=>f.key===champId||f.label===champId);
          if(field)val=r.opFields[field.id];
        }
        qte+=parseFloat(val)||0;
      });
    }
    // Trouver le fournisseur utilisé (depuis les entrées précédant ce dossier)
    return{r,qte};
  }).filter(x=>x.qte>0).sort((a,b)=>(b.r.updated||0)-(a.r.updated||0));
}

function stockFilterActive(tab){return Object.values(STOCK_FILTERS[tab]).some(v=>v);}

const FSTY="font-family:'Saira',sans-serif;font-size:.78rem;border:1.5px solid var(--border-grey);border-radius:8px;padding:.32rem .6rem;background:#fff;outline:none";
function allFournNames(){return [...new Set(getMats().flatMap(m=>(m.fournisseurs||[]).map(f=>f.nom).filter(Boolean)))].sort();}
function allOpNames(){return [...new Set(getMats().map(m=>m.operation).filter(Boolean))].sort();}
function stockStateOf(m,mvts){
  const e=mvts.filter(v=>v.materielId===m.id&&v.sens==='entree').reduce((s,v)=>s+(v.qte||0),0);
  const so=mvts.filter(v=>v.materielId===m.id&&v.sens==='sortie').reduce((s,v)=>s+(v.qte||0),0)+calcSortiesAuto(m);
  const stock=e-so;
  return{entrees:e,sorties:so,stock,alerte:!!(m.seuilAlerte&&stock<=m.seuilAlerte)};
}

function stockFilterBar(tab){
  const F=STOCK_FILTERS[tab];
  const typeOpts=Object.entries(STOCK_TYPES).map(([k,v])=>`<option value="${k}" ${F.type===k?'selected':''}>${v.icon} ${v.label}</option>`).join('');
  let h=`<div style="display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem">`;

    h+=`<select onchange="setStockFilter('mvt','sens',this)" style="${FSTY}"><option value="">Tous les types</option>

      <option value="commande" ${F.sens==='commande'?'selected':''}>🛒 Commande</option>
      <option value="reception" ${F.sens==='reception'?'selected':''}>✅ Réception</option>
      <option value="localisation" ${F.sens==='localisation'?'selected':''}>📍 Localisation</option></select>`;
  } else {
    h+=`<select onchange="setStockFilter('${tab}','op',this)" style="${FSTY}"><option value="">Toutes les opérations</option>${optList(allOpNames(),F.op)}</select>`;
    h+=`<select onchange="setStockFilter('${tab}','type',this)" style="${FSTY}"><option value="">Tous les types</option>${typeOpts}</select>`;
  }
  h+=`<select onchange="setStockFilter('${tab}','fourn',this)" style="${FSTY}"><option value="">Tous les fournisseurs</option>${optList(allFournNames(),F.fourn)}</select>`;
  if(tab==='etat'){
    h+=`<select onchange="setStockFilter('etat','statut',this)" style="${FSTY}"><option value="">Tous les statuts</option>
      <option value="ok" ${F.statut==='ok'?'selected':''}>✅ Stock OK</option>
      <option value="alerte" ${F.statut==='alerte'?'selected':''}>⚠️ Stock bas</option>
      <option value="epuise" ${F.statut==='epuise'?'selected':''}>⛔ Épuisé / négatif</option></select>`;
  }
  if(tab==='mvt'){
    h+=`<label style="font-size:.72rem;color:var(--text-mut);font-weight:600">Du</label><input type="date" value="${esc(F.du||'')}" onchange="setStockFilter('mvt','du',this)" style="${FSTY}">`;

  }
  h+=stockResetBtn(tab);
  h+=`</div>`;
  return h;
}
function filterMats(mats,tab,mvts){
  const F=STOCK_FILTERS[tab];
  return mats.filter(m=>{
    if(F.q){const q=F.q.toLowerCase();if(!`${m.nom||''} ${m.reference||''} ${m.operation||''}`.toLowerCase().includes(q))return false;}
    if(F.op&&m.operation!==F.op)return false;
    if(F.type&&(m.typeStock||'stock_fixe')!==F.type)return false;
    if(F.fourn&&!(m.fournisseurs||[]).some(f=>f.nom===F.fourn))return false;
    if(F.statut&&mvts){
      const st=stockStateOf(m,mvts);
      if(F.statut==='epuise'&&st.stock>0)return false;
      if(F.statut==='alerte'&&!(st.alerte&&st.stock>0))return false;
      if(F.statut==='ok'&&(st.alerte||st.stock<=0))return false;
    }
    return true;
  });
}

/* Coût unitaire moyen pondéré, calculé sur les achats réels (remise et frais inclus) */
function coutUnitaireMoyen(m,mvts){
  const ent=mvts.filter(v=>v.materielId===m.id&&['entree','reception'].includes(v.sens));
  const qte=ent.reduce((s,v)=>s+(v.qte||0),0);
  const ht=ent.reduce((s,v)=>s+(v.totalHT||0),0);
  if(qte&&ht)return ht/qte;
  if(m.prixUnitaire)return m.prixUnitaire;
  const px=(m.fournisseurs||[]).map(f=>parseFloat(f.prix)||0).filter(Boolean);
  return px.length?px.reduce((s,p)=>s+p,0)/px.length:0;
}

  const mats=getMats();const mvts=getMvts().slice().reverse();

  const sensLabels={entree:'📥 Entrée',sortie:'📤 Sortie',commande:'🛒 Commande',reception:'✅ Réception',localisation:'📍 Localisation'};
  const sensBg={entree:'background:#E6F7F0;color:#0F6E56',sortie:'background:#FFF4E5;color:#B96A0A',commande:'background:#E8F0FE;color:#1A5FD4',reception:'background:#EFF7E8;color:#3D7A1E',localisation:'background:#EFE9FC;color:#5B3AAA'};
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:.7rem">
    ${can('stock_edit')?`<button class="btn btn-pri btn-sm" onclick="openMvtModal()">+ Nouveau mouvement</button>`:''}
  </div>`;
  if(!mvts.length){h+=`<div class="empty"><div class="big">📋</div>Aucun mouvement enregistré.</div>`;document.getElementById('stockBody').innerHTML=h;return;}
  h+=stockFilterBar('mvt');
  const F=STOCK_FILTERS.mvt;
  const mvtsF=mvts.filter(v=>{
    const mat=mats.find(m=>m.id===v.materielId);
    const rec=v.dossierId?recById(v.dossierId):null;
    if(F.mat&&v.materielId!==F.mat)return false;
    if(F.sens&&v.sens!==F.sens)return false;
    if(F.fourn&&v.fournisseurNom!==F.fourn)return false;
    if(F.op&&(!mat||mat.operation!==F.op))return false;
    if(F.du&&v.date<new Date(F.du+'T00:00:00').getTime())return false;
    if(F.au&&v.date>new Date(F.au+'T23:59:59').getTime())return false;
    if(F.q){
      const q=F.q.toLowerCase();
      const hay=[mat?mat.nom:'',mat?mat.reference:'',v.notes,v.lieu,v.fournisseurNom,rec?rec.dossier:'',rec?clientNameOf(rec):''].join(' ').toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
  if(stockFilterActive('mvt')){
    const totHT=mvtsF.reduce((s,v)=>s+(v.totalHT||0),0);
    const totTva=mvtsF.reduce((s,v)=>s+(v.tvaRecup||0),0);
    h+=`<div style="display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center;background:var(--bg-soft);border-radius:9px;padding:.5rem .9rem;margin-bottom:.7rem;font-size:.78rem">
      <span><b>${mvtsF.length}</b> mouvement${mvtsF.length>1?'s':''} sur ${mvts.length}</span>
      <span>Total HT : <b>${eur(totHT)}</b></span>
      <span>TVA récupérable : <b style="color:var(--green-deep)">${eur(totTva)}</b></span>
    </div>`;
  }
  const masques=mvts.length-mvtsF.length;
  if(masques>0)h+=`<div style="background:#FFF4E5;border:1.5px solid #F0C486;border-radius:9px;padding:.5rem .9rem;margin-bottom:.7rem;font-size:.8rem;display:flex;align-items:center;gap:.6rem">
    <span>🔍</span><span style="flex:1"><b>${masques}</b> mouvement${masques>1?'s':''} masqué${masques>1?'s':''} par les filtres</span>
    <button class="btn btn-ghost btn-sm" style="font-size:.72rem" onclick="resetStockFilter('mvt')">✕ Tout afficher</button>
  </div>`;
  if(!mvtsF.length){h+=`<div class="empty"><div class="big">🔍</div>Aucun mouvement ne correspond aux filtres.</div>`;document.getElementById('stockBody').innerHTML=h;restoreStockFocus();return;}
  h+=`<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Date</th><th>Matériel</th><th>Type</th><th>Fournisseur</th><th class="r">Qté</th><th class="r">Total HT</th><th class="r">TVA récup.</th><th>Dossier</th><th>Notes</th><th>Facture</th><th></th></tr></thead><tbody>`;
  mvtsF.forEach(v=>{
    const mat=mats.find(m=>m.id===v.materielId);
    const r=v.dossierId?recById(v.dossierId):null;
    h+=`<tr>
      <td class="muted">${new Date(v.date).toLocaleDateString('fr-FR')}</td>
      <td><div style="font-weight:700;font-size:.83rem">${mat?esc(mat.nom):'—'}</div></td>
      <td><span style="border-radius:6px;padding:2px 8px;font-size:.7rem;font-weight:700;${sensBg[v.sens]||''}">${sensLabels[v.sens]||v.sens}</span></td>
      <td>${v.fournisseurNom?`<span style="font-size:.75rem;font-weight:700;color:var(--purple)">${esc(v.fournisseurNom)}</span>`:'<span class="muted">—</span>'}</td>
      <td style="text-align:right;font-weight:700">${v.qte||'—'} ${mat?esc(mat.unite||''):''}</td>
      <td style="text-align:right">${v.totalHT?eur(v.totalHT)+(v.remise?`<div style="font-size:.65rem;color:var(--coral)">-${eur(v.remise)} remise</div>`:'')+(v.totalFraisHT?`<div class="muted" style="font-size:.65rem">dont ${eur(v.totalFraisHT)} frais</div>`:'')+`<div class="muted" style="font-size:.65rem">${eur(v.prixUnitaireHT||0)}/u</div>`:'<span class="muted">—</span>'}</td>
      <td style="text-align:right;font-weight:700;color:var(--green-deep)">${v.tvaRecup?eur(v.tvaRecup):'<span class="muted">—</span>'}</td>
      <td>${r?`<span class="dossier-tag" style="cursor:pointer" onclick="openDossier('${r.id}')">${esc(r.dossier||'—')}</span><div class="muted" style="font-size:.7rem">${esc(clientNameOf(r))}</div>`:`<span class="muted">${esc(v.lieu||'—')}</span>`}</td>
      <td class="muted" style="font-size:.75rem">${esc(v.notes||'')}</td>
      <td>${v.factureUrl?`${attachLink(v.facturePath,v.factureNom||'Facture',v.factureUrl)}`:'<span class="muted" style="font-size:.72rem">—</span>'}</td>
      <td><div style="display:flex;gap:.3rem"><button class="iconbtn" onclick="editMvt('${v.id}')" title="Modifier">✏️</button><button class="iconbtn del" onclick="supprimerMvt('${v.id}')">🗑️</button></div></td>
    </tr>`;
  });
  h+=`</tbody></table></div>`;
  document.getElementById('stockBody').innerHTML=h;
  restoreStockFocus();
}

/* ---- CATALOGUE ---- */
function renderStockCatalogue(){
  const mats=getMats();
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:.7rem">${can('stock_edit')?`<button class="btn btn-pri btn-sm" onclick="openMatModal()">+ Nouveau matériel</button>`:''}</div>`;
  if(!mats.length){h+=`<div class="empty"><div class="big">📦</div>Aucun matériel. Cliquez sur "+ Nouveau matériel".</div>`;document.getElementById('stockBody').innerHTML=h;return;}
  h+=stockFilterBar('cat');
  const matsF=filterMats(mats,'cat');
  if(stockFilterActive('cat'))h+=`<p class="muted" style="font-size:.75rem;margin-bottom:.6rem">${matsF.length} matériel${matsF.length>1?'s':''} sur ${mats.length}</p>`;
  if(!matsF.length){h+=`<div class="empty"><div class="big">🔍</div>Aucun matériel ne correspond aux filtres.</div>`;document.getElementById('stockBody').innerHTML=h;restoreStockFocus();return;}
  h+=`<div class="tbl-wrap"><table class="tbl"><thead><tr>
    <th>Matériel</th><th>Type</th><th>Opération</th><th>Champ(s) lu(s)</th><th>Statut(s) déclencheur</th><th>Fournisseurs</th><th>Unité</th><th>Seuil</th><th class="r">Actions</th>
  </tr></thead><tbody>`;
  matsF.forEach(m=>{
    const stype=STOCK_TYPES[m.typeStock||'stock_fixe'];
    const op=getAllProducts().find(p=>p.id===m.operationId||p.name===m.operation);
    const champs=[].concat(m.champsDossier||m.champDossier||[]).filter(Boolean);
    const champLabels=champs.map(cid=>{const f=op?(op.fields||[]).find(x=>x.id===cid):null;return f?esc(f.label||f.key||cid):cid;});
    const trigStatIds=[].concat(m.statutsDeclencheur||m.statutDeclencheur||[]).filter(Boolean);
    const trigStats=trigStatIds.map(id=>getAllStatuses().find(s=>s.id===id)).filter(Boolean);
    const fourns=(m.fournisseurs||[]);
    h+=`<tr>
      <td><div style="font-weight:700">${esc(m.nom)}</div><div class="muted" style="font-size:.7rem">${esc(m.reference||'')}</div></td>
      <td><span style="font-size:.75rem">${stype.icon} ${stype.label}</span></td>
      <td class="muted">${esc(m.operation||'Toutes')}</td>
      <td>${champLabels.map(l=>`<span style="font-size:.7rem;background:#E8F0FE;color:#1A5FD4;border-radius:5px;padding:1px 6px;margin-right:2px">${l}</span>`).join('')||'<span class="muted">—</span>'}</td>
      <td>${trigStats.map(s=>`<span style="font-size:.7rem;font-weight:700;background:${s.color||'#ddd'}22;color:${s.color||'#666'};border-radius:5px;padding:1px 7px;margin-right:2px">${esc(s.name)}</span>`).join('')||'<span class="muted">—</span>'}</td>
      <td>${fourns.length?fourns.map(f=>`<div style="font-size:.72rem"><span style="font-weight:700;color:var(--purple)">${esc(f.nom)}</span> <span class="muted">${f.prix?f.prix.toLocaleString('fr-FR',{maximumFractionDigits:2})+' €/u':''}</span></div>`).join(''):'<span class="muted">—</span>'}</td>
      <td class="muted">${esc(m.unite||'unités')}</td>
      <td style="text-align:center;color:var(--text-mut)">${m.seuilAlerte||'—'}</td>
      <td style="text-align:right"><div style="display:flex;gap:.3rem;justify-content:flex-end"><button class="iconbtn" onclick="openMatModal('${m.id}')">✏️</button><button class="iconbtn del" onclick="supprimerMat('${m.id}')">🗑️</button></div></td>
    </tr>`;
  });
  h+=`</tbody></table></div>`;
  document.getElementById('stockBody').innerHTML=h;
  restoreStockFocus();
}

  const savedStats=[].concat(o.statutsDeclencheur||o.statutDeclencheur||[]).filter(Boolean);
  const statOpts=getStatuses().map(s=>`<option value="${s.id}" ${savedStats.includes(s.id)?'selected':''}>${esc(s.name)}</option>`).join('');

    <div class="fld"><label>Seuil alerte stock bas</label><input id="mat_seuil" type="number" value="${o.seuilAlerte||''}"></div>

      <select id="mat_statut" multiple size="4" style="height:auto;min-height:80px">${statOpts}</select>

  </div>`;
  openModal(id?'Modifier — '+esc(o.nom||'matériel'):'Nouveau matériel',body,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-pri" onclick="saveMat()">💾 Enregistrer</button>`,'wide');
  setTimeout(()=>{
    updateMatOpFields();
    const champSel=document.getElementById('mat_champ');
    const saved=[].concat(o.champsDossier||o.champDossier||[]).filter(Boolean);
    if(champSel)setTimeout(()=>[...champSel.options].forEach(opt=>{opt.selected=saved.includes(opt.value);}),80);
  },50);

function fourn_row_html(i,nom,contact,prix){
  return `<div class="fourn-row" style="display:flex;align-items:center;gap:.4rem;background:var(--bg-soft);border-radius:8px;padding:.45rem .7rem;margin-bottom:.35rem">
    <input placeholder="Fournisseur" value="${esc(nom||'')}" class="fourn-nom" style="flex:2;font-family:'Saira',sans-serif;font-size:.82rem;border:1px solid var(--border-grey);border-radius:7px;padding:.3rem .6rem">

    <span class="muted" style="font-size:.72rem;white-space:nowrap">€ HT/u</span>

  </div>`;
}
function addFournRow(){
  const end=document.getElementById('fourn-rows-end');
  if(!end)return;
  const div=document.createElement('div');
  div.innerHTML=fourn_row_html(Date.now(),'','','');
  end.before(div.firstChild);
}
function updateMatTypeDesc(val){
  const d=document.getElementById('mat_type_desc');
  if(d&&STOCK_TYPES[val])d.innerHTML=`<p class="muted" style="font-size:.78rem">${STOCK_TYPES[val].desc}</p>`;
}
function updateMatOpFields(){
  const opId=(document.getElementById('mat_op_id')||{}).value;
  const op=getAllProducts().find(p=>p.id===opId);
  const fields=(op?op.fields||[]:[]);
  const sel=document.getElementById('mat_champ');if(!sel)return;
  sel.innerHTML=fields.length
    ?fields.map(f=>`<option value="${esc(f.id)}">${esc(f.label||f.key||f.id)}</option>`).join('')
    :`<option value="">— Aucun champ disponible —</option>`;
}
function saveMat(){
  const id=STOCK_DRAFT.id;
  const opId=(document.getElementById('mat_op_id')||{}).value||'';
  const op=getAllProducts().find(p=>p.id===opId);
  const champSel=document.getElementById('mat_champ');
  const statSel=document.getElementById('mat_statut');
  const champsDossier=[...(champSel?champSel.selectedOptions:[])].map(o=>o.value).filter(Boolean);
  const statutsDeclencheur=[...(statSel?statSel.selectedOptions:[])].map(o=>o.value).filter(Boolean);
  // Collecter les fournisseurs
  const fournisseurs=[...document.querySelectorAll('.fourn-row')].map(row=>({
    nom:(row.querySelector('.fourn-nom')||{}).value||'',
    contact:(row.querySelector('.fourn-contact')||{}).value||'',
    prix:parseFloat((row.querySelector('.fourn-prix')||{}).value||0)||0
  })).filter(f=>f.nom);
  const mat={...STOCK_DRAFT,
    nom:(document.getElementById('mat_nom')||{}).value||'',
    reference:(document.getElementById('mat_ref')||{}).value||'',
    operationId:opId,operation:op?op.name:'',
    champsDossier,statutsDeclencheur,
    typeStock:(document.getElementById('mat_type')||{}).value||'stock_fixe',
    unite:(document.getElementById('mat_unite')||{}).value||'unités',
    seuilAlerte:parseInt((document.getElementById('mat_seuil')||{}).value||0)||null,
    notes:(document.getElementById('mat_notes')||{}).value||'',
    fournisseurs,
    prixUnitaire:fournisseurs.length?fournisseurs[0].prix:0
  };
  if(!mat.nom){toast('Saisissez un nom','err');return;}
  mat.segment=mat.segment||SEGMENT;
  const mats=getAllMats().filter(m=>m.id!==id);
  mats.push(mat);save('egncrm_materiels',mats);
  closeModal();renderStock();toast('Matériel enregistré ✓','ok');
}
function supprimerMat(id){
  modalConfirm('Supprimer ce matériel ?','Les mouvements associés ne seront pas supprimés.',async()=>{
    save('egncrm_materiels',getAllMats().filter(m=>m.id!==id));
    await deleteRemoteRow('egncrm_materiels',id);
    closeModal();renderStock();toast('Matériel supprimé ✓','ok');
  });
}

function updateMvtPrixFromFourn(){
  const sel=document.getElementById('mvt_fourn');if(!sel)return;

  const prix=opt?parseFloat(opt.dataset.prix)||0:0;

function updateMvtSens(){
  const matId=(document.getElementById('mvt_mat')||{}).value;
  const mat=getMats().find(m=>m.id===matId);
  if(!mat)return;
  updateMvtFourns();
  const sensEl=document.getElementById('mvt_sens');if(!sensEl)return;
  const opts={stock_fixe:['entree','sortie'],commande:['commande','reception'],circulant:['entree','localisation']};
  const allowed=opts[mat.typeStock||'stock_fixe']||['entree','sortie'];
  [...sensEl.options].forEach(o=>o.style.display=allowed.includes(o.value)?'':'none');

function updateMvtSensFields(){

  const isEntree=['entree','reception','commande'].includes(sens);

  ['mvt_fourn_block','mvt_prix_block','mvt_remise_block','mvt_tot_block','mvt_tva_block','mvt_frais_block','mvt_facture_block'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=isEntree?'':'none'});

function addFraisRow(){
  const list=document.getElementById('mvt_frais_list');if(!list)return;
  const row=document.createElement('div');
  row.style.cssText='display:flex;gap:.4rem;align-items:center;margin-bottom:.35rem';
  row.innerHTML=`<input placeholder="Nature (ex: Transport)" class="frais-label" style="flex:2;font-family:'Saira',sans-serif;font-size:.82rem;border:1px solid var(--border-grey);border-radius:7px;padding:.3rem .6rem">
    <input type="number" placeholder="Montant HT (€)" class="frais-ht" step="any" oninput="updateMvtCalc()" style="width:120px;font-family:'Saira',sans-serif;font-size:.82rem;border:1px solid var(--border-grey);border-radius:7px;padding:.3rem .6rem">
    <span class="muted" style="font-size:.72rem;white-space:nowrap">€ HT</span>
    <button onclick="this.parentElement.remove();updateMvtCalc()" style="background:none;border:none;cursor:pointer;color:var(--coral);font-size:1rem">✕</button>`;

function updateMvtCalc(){
  const qte=parseInt((document.getElementById('mvt_qte')||{}).value||1)||1;
  const pu=parseFloat((document.getElementById('mvt_prix_u')||{}).value||0)||0;
  const remise=parseFloat((document.getElementById('mvt_remise')||{}).value||0)||0;
  const tot=Math.max(0,qte*pu-remise);
  const eur=n=>n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
  const totEl=document.getElementById('mvt_tot');
  if(totEl)totEl.innerHTML=pu?eur(tot)+(remise>0?` <span style="font-size:.7rem;color:var(--coral)">(-${eur(remise)} remise)</span>`:''):'—';
  // Frais externes
  const fraisRows=[...document.querySelectorAll('.frais-ht')];
  const totalFraisHT=fraisRows.reduce((s,el)=>s+(parseFloat(el.value)||0),0);
  const totalGlobal=tot+totalFraisHT;
  const tvaGlobal=totalGlobal*(tvaRate()/100);
  const fraisTotEl=document.getElementById('mvt_frais_tot');if(fraisTotEl)fraisTotEl.textContent=totalFraisHT>0?eur(totalFraisHT):'—';
  const tvaEl=document.getElementById('mvt_tva');if(tvaEl)tvaEl.textContent=totalGlobal>0?eur(tvaGlobal):'—';
  const globalEl=document.getElementById('mvt_total_global');if(globalEl)globalEl.textContent=totalGlobal>0?eur(totalGlobal):'—';
}
async function saveMvt(){
  const matId=(document.getElementById('mvt_mat')||{}).value;
  const sens=(document.getElementById('mvt_sens')||{}).value;
  const qte=parseInt((document.getElementById('mvt_qte')||{}).value||1)||1;
  const prixU=parseFloat((document.getElementById('mvt_prix_u')||{}).value||0)||0;
  const remise=parseFloat((document.getElementById('mvt_remise')||{}).value||0)||0;
  const fourn=(document.getElementById('mvt_fourn')||{}).value||'';
  const totalHT=Math.max(0,qte*prixU-remise);
  // Frais externes
  const fraisRows=[...document.querySelectorAll('.frais-ht')];
  const fraisLabels=[...document.querySelectorAll('.frais-label')];
  const frais=fraisRows.map((el,i)=>({label:(fraisLabels[i]||{}).value||'Frais',ht:parseFloat(el.value)||0})).filter(f=>f.ht>0);
  const totalFraisHT=frais.reduce((s,f)=>s+f.ht,0);
  const totalHTGlobal=totalHT+totalFraisHT;
  const tvaRecup=['entree','reception'].includes(sens)?totalHTGlobal*(tvaRate()/100):0;
  const dossierNum=((document.getElementById('mvt_dossier')||{}).value||'').trim();
  const lieu=((document.getElementById('mvt_lieu')||{}).value||'').trim();
  const notes=((document.getElementById('mvt_notes')||{}).value||'').trim();
  const r=dossierNum?getRecs().find(x=>x.dossier===dossierNum):null;
  const editId=((document.getElementById('mvt_edit_id')||{}).value||'').trim();
  const mvtId=editId||uid();
  const mvts=getMvts();
  const newMvt={id:mvtId,materielId:matId,sens,qte,date:editId?(mvts.find(x=>x.id===editId)?.date||Date.now()):Date.now(),
    fournisseurNom:fourn,prixUnitaireHT:prixU,remise,totalHT:totalHTGlobal,tvaRecup,
    frais,totalFraisHT,
    dossierId:r?r.id:null,lieu,notes,user:ME.prenom};
  // Conserver factureUrl existante si pas de nouveau fichier
  if(editId){const old=mvts.find(x=>x.id===editId);if(old){newMvt.factureUrl=old.factureUrl;newMvt.facturePath=old.facturePath;newMvt.factureNom=old.factureNom;}}
  const idx=mvts.findIndex(x=>x.id===mvtId);
  if(idx>=0)mvts[idx]=newMvt;else mvts.push(newMvt);
  save('egncrm_stock_mvt',mergeSeg(getAllMvts(),mvts));
  // Upload facture si présente
  const fileInput=document.getElementById('mvt_facture_file');
  if(fileInput&&fileInput.files[0]){
    closeModal();toast('Enregistrement + upload de la facture…','ok');
    try{
      const file=fileInput.files[0];
      const ext=file.name.split('.').pop();
      const path=`stock_factures/${mvtId}.${ext}`;
      const{error}=await SUPA.storage.from('attachments').upload(path,file,{cacheControl:'3600',upsert:false});
      if(error)throw error;
      const pub={publicUrl:''}; // bucket prive : l'URL est signee a l'ouverture
      const idx=getMvts().findIndex(v=>v.id===mvtId);
      if(idx>=0){const mvts2=getMvts();mvts2[idx].factureUrl=pub.publicUrl;mvts2[idx].facturePath=path;mvts2[idx].factureNom=file.name;save('egncrm_stock_mvt',mvts2);}
      toast('Facture jointe ✓','ok');
    }catch(e){toast('Mouvement enregistré mais facture non uploadée : '+(e.message||e),'err');}
  } else {
    closeModal();toast('Mouvement enregistré ✓','ok');
  }
  if(!editId)resetStockFilter('mvt'); // un nouveau mouvement doit rester visible
  renderStock();
}

function filterLocList(selId,q){
  const sel=document.getElementById(selId);if(!sel)return;
  const s=(q||'').toLowerCase();
  [...sel.options].forEach(o=>{o.style.display=!s||o.textContent.toLowerCase().includes(s)?'':'none';});

function saveLoc(matId){
  const lire=side=>{
    const t=(document.getElementById('loc_'+side+'_type')||{}).value||'depot';
    if(t==='dossier'){
      const id=(document.getElementById('loc_'+side+'_dossier')||{}).value;
      const r=id?recById(id):null;
      return r?{recId:r.id,label:clientNameOf(r)+' ('+(r.dossier||'')+')'}:null;
    }
    const l=((document.getElementById('loc_'+side+'_lieu')||{}).value||'').trim();
    return l?{recId:null,label:l}:null;
  };
  const from=lire('from'),to=lire('to');
  if(!from){toast('Précisez la provenance','err');return;}
  if(!to){toast('Précisez la destination','err');return;}
  if(from.recId&&to.recId&&from.recId===to.recId){toast('Provenance et destination identiques','err');return;}
  const qte=parseInt((document.getElementById('loc_qte')||{}).value||1)||1;
  const notes=((document.getElementById('loc_notes')||{}).value||'').trim();
  const dateStr=(document.getElementById('loc_date')||{}).value;
  const ts=dateStr?new Date(dateStr+'T12:00:00').getTime():Date.now();
  const mvts=getMvts();
  mvts.push({id:uid(),materielId:matId,sens:'localisation',qte,date:ts,
    fromId:from.recId,fromLieu:from.label,
    dossierId:to.recId,lieu:to.label,notes,user:ME.prenom});
  save('egncrm_stock_mvt',mergeSeg(getAllMvts(),mvts));
  resetStockFilter('mvt'); // sinon un filtre actif masquerait le transfert
  closeModal();renderStock();toast(`🔄 ${from.label} → ${to.label}`,'ok');
}

function exportStockCSV(){

  let csv='Matériel;Type;Opération;Entrées;Sorties auto;Stock restant;Valeur HT;Fournisseurs\n';
  mats.forEach(m=>{
    const e=mvts.filter(v=>v.materielId===m.id&&v.sens==='entree').reduce((s,v)=>s+(v.qte||0),0);
    const sa=calcSortiesAuto(m);const sm=mvts.filter(v=>v.materielId===m.id&&v.sens==='sortie').reduce((s,v)=>s+(v.qte||0),0);
    const stock=e-sa-sm;
    csv+=`${m.nom};${STOCK_TYPES[m.typeStock]?.label||''};${m.operation||''};${e};${sa};${stock};${(Math.max(0,stock)*(m.prixUnitaire||0)).toFixed(2)};${(m.fournisseurs||[]).map(f=>f.nom).join(', ')}\n`;
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='stock_egn.csv';a.click();URL.revokeObjectURL(url);
}

  const el=document.getElementById('doc_page_content');

function docRestoreSelection(){
  const el=document.getElementById('doc_page_content');if(!el)return;

  if(DOC_SAVED_RANGE&&el.contains(DOC_SAVED_RANGE.startContainer)){sel.addRange(DOC_SAVED_RANGE);}
  else{const range=document.createRange();range.selectNodeContents(el);range.collapse(false);sel.addRange(range);}
}

function mailLog(recId,to,subject){const recs=getRecs();const r=recs.find(x=>x.id===recId);if(!r)return;r.history=r.history||[];r.history.unshift({date:Date.now(),user:(ME.prenom+' '+ME.nom).trim()||ME.code,text:`E-mail préparé pour ${to||'—'} : « ${subject||''} »`});save(K.recs,recs);logActivity('action',`✉️ E-mail préparé sur ${r.dossier||recId} pour ${to||'—'} : « ${subject||''} »`,recId);}

async function sendRealEmail(recId){
  const r=recById(recId);if(!r)return;
  const to=val('ms_to');const subject=document.getElementById('ms_subject').value;const bodyTxt=document.getElementById('ms_body').value;
  if(!to){toast('Destinataire requis','err');return;}
  if(!subject){toast('Objet requis','err');return;}
  const btns=document.querySelectorAll('#modalBox .modal-f button');btns.forEach(b=>b.disabled=true);
  toast('Envoi en cours…','ok');
  try{
    const checked=[...document.querySelectorAll('.ms_doc_chk:checked')].map(c=>c.value);
    const docs=(r.docs||[]).filter(d=>checked.includes(d.id));
    const attachments=[];
    for(const d of docs){
      if(!d.path)continue;
      const{data,error}=await SUPA.storage.from(ATTACH_BUCKET).download(d.path);
      if(error){console.error('[sendRealEmail] download',d.path,error);continue;}
      attachments.push({filename:d.filename||'document',content:await blobToBase64(data),contentType:d.mime||'application/octet-stream'});
    }
    const html=esc(bodyTxt).replace(/\n/g,'<br>');
    await callSendEmail({to,subject,html,attachments});
    mailSentLog(recId,to,subject,attachments.length);
    closeModal();toast('E-mail envoyé ✓','ok');
  }catch(e){console.error('[sendRealEmail]',e);toast('Échec de l\'envoi : '+(e.message||e),'err');}
  finally{btns.forEach(b=>b.disabled=false);}
}

let STAT_DRAG_IDX=null;

function statDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function statDrop(e,i){
  e.preventDefault();if(STAT_DRAG_IDX===null||STAT_DRAG_IDX===i)return;
  const sts=getStatuses();const moved=sts.splice(STAT_DRAG_IDX,1)[0];sts.splice(i,0,moved);
  // Persister l'ordre dans chaque objet pour que Supabase le conserve
  sts.forEach((s,idx)=>s.order=idx);
  STAT_DRAG_IDX=null;save(K.stat,mergeSeg(getAllStatuses(),sts));setStatuts();toast('Ordre mis à jour ✓','ok');
}

function moveStatus(i,dir){const sts=getStatuses();const j=i+dir;if(j<0||j>=sts.length)return;const t=sts[i];sts[i]=sts[j];sts[j]=t;sts.forEach((s,idx)=>s.order=idx);save(K.stat,mergeSeg(getAllStatuses(),sts));setStatuts();}

function openCoefU(id){

const SYNC_LABELS={
  records:'Dossiers / leads',rdvs:'Rendez-vous',cfg_statuses:'Statuts',cfg_sousstatuts:'Sous-statuts',
  cfg_operations:'Opérations',cfg_sources:'Sources / régies',cfg_equipes:'Équipes',cfg_doctypes:'Types de documents',

  stock_mouvements:'Mouvements de stock',apf_delegataires:'APF délégataires',cfg_societe:'Paramètres société'
};
const EXTRA_TABLES=[
  {table:'factures_agents',label:'APF / factures agents'},
  {table:'dossier_compta',label:'Comptabilité par dossier'},
  {table:'dossier_deal',label:'Deals / primes'},
  {table:'profiles',label:'Utilisateurs'}
];
async function runSyncDiag(){
  const body=document.getElementById('syncDiagBody');if(!body)return;
  body.innerHTML='<div class="empty"><div class="big">⏳</div>Vérification des tables Supabase…</div>';
  const checks=[
    ...SYNC_TABLES.map(c=>({table:c.table,label:SYNC_LABELS[c.table]||c.table,key:c.key,shape:c.shape})),
    ...EXTRA_TABLES.map(t=>({table:t.table,label:t.label,key:null}))
  ];
  const results=[];
  for(const c of checks){
    let remote=null,err=null;
    try{
      const{count,error}=await SUPA.from(c.table).select('*',{count:'exact',head:true});
      if(error)throw error;
      remote=count||0;
    }catch(e){err=e.message||String(e);}
    let local=null;
    if(c.key){
      const v=load(c.key,c.shape==='single'?null:[]);
      local=Array.isArray(v)?v.length:(v?1:0);
    }
    results.push({...c,remote,local,err});
  }
  const ko=results.filter(r=>r.err);
  const desync=results.filter(r=>!r.err&&r.local!=null&&r.local>r.remote);
  let h='';
  if(!ko.length&&!desync.length){
    h+=`<div style="background:#EFF7E8;border:1.5px solid var(--green);border-radius:10px;padding:.7rem 1rem;margin-bottom:.8rem;font-size:.84rem"><b>✅ Tout est synchronisé.</b> Chaque type de données est enregistré sur Supabase et visible par les utilisateurs autorisés.</div>`;
  } else {
    if(ko.length)h+=`<div style="background:#FEE8E8;border:1.5px solid var(--coral);border-radius:10px;padding:.7rem 1rem;margin-bottom:.6rem;font-size:.84rem"><b>⛔ ${ko.length} table${ko.length>1?'s':''} inaccessible${ko.length>1?'s':''}</b> — données conservées uniquement sur cet appareil. Lancez le SQL de mise en conformité dans Supabase.</div>`;
    if(desync.length)h+=`<div style="background:#FFF4E5;border:1.5px solid #F0C486;border-radius:10px;padding:.7rem 1rem;margin-bottom:.6rem;font-size:.84rem"><b>⚠️ ${desync.length} table${desync.length>1?'s':''} en retard</b> — des données locales n'ont pas été publiées. Utilisez « Republier » ci-dessous.</div>`;
  }
  h+=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Donnée</th><th>Table Supabase</th><th class="r">En ligne</th><th class="r">Sur cet appareil</th><th>État</th><th class="r"></th></tr></thead><tbody>`;
  results.forEach(r=>{
    let badge,action='';
    if(r.err)badge=`<span style="background:#FEE8E8;color:#A32D2D;border-radius:6px;padding:2px 8px;font-size:.7rem;font-weight:700">⛔ Erreur</span><div class="muted" style="font-size:.65rem;margin-top:.15rem">${esc(r.err)}</div>`;
    else if(r.local!=null&&r.local>r.remote){
      badge=`<span style="background:#FFF4E5;color:#B96A0A;border-radius:6px;padding:2px 8px;font-size:.7rem;font-weight:700">⚠️ En retard</span>`;
      action=`<button class="btn btn-ghost btn-sm" style="font-size:.7rem" onclick="republishTable('${r.key}')">⇧ Republier</button>`;
    }
    else badge=`<span style="background:#E6F7F0;color:#0F6E56;border-radius:6px;padding:2px 8px;font-size:.7rem;font-weight:700">✅ En ligne</span>`;
    h+=`<tr>
      <td style="font-weight:700">${esc(r.label)}</td>
      <td class="muted" style="font-size:.75rem">${esc(r.table)}</td>
      <td style="text-align:right;font-weight:700">${r.remote!=null?r.remote:'—'}</td>
      <td style="text-align:right" class="muted">${r.local!=null?r.local:'—'}</td>
      <td>${badge}</td>
      <td style="text-align:right">${action}</td>
    </tr>`;
  });
  h+=`</tbody></table></div>`;
  h+=`<p class="muted" style="font-size:.72rem;margin-top:.6rem">« En ligne » = lignes réellement présentes sur Supabase. Un écart normal peut apparaître si vos droits limitent la lecture à vos propres dossiers.</p>`;
  body.innerHTML=h;
}
async function republishTable(key){
  const cfg=SYNC_TABLES.find(c=>c.key===key);if(!cfg)return;
  const v=load(key,cfg.shape==='single'?{}:[]);
  toast('Publication en cours…','ok');
  await pushTable(cfg,v);
  toast('Données republiées ✓','ok');
  runSyncDiag();
}

function fieldInput(f,v){
  v=v||'';const id='opf_'+f.id;
  if(f.type==='siret')return `<div class="flex"><input id="${id}" value="${esc(v)}" placeholder="14 chiffres" style="flex:1"><button class="btn btn-navy btn-sm" type="button" onclick="lookupSiret('${f.id}')" title="Remplir via le SIRET">🔎 Auto</button></div>`;
  if(f.key==='adresse_siege'||f.key==='adresse_travaux'){const scope=f.key==='adresse_travaux'?'travaux':'siege';return `<div class="addr-wrap"><input type="text" id="${id}" value="${esc(v)}" autocomplete="off" placeholder="Saisir puis choisir l'adresse validée…" oninput="addrAC('${id}','${scope}',this.value)" onfocus="addrAC('${id}','${scope}',this.value)" onblur="addrBlur('${id}')"><div class="addr-sug" id="sug_${id}"></div></div>`;}
  if(f.type==='textarea')return `<textarea id="${id}">${esc(v)}</textarea>`;
  if(f.type==='select')return `<select id="${id}"><option value="">—</option>${(f.options||[]).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if(f.type==='bool')return `<select id="${id}"><option value="">—</option><option ${v==='Oui'?'selected':''}>Oui</option><option ${v==='Non'?'selected':''}>Non</option></select>`;
  const t=f.type==='number'?'number':f.type==='date'?'date':f.type==='tel'?'tel':f.type==='email'?'email':'text';
  return `<input type="${t}" id="${id}" value="${esc(v)}">`;
}
