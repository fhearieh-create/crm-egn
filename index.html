      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(!rows.length){toast('Fichier vide','err');return;}
      IMPORTED=rows;previewImport(rows);
    }catch(err){toast('Erreur de lecture du fichier','err');}
  };
  rd.readAsArrayBuffer(file);
}
function pick(row,keys){for(const k of keys){for(const rk in row){if(rk.toLowerCase().trim()===k.toLowerCase())return row[rk];}}return '';}
function mapRow(row){
  return {
    raisonSociale:pick(row,['Raison sociale','Raison Sociale','raison sociale','Société','Societe','Entreprise']),
    nom:pick(row,['Nom','nom','Nom complet','Contact']),
    tel:String(pick(row,['Téléphone','Telephone','téléphone','tel','Tel','Numéro','Numero','Portable','Mobile'])),
    email:pick(row,['Email','email','Mail','E-mail','mail']),
    adresse:pick(row,['Adresse','adresse','Adresse complète']),
    cp:String(pick(row,['Code postal','CP','cp','code postal'])),
    ville:pick(row,['Ville','ville','Commune'])
  };
}
function previewImport(rows){
  const m=rows.slice(0,50).map(mapRow);
  const cols=['Raison sociale','Nom','Téléphone','Email','Ville'];
  const uid2=val('imp_user');const u=uid2?userById(uid2):null;
  let h=`<div class="panel" style="margin-top:1.2rem"><div class="panel-h"><h3>Aperçu — ${rows.length} ligne(s)</h3><div class="sp"><button class="btn btn-ghost btn-sm" onclick="IMPORTED=[];document.getElementById('importPreview').innerHTML=''">Annuler</button> <button class="btn btn-pri btn-sm" onclick="doImport()">✓ Importer ${rows.length} lead(s)${u?' → '+esc(u.prenom):''}</button></div></div><div class="panel-b">
    <div class="preview-tbl"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  m.forEach(r=>{h+=`<tr><td>${esc(r.raisonSociale)}</td><td>${esc(r.nom)}</td><td>${esc(r.tel)}</td><td>${esc(r.email)}</td><td>${esc(r.ville)}</td></tr>`;});
  h+=`</tbody></table></div>${rows.length>50?'<p class="muted" style="margin-top:.5rem">Aperçu limité à 50 lignes. Tout sera importé.</p>':''}</div></div>`;
  document.getElementById('importPreview').innerHTML=h;
}
async function doImport(){
  if(!IMPORTED.length)return;
  const recs=getRecs();const sts=getStatuses();
  const defStatus=(sts.find(s=>s.name==='Nouveau')||sts[0]||{}).id;
  const assignId=val('imp_user');const assignUser=assignId?userById(assignId):null;
  const opId=val('imp_op');const op=opId?getProducts().find(o=>o.id===opId):null;
  const srcId=val('imp_src');const src=srcId?getSources().find(s=>s.id===srcId):null;
  let n=0;
  document.getElementById('importPreview').innerHTML=`<div class="panel" style="margin-top:1.2rem"><div class="panel-b"><div class="empty"><div class="big">⏳</div>Import en cours… (numérotation des dossiers)</div></div></div>`;
  for(const row of IMPORTED){
    const r=mapRow(row);
    if(!r.raisonSociale&&!r.nom&&!r.tel)continue;
    recs.push({id:uid(),dossier:await nextDossier(),created:Date.now(),
      raisonSociale:r.raisonSociale,nom:r.nom,tel:r.tel,email:r.email,adresse:r.adresse,cp:r.cp,ville:r.ville,
      dept:deptFromCP(r.cp),
      productId:opId||'',sourceId:srcId||'',statusId:defStatus,userId:assignId||'',
      history:[{date:Date.now(),user:(ME.prenom+' '+ME.nom).trim()||ME.code,text:'Importé depuis fichier'+(assignUser?' — attribué à '+assignUser.prenom+' '+assignUser.nom:'')+(op?' — opération : '+op.name:'')+(src?' — source : '+src.name:'')}]});
    n++;
  }
  save(K.recs,recs);IMPORTED=[];buildNav();
  document.getElementById('importPreview').innerHTML=`<div class="panel" style="margin-top:1.2rem"><div class="panel-b"><div class="empty"><div class="big">✅</div><b>${n} lead(s) importé(s) avec succès !</b>${assignUser?`<br><span class="muted">Attribués à ${esc(assignUser.prenom+' '+assignUser.nom)}</span>`:''}<br><button class="btn btn-pri" style="margin-top:1rem" onclick="go('leads')">Voir les leads →</button></div></div></div>`;

}

async function renderLoginHistory(){

async function callAdminManageUser(payload){
  const{data:{session}}=await SUPA.auth.getSession();
  if(!session)throw new Error('Session Supabase expirée — reconnectez-vous.');
  const{data,error}=await SUPA.functions.invoke('admin-manage-user',{
    body:payload,
    headers:{Authorization:'Bearer '+session.access_token}
  });
  if(error)throw error;
  if(data&&data.error)throw new Error(data.error);
  return data;
}

async function blobToBase64(blob){
  return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob);});
}
async function saveUser(){
  const id=val('us_id');const code=val('us_code').toUpperCase();const pwd=val('us_pwd');
  const prenom=val('us_prenom'),nom=val('us_nom');
  if(!prenom&&!nom){toast('Nom requis','err');return;}
  if(!code){toast('Code utilisateur requis','err');return;}
  if(!pwd){toast('Mot de passe requis','err');return;}
  const role=val('us_role');
  const familyId=val('us_family');
  if(role==='poseur'&&!familyId){
    const hasFamilies=load('egncrm_poseurs',[]).length>0;
    toast(hasFamilies?'Famille de poseurs requise pour ce rôle':'Créez d\'abord une famille dans Paramètres ▸ Poseur','err');
    return;
  }
  const users=getUsers();
  if(users.some(u=>u.code.toUpperCase()===code&&u.id!==id)){toast('Ce code est déjà utilisé','err');return;}
  let u=id?users.find(x=>x.id===id):null;const isNew=!u;
  const perms={};document.querySelectorAll('#us_perms input[data-perm]').forEach(cb=>perms[cb.dataset.perm]=cb.checked);
  const email=val('us_email'),team=val('us_team');
  const passwordChanged=!isNew&&u.pwd!==pwd;

  if(isNew){
    try{
      const res=await callAdminManageUser({action:'create',code,password:pwd,prenom,nom,email,team,role,perms,active:true});
      u={id:res.id,created:Date.now(),active:true};
      users.push(u);
    }catch(e){toast('Erreur Supabase : '+e.message,'err');return;}
  }else if(passwordChanged||true){
    // synchronise systématiquement le profil (rôle/perms/actif), + mot de passe si modifié
    try{
      await callAdminManageUser({action:'update',userId:u.id,password:passwordChanged?pwd:undefined,prenom,nom,email,team,role,perms,active:u.active});
    }catch(e){toast('⚠️ Compte enregistré localement mais non synchronisé avec Supabase : '+e.message,'err');}
  }

  Object.assign(u,{prenom,nom,email,team,role,code,pwd,perms,sourceId:role==='commercial'?(val('us_source')||''):(u.sourceId||''),assignedUsers:US_ASSIGN.filter(x=>x!==u.id)});
  assignUserToFamily(u.id,role==='poseur'?familyId:'');
  save(K.users,users);
  await pushAssignedUsers(u.id,u.assignedUsers,u.sourceId);
  if(u.id===ME.id){ME=u;document.getElementById('meName').textContent=ME.prenom+' '+ME.nom;document.getElementById('meRole').textContent=ROLES[ME.role]||ME.role;}
  closeModal();buildNav();renderUsers();toast(isNew?'Utilisateur créé ✓':'Utilisateur enregistré ✓','ok');
}
async function toggleUser(id){const users=getUsers();const u=users.find(x=>x.id===id);if(!u)return;
  if(u.id===ME.id){toast('Vous ne pouvez pas vous désactiver','err');return;}
  if(u.role==='superadmin'){toast('Compte Super Admin protégé','err');return;}
  u.active=!u.active;
  try{await callAdminManageUser({action:'update',userId:u.id,prenom:u.prenom,nom:u.nom,email:u.email,team:u.team,role:u.role,perms:u.perms,active:u.active});}
  catch(e){toast('⚠️ Non synchronisé avec Supabase : '+e.message,'err');}
  save(K.users,users);renderUsers();buildNav();toast(u.active?'Compte activé':'Compte désactivé','ok');}
async function delUser(id){const u=userById(id);if(!u)return;
  if(u.role==='superadmin'){toast('Compte Super Admin non supprimable','err');return;}
  if(u.id===ME.id){toast('Vous ne pouvez pas vous supprimer','err');return;}
  modalConfirm('Supprimer cet utilisateur ?',"Son compte Supabase sera aussi supprimé. Ses dossiers sont conservés.",async()=>{
    try{await callAdminManageUser({action:'delete',userId:u.id});}
    catch(e){toast('⚠️ Suppression Supabase échouée : '+e.message,'err');}
    save(K.users,getUsers().filter(x=>x.id!==id));closeModal();renderUsers();buildNav();toast('Utilisateur supprimé','ok');});
}

let SETTAB='statuts';
function renderSettings(){
  const tabs=[['statuts','Statuts'],['operations','Opérations'],['produits','Produits'],['delegataires','Délégataires'],['sources','Sources / Régies'],['vt','Visite technique'],['poseurs','Poseur'],['auditeurs','Auditeur'],['equipes','Équipes'],['documents','Types de docs'],['mails','Modèles e-mail'],['coefsu','Coefficients U'],['pac','Solutions PAC'],['societe','Société']];
  let h=`<div class="tabs">`+tabs.map(t=>`<button class="tab ${SETTAB===t[0]?'act':''}" onclick="SETTAB='${t[0]}';renderSettings()">${t[1]}</button>`).join('')+`</div><div id="setBody"></div>`;
  document.getElementById('content').innerHTML=h;
  document.getElementById('pageActions').innerHTML='';
  if(SETTAB==='statuts')setStatuts();
  else if(SETTAB==='operations')setOperations();
  else if(SETTAB==='produits')setProduits();
  else if(SETTAB==='delegataires')setDelegataires();
  else if(SETTAB==='mails')setMailTpl();
  else if(SETTAB==='societe')setSociete();
  else setSimple(SETTAB);
}
function setDelegataires(){
  const ds=getDelegataires();
  let h=`<div class="panel"><div class="panel-h"><h3>Délégataires CEE & valorisations</h3><div class="sp"><button class="btn btn-pri btn-sm" onclick="openDelegataire()">+ Nouveau délégataire</button></div></div><div class="panel-b"><p class="muted" style="margin-bottom:.9rem">Renseignez vos délégataires et la <b>valorisation</b> négociée (en €/MWh cumac) pour le <b>Classique</b> et le <b>Précaire</b>. Ces valeurs servent au calcul automatique de la prime dans l'onglet Deal des dossiers.</p><div class="cfg-list">`;
  if(!ds.length)h+=`<div class="muted">Aucun délégataire.</div>`;
  else h+=ds.map(d=>`<div class="cfg-item"><div style="flex:1"><div class="nm">${esc(d.name)}</div><div class="muted" style="font-size:.72rem;margin-top:.15rem">Classique : <b>${(parseFloat(d.valoClassique)||0).toString().replace('.',',')}</b> €/MWhc · Précaire : <b>${(parseFloat(d.valoPrecaire)||0).toString().replace('.',',')}</b> €/MWhc</div></div><span class="sp"><button class="iconbtn" onclick="openDelegataire('${d.id}')">✏️</button><button class="iconbtn del" onclick="delDelegataire('${d.id}')">🗑️</button></span></div>`).join('');
  h+=`</div></div></div>`;
  document.getElementById('setBody').innerHTML=h;
}
function openDelegataire(id){
  const d=id?getDelegataires().find(x=>x.id===id):null;const e=d||{};
  const body=`<input type="hidden" id="dg_id" value="${id||''}">
    <div class="fld"><label>Nom du délégataire</label><input id="dg_name" value="${esc(e.name||'')}" placeholder="ex : ACE ÉNERGIE"></div>
    <div class="fgrid" style="margin-top:.7rem">
      <div class="fld"><label>Valorisation Classique (€/MWh cumac)</label><input type="number" step="any" id="dg_classique" value="${e.valoClassique!=null?e.valoClassique:''}" placeholder="ex : 7.8"></div>
      <div class="fld"><label>Valorisation Précaire (€/MWh cumac)</label><input type="number" step="any" id="dg_precaire" value="${e.valoPrecaire!=null?e.valoPrecaire:''}" placeholder="ex : 13.5"></div>
    </div>
    <p class="muted" style="margin-top:.6rem;font-size:.74rem">Astuce : saisissez les décimales avec un point (7.8) ou une virgule (7,8).</p>`;
  openModal(id?'Modifier le délégataire':'Nouveau délégataire',body,`<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-pri" onclick="saveDelegataire()">💾 Enregistrer</button>`);
}
function saveDelegataire(){
  const id=val('dg_id');const name=val('dg_name');
  if(!name){toast('Nom requis','err');return;}
  const num=v=>parseFloat(String(v||'').replace(',','.'))||0;
  const vc=num(val('dg_classique')),vp=num(val('dg_precaire'));
  const ds=getDelegataires();
  if(id){const d=ds.find(x=>x.id===id);if(d){d.name=name;d.valoClassique=vc;d.valoPrecaire=vp;}}
  else ds.push({id:uid(),name,valoClassique:vc,valoPrecaire:vp});
  save('egncrm_delegataires',ds);closeModal();renderSettings();toast('Délégataire enregistré ✓','ok');
}
function delDelegataire(id){
  modalConfirm('Supprimer ce délégataire ?','',()=>{save('egncrm_delegataires',getDelegataires().filter(x=>x.id!==id));deleteRemoteRow('egncrm_delegataires',id);closeModal();renderSettings();toast('Délégataire supprimé','ok');});
}

function docUpdateNameLive(){
  const e=document.getElementById('doc_name');if(e)DOCDRAFT.name=e.value.trim();
  const sub=document.getElementById('doc_subtitle');if(sub)DOCDRAFT.subtitle=sub.value.trim();
  const t=document.getElementById('doc_page_title_preview');if(t)t.textContent=DOCDRAFT.name||'Titre du document';

}
/* ---- gestion de la position du curseur dans la zone éditable (nécessaire car le menu "Insérer une info" est un <select>, qui vole le focus) ---- */
let DOC_SAVED_RANGE=null;
function docSaveSelection(){
  const el=document.getElementById('doc_page_content');
  const sel=window.getSelection();
  if(sel&&sel.rangeCount>0&&el&&el.contains(sel.anchorNode))DOC_SAVED_RANGE=sel.getRangeAt(0).cloneRange();
}
function docRestoreSelection(){
  const el=document.getElementById('doc_page_content');if(!el)return;
  el.focus();
  const sel=window.getSelection();
  sel.removeAllRanges();
  if(DOC_SAVED_RANGE&&el.contains(DOC_SAVED_RANGE.startContainer)){sel.addRange(DOC_SAVED_RANGE);}
  else{const range=document.createRange();range.selectNodeContents(el);range.collapse(false);sel.addRange(range);}
}
function docExec(cmd,val){document.getElementById('doc_page_content').focus();document.execCommand(cmd,false,val||null);}
function docInsertTable(){
  document.getElementById('doc_page_content').focus();
  const html='<table style="width:100%;border-collapse:collapse;margin:.5rem 0"><tr><td style="border:1px solid #ccc;padding:6px">Cellule</td><td style="border:1px solid #ccc;padding:6px">Cellule</td></tr><tr><td style="border:1px solid #ccc;padding:6px">Cellule</td><td style="border:1px solid #ccc;padding:6px">Cellule</td></tr></table><p><br></p>';
  document.execCommand('insertHTML',false,html);
}
function docSetFontName(name){
  if(!name)return;
  docRestoreSelection();
  document.execCommand('fontName',false,name);
  docSaveSelection();
}
function docSetFontSize(pt){
  if(!pt)return;
  docRestoreSelection();
  document.execCommand('fontSize',false,'7'); // valeur intermédiaire imposée par le navigateur, remplacée juste après
  const el=document.getElementById('doc_page_content');
  el.querySelectorAll('font[size="7"]').forEach(f=>{f.removeAttribute('size');f.style.fontSize=pt+'pt';});
  docSaveSelection();
}
function docInsertPlaceholder(key){
  if(!key)return;
  docRestoreSelection();
  document.execCommand('insertText',false,'{{'+key+'}}');
  docSaveSelection();
}
function docAddOp(id){if(!id)return;docCaptureName();docCapturePage();DOCDRAFT.operationIds=DOCDRAFT.operationIds||[];if(!DOCDRAFT.operationIds.includes(id))DOCDRAFT.operationIds.push(id);renderDocEditor();}
function docRemoveOp(id){docCaptureName();docCapturePage();DOCDRAFT.operationIds=(DOCDRAFT.operationIds||[]).filter(x=>x!==id);renderDocEditor();}
function docGoPage(delta){docCaptureName();docCapturePage();DOC_PAGE_IDX=Math.max(0,Math.min(DOCDRAFT.pages.length-1,DOC_PAGE_IDX+delta));renderDocEditor();}
function docAddPage(){docCaptureName();docCapturePage();DOCDRAFT.pages.push({id:uid(),html:''});DOC_PAGE_IDX=DOCDRAFT.pages.length-1;renderDocEditor();}
function docDelPage(){
  if(DOCDRAFT.pages.length<=1)return;
  docCaptureName();
  DOCDRAFT.pages.splice(DOC_PAGE_IDX,1);
  DOC_PAGE_IDX=Math.max(0,DOC_PAGE_IDX-1);
  renderDocEditor();
}
function saveDocTemplate(){
  docCaptureName();docCapturePage();
  if(!DOCDRAFT.name){toast('Nom du modèle requis','err');return;}
  const list=getDocTemplates();
  const idx=list.findIndex(t=>t.id===DOCDRAFT.id);
  if(idx>=0)list[idx]=DOCDRAFT;else list.push(DOCDRAFT);
  save('egncrm_doctemplates',list);
  logActivity('action',`📄 Modèle de document enregistré : ${DOCDRAFT.name}`);
  DOCDRAFT=null;closeModal();renderDocsTab();toast('Modèle enregistré ✓','ok');
}
function delDocTemplate(id){
  modalConfirm('Supprimer ce modèle de document ?','',()=>{
    save('egncrm_doctemplates',getDocTemplates().filter(t=>t.id!==id));
    deleteRemoteRow('egncrm_doctemplates',id);
    closeModal();renderDocsTab();toast('Modèle supprimé','ok');
  });
}

async function sendRealEmail(recId){
  const r=recById(recId);if(!r)return;
  const to=val('ms_to');const subject=document.getElementById('ms_subject').value;const bodyTxt=document.getElementById('ms_body').value;
  if(!to){toast('Destinataire requis','err');return;}
  if(!subject){toast('Objet requis','err');return;}
  const btns=document.querySelectorAll('#modalBox .modal-f button');btns.forEach(b=>b.disabled=true);
  toast('Envoi en cours…','ok');
  try{
    const checked=[...document.querySelectorAll('.ms_doc_chk:checked')].map(c=>c.value);
    const docs=(r.docs||[]).filter(d=>checked.includes(d.id));
    const attachments=[];
    for(const d of docs){
      if(!d.path)continue;
      const{data,error}=await SUPA.storage.from(ATTACH_BUCKET).download(d.path);
      if(error){console.error('[sendRealEmail] download',d.path,error);continue;}
      attachments.push({filename:d.filename||'document',content:await blobToBase64(data),contentType:d.mime||'application/octet-stream'});
    }
    const html=esc(bodyTxt).replace(/\n/g,'<br>');
    await callSendEmail({to,subject,html,attachments});
    mailSentLog(recId,to,subject,attachments.length);
    closeModal();toast('E-mail envoyé ✓','ok');
  }catch(e){console.error('[sendRealEmail]',e);toast('Échec de l\'envoi : '+(e.message||e),'err');}
  finally{btns.forEach(b=>b.disabled=false);}
}

/* -- rendu d'un champ personnalisé dans la fiche lead -- */
function fieldInput(f,v){
  v=v||'';const id='opf_'+f.id;
  if(f.type==='siret')return `<div class="flex"><input id="${id}" value="${esc(v)}" placeholder="14 chiffres" style="flex:1"><button class="btn btn-navy btn-sm" type="button" onclick="lookupSiret('${f.id}')" title="Remplir via le SIRET">🔎 Auto</button></div>`;
  if(f.key==='adresse_siege'||f.key==='adresse_travaux'){const scope=f.key==='adresse_travaux'?'travaux':'siege';return `<div class="addr-wrap"><input type="text" id="${id}" value="${esc(v)}" autocomplete="off" placeholder="Saisir puis choisir l'adresse validée…" oninput="addrAC('${id}','${scope}',this.value)" onfocus="addrAC('${id}','${scope}',this.value)" onblur="addrBlur('${id}')"><div class="addr-sug" id="sug_${id}"></div></div>`;}
  if(f.type==='textarea')return `<textarea id="${id}">${esc(v)}</textarea>`;
  if(f.type==='select')return `<select id="${id}"><option value="">—</option>${(f.options||[]).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if(f.type==='bool')return `<select id="${id}"><option value="">—</option><option ${v==='Oui'?'selected':''}>Oui</option><option ${v==='Non'?'selected':''}>Non</option></select>`;
  const t=f.type==='number'?'number':f.type==='date'?'date':f.type==='tel'?'tel':f.type==='email'?'email':'text';
  return `<input type="${t}" id="${id}" value="${esc(v)}">`;
}
function renderOpFields(){
  const wrap=document.getElementById('lf_opfields_wrap');if(!wrap)return;
  const opId=(document.getElementById('lf_op')||{}).value||'';
  const op=getProducts().find(p=>p.id===opId);
  const fields=(op&&op.fields)||[];
  if(!fields.length){wrap.innerHTML=opId?`<div class="muted" style="font-size:.78rem">Aucun champ pour cette opération. Ajoutez-en dans <b>Paramètres ▸ Opérations</b>.</div>`:`<div class="muted" style="font-size:.82rem">Sélectionnez une opération pour afficher le formulaire à remplir.</div>`;return;}
  const valueFor=f=>{let v=LF_OPVALS[f.id];if((v==null||v==='')&&f.key&&LF_REC)v=canonByKey(LF_REC,f.key);return v||'';};
  let h=`<div class="sectitle" style="margin-top:0">Informations — ${esc(op.name)}</div><div class="fgrid">`;
  fields.forEach(f=>{
    const full=(f.type==='textarea')?' full':'';
    let cls='',dc='';
    if(f.showIf){const ctrl=fields.find(x=>x.key===f.showIf);cls=' op-cond';dc=` data-ctrl="${ctrl?ctrl.id:''}"`;}
    h+=`<div class="fld${full}${cls}"${dc}><label>${esc(f.label)}${f.required?' <span style="color:var(--coral)">*</span>':''}</label>${fieldInput(f,valueFor(f))}</div>`;
  });
  h+=`</div>`;wrap.innerHTML=h;
  // brancher les contrôleurs de conditions
  fields.forEach(f=>{if(fields.some(x=>x.showIf===f.key)){const el=document.getElementById('opf_'+f.id);if(el)el.addEventListener('change',applyOpConditionals);}});
  applyOpConditionals();
}
/* -- autocomplétion d'adresse via la Base Adresse Nationale (gratuit, sans clé) -- */
let ADDR_SUG={},ADDR_T={};
function addrAC(inputId,scope,q){clearTimeout(ADDR_T[inputId]);ADDR_T[inputId]=setTimeout(()=>addrACgo(inputId,scope,q),250);}
async function addrACgo(inputId,scope,q){
  const box=document.getElementById('sug_'+inputId);if(!box)return;
  if(!q||q.trim().length<3){box.innerHTML='';box.style.display='none';return;}
  try{
    const res=await fetch('https://api-adresse.data.gouv.fr/search/?limit=6&autocomplete=1&q='+encodeURIComponent(q));
    const j=await res.json();const feats=(j&&j.features)||[];
    ADDR_SUG[inputId]=feats.map(f=>({name:f.properties.name||f.properties.label||'',cp:f.properties.postcode||'',ville:f.properties.city||'',label:f.properties.label||''}));
    if(!feats.length){box.innerHTML=`<div class="addr-empty">Aucune adresse trouvée</div>`;box.style.display='block';return;}
    box.innerHTML=ADDR_SUG[inputId].map((s,i)=>`<div class="addr-item" onmousedown="addrPick('${inputId}','${scope}',${i})"><b>${esc(s.name)}</b><span class="muted"> · ${esc(s.cp)} ${esc(s.ville)}</span></div>`).join('');
    box.style.display='block';
  }catch(e){box.style.display='none';}
}
function addrSiblings(scope){
  const op=getProducts().find(p=>p.id===(document.getElementById('lf_op')||{}).value);
  const fields=(op&&op.fields)||[];
  const cpf=fields.find(f=>f.key==='cp_'+scope);const vlf=fields.find(f=>f.key==='ville_'+scope);
  return {cp:cpf?('opf_'+cpf.id):null,ville:vlf?('opf_'+vlf.id):null};
}
function addrPick(inputId,scope,i){
  const s=(ADDR_SUG[inputId]||[])[i];if(!s)return;
  const inp=document.getElementById(inputId);if(inp)inp.value=s.name;
  const sib=addrSiblings(scope);
  if(sib.cp){const e=document.getElementById(sib.cp);if(e)e.value=s.cp;}
  if(sib.ville){const e=document.getElementById(sib.ville);if(e)e.value=s.ville;}
  addrClose(inputId);
}
function addrClose(inputId){const b=document.getElementById('sug_'+inputId);if(b)b.style.display='none';}
function addrBlur(inputId){setTimeout(()=>addrClose(inputId),200);}

  const o=OPDRAFT;const c=o.cumac||{mode:'manuel'};

    if(c.byField){
      const bf=o.fields.find(f=>f.id===c.byField);
      const opts=bf?(bf.type==='bool'?['Oui','Non']:(bf.options||[])):[];
      h+=`<div class="fgrid" style="margin-top:.5rem">`+(opts.length?opts.map(op=>`<div class="fld"><label>Coefficient pour « ${esc(op)} » (kWhc / unité)</label><input type="number" step="any" data-opt="${esc(op)}" value="${(c.coefs&&c.coefs[op]!=null&&c.coefs[op]!==0)?c.coefs[op]:''}" onchange="opCumacCoef(this.dataset.opt,this.value)" placeholder="coef. fiche"></div>`).join(''):`<p class="muted">Ce champ « choix » n'a pas encore d'options.</p>`)+`</div>`;
    } else {
      h+=`<div class="fld" style="margin-top:.5rem"><label>Coefficient fixe (kWhc / unité)</label><input type="number" step="any" value="${c.coef?c.coef:''}" onchange="opCumacCoef('',this.value)" placeholder="ex : 156"></div>`;
    }
    h+=`<p class="muted" style="margin-top:.45rem;font-size:.74rem"><b>Formule :</b> cumac = coefficient × valeur du champ. Ex. BAT-TH-142 : coefficient (Convectif / Radiatif, à saisir d'après la fiche) × puissance (kW).</p>`;
  }
  if(c.mode==='multi'){
    const factors=c.factors||[];
    h+=`<p class="muted" style="margin-top:.5rem;font-size:.78rem">Le cumac est le <b>produit</b> de tous les facteurs ci-dessous (multipliés entre eux). Chaque facteur peut être une valeur fixe, un champ numérique, ou une table de correspondance selon 1 ou 2 critères (croisés). Si le champ nécessaire n'existe pas encore sur la fiche, il est <b>créé automatiquement</b> quand tu l'ajoutes ici.</p>`;
    h+=`<div class="cfg-list" style="margin-top:.6rem">`;
    if(!factors.length)h+=`<div class="muted" style="font-size:.82rem;padding:.4rem 0">Aucun facteur. Ajoutez le premier ci-dessous (ex : coefficient de base selon zone climatique).</div>`;
    else factors.forEach((f,i)=>{
      const typeLbl={fixed:'Valeur fixe',field:'Champ numérique',table1d:'Table (1 critère)',table2d:'Table (2 critères croisés)'}[f.type]||f.type;
      h+=`<div class="cfg-item"><span class="nm">${i+1}. ${esc(f.label||'(sans nom)')}</span><span class="tag" style="background:#eef0f2;color:#6b7785">${typeLbl}</span><span class="sp"><button class="iconbtn" onclick="opEditFactor(${i})">✏️</button><button class="iconbtn del" onclick="opDelFactor(${i})">🗑️</button></span></div>`;
    });
    h+=`</div><button class="btn btn-ghost btn-sm" style="margin-top:.6rem" onclick="opAddFactor()">+ Ajouter un facteur</button>
    <p class="muted" style="margin-top:.5rem;font-size:.74rem"><b>Formule :</b> cumac = ${factors.length?factors.map(f=>esc(f.label||'?')).join(' × '):'facteur 1 × facteur 2 × …'}</p>`;
  }
  return h;
}
function opEnsureCumac(){OPDRAFT.cumac=OPDRAFT.cumac||{mode:'manuel',field:'',byField:'',coef:0,coefs:{},factors:[]};if(!OPDRAFT.cumac.factors)OPDRAFT.cumac.factors=[];return OPDRAFT.cumac;}
function opCumacMode(m){opCaptureName();opEnsureCumac().mode=m;renderOpEditor();}
function opCumacField(k,v){opCaptureName();const c=opEnsureCumac();c[k]=v;if(k==='byField')c.coefs=c.coefs||{};renderOpEditor();}
function opCumacCoef(opt,v){const c=opEnsureCumac();const num=parseFloat(String(v||'').replace(',','.'))||0;if(!opt)c.coef=num;else{c.coefs=c.coefs||{};c.coefs[opt]=num;}}
let CUMFACTOR_IDX=null;
function opAddFactor(){opCaptureName();const c=opEnsureCumac();CUMFACTOR_IDX=c.factors.length;c.factors.push({id:uid(),type:'fixed',label:'',value:1});renderFactorEditor();}
function opEditFactor(i){opCaptureName();CUMFACTOR_IDX=i;renderFactorEditor();}
function opDelFactor(i){opCaptureName();opEnsureCumac().factors.splice(i,1);renderOpEditor();}
function fieldPickerHtml(idPrefix,kind,selectedId){
  const fields=kind==='number'?OPDRAFT.fields.filter(x=>x.type==='number'&&x.label&&x.label.trim()):OPDRAFT.fields.filter(x=>(x.type==='select'||x.type==='bool')&&x.label&&x.label.trim());
  return `<div class="fld"><label>Champ existant</label><select id="${idPrefix}_sel"><option value="">— Aucun (créer un nouveau champ ci-dessous) —</option>${fields.map(x=>`<option value="${x.id}" ${selectedId===x.id?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div>
  <div class="fld"><label>Ou créer un nouveau champ ${kind==='choice'?'(liste déroulante)':'(nombre)'}</label><input id="${idPrefix}_new" placeholder="${kind==='choice'?'Ex : Zone climatique':'Ex : Surface totale chauffée (m²)'}"></div>
  ${kind==='choice'?`<div class="fld"><label>Options du nouveau champ — une par ligne <span class="muted" style="font-size:.66rem">(ignoré si tu choisis un champ existant)</span></label><textarea id="${idPrefix}_newopts" rows="3" placeholder="H1&#10;H2&#10;H3"></textarea></div>`:''}`;
}
function resolveOrCreateField(idPrefix,kind){
  const newEl=document.getElementById(idPrefix+'_new');
  const newName=newEl?newEl.value.trim():'';
  if(newName){
    let opts=[];
    if(kind==='choice'){
      const oEl=document.getElementById(idPrefix+'_newopts');
      opts=oEl?oEl.value.split('\n').map(s=>s.trim()).filter(Boolean):[];
      if(!opts.length){toast('Ajoutez au moins une option pour ce nouveau champ','err');return '';}
    }
    const nf={id:uid(),label:newName,type:kind==='choice'?'select':'number',options:opts,required:false};
    OPDRAFT.fields.push(nf);
    return nf.id;
  }
  const selEl=document.getElementById(idPrefix+'_sel');
  return selEl?selEl.value:'';
}
function renderFactorTypeBody(f){
  if(f.type==='fixed')return `<div class="fld" style="margin-top:.5rem"><label>Valeur</label><input type="number" step="any" id="cf_fixed_val" value="${f.value!=null?f.value:''}" placeholder="ex : 1"></div>`;
  if(f.type==='field')return `<div style="margin-top:.5rem">${fieldPickerHtml('cf_field','number',f.field)}</div>`;
  if(f.type==='table1d'){
    let h=`<div style="margin-top:.5rem">${fieldPickerHtml('cf_t1','choice',f.field)}</div>
    <button class="btn btn-ghost btn-sm" style="margin-top:.5rem" onclick="cfGenerateTable1d()">→ Générer la grille de valeurs</button>`;
    if(f.field){
      const bf=OPDRAFT.fields.find(x=>x.id===f.field);
      const opts=bf?(bf.type==='bool'?['Oui','Non']:(bf.options||[])):[];
      if(opts.length)h+=`<div class="fgrid" style="margin-top:.6rem">`+opts.map(o=>`<div class="fld"><label>${esc(o)}</label><input type="number" step="any" data-opt="${esc(o)}" class="cf-t1-val" value="${f.table&&f.table[o]!=null?f.table[o]:''}" placeholder="0"></div>`).join('')+`</div>`;
    }
    return h;
  }
  if(f.type==='table2d'){
    let h=`<div style="margin-top:.5rem">${fieldPickerHtml('cf_t2a','choice',f.field1)}</div>
    <div style="margin-top:.5rem">${fieldPickerHtml('cf_t2b','choice',f.field2)}</div>
    <button class="btn btn-ghost btn-sm" style="margin-top:.5rem" onclick="cfGenerateTable2d()">→ Générer la grille croisée</button>`;
    if(f.field1&&f.field2){
      const bf1=OPDRAFT.fields.find(x=>x.id===f.field1),bf2=OPDRAFT.fields.find(x=>x.id===f.field2);
      const opts1=bf1?(bf1.type==='bool'?['Oui','Non']:(bf1.options||[])):[];
      const opts2=bf2?(bf2.type==='bool'?['Oui','Non']:(bf2.options||[])):[];
      if(opts1.length&&opts2.length)h+=`<div class="tbl-wrap" style="margin-top:.6rem;overflow-x:auto"><table class="tbl"><thead><tr><th>${esc(bf1.label)} \\ ${esc(bf2.label)}</th>${opts2.map(o2=>`<th>${esc(o2)}</th>`).join('')}</tr></thead><tbody>${opts1.map(o1=>`<tr><td style="font-weight:700">${esc(o1)}</td>${opts2.map(o2=>{const k=o1+'|'+o2;return `<td><input type="number" step="any" class="cf-t2-val" data-key="${esc(k)}" value="${f.table&&f.table[k]!=null?f.table[k]:''}" style="width:80px" placeholder="0"></td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
    return h;
  }
  return '';
}
function renderFactorEditor(){
  const c=opEnsureCumac();const f=c.factors[CUMFACTOR_IDX];if(!f)return;
  let body=`<div class="fld"><label>Nom du facteur</label><input id="cf_label" value="${esc(f.label)}" placeholder="Ex : Coefficient de base, Surface totale, Facteur secteur…"></div>
  <div class="fld" style="margin-top:.5rem"><label>Type de facteur</label><select id="cf_type" onchange="cfTypeChange(this.value)">
    <option value="fixed" ${f.type==='fixed'?'selected':''}>Valeur fixe</option>
    <option value="field" ${f.type==='field'?'selected':''}>Champ numérique de la fiche (ex : Surface)</option>
    <option value="table1d" ${f.type==='table1d'?'selected':''}>Table selon 1 critère (ex : Secteur → facteur)</option>
    <option value="table2d" ${f.type==='table2d'?'selected':''}>Table selon 2 critères croisés (ex : Etas × Zone climatique)</option>
  </select></div>
  <div id="cf_body">${renderFactorTypeBody(f)}</div>`;
  openModal('Facteur : '+(f.label||'nouveau'),body,`<button class="btn btn-ghost" onclick="renderOpEditor()">← Retour</button><button class="btn btn-pri" onclick="factorSave()">✓ Valider le facteur</button>`,'wide');
}
function cfTypeChange(t){
  const c=opEnsureCumac();const f=c.factors[CUMFACTOR_IDX];
  const lab=document.getElementById('cf_label');if(lab)f.label=lab.value.trim();
  f.type=t;
  renderFactorEditor();
}
function cfGenerateTable1d(){
  const c=opEnsureCumac();const f=c.factors[CUMFACTOR_IDX];
  const lab=document.getElementById('cf_label');if(lab)f.label=lab.value.trim();
  const fid=resolveOrCreateField('cf_t1','choice');
  if(!fid){toast('Choisissez ou créez un champ','err');return;}
  f.field=fid;f.table=f.table||{};
  renderFactorEditor();
}
function cfGenerateTable2d(){
  const c=opEnsureCumac();const f=c.factors[CUMFACTOR_IDX];
  const lab=document.getElementById('cf_label');if(lab)f.label=lab.value.trim();
  const fid1=resolveOrCreateField('cf_t2a','choice');
  const fid2=resolveOrCreateField('cf_t2b','choice');
  if(!fid1||!fid2){toast('Choisissez ou créez les deux champs','err');return;}
  f.field1=fid1;f.field2=fid2;f.table=f.table||{};
  renderFactorEditor();
}
function factorSave(){
  const c=opEnsureCumac();const f=c.factors[CUMFACTOR_IDX];
  const label=(document.getElementById('cf_label')||{value:''}).value.trim();
  if(!label){toast('Nom du facteur requis','err');return;}
  f.label=label;
  if(f.type==='fixed'){
    f.value=parseFloat(String((document.getElementById('cf_fixed_val')||{value:''}).value||'').replace(',','.'))||0;
  }else if(f.type==='field'){
    const fid=resolveOrCreateField('cf_field','number');
    if(!fid){toast('Choisissez ou créez un champ numérique','err');return;}
    f.field=fid;
  }else if(f.type==='table1d'){
    if(!f.field){toast('Cliquez sur « Générer la grille » avant de valider','err');return;}
    f.table=f.table||{};
    document.querySelectorAll('.cf-t1-val').forEach(inp=>{f.table[inp.dataset.opt]=parseFloat(String(inp.value||'').replace(',','.'))||0;});
  }else if(f.type==='table2d'){
    if(!f.field1||!f.field2){toast('Cliquez sur « Générer la grille croisée » avant de valider','err');return;}
    f.table=f.table||{};
    document.querySelectorAll('.cf-t2-val').forEach(inp=>{f.table[inp.dataset.key]=parseFloat(String(inp.value||'').replace(',','.'))||0;});
  }
  renderOpEditor();
}
function opCaptureName(){const e=document.getElementById('op_name');if(e)OPDRAFT.name=e.value.trim();}
function opAddField(){opCaptureName();OPFIELD_IDX=OPDRAFT.fields.length;OPDRAFT.fields.push({id:uid(),label:'',type:'text',options:[],required:false});renderFieldEditor();}
function opEditField(i){opCaptureName();OPFIELD_IDX=i;renderFieldEditor();}
function opDelField(i){opCaptureName();OPDRAFT.fields.splice(i,1);renderOpEditor();}
function opMoveField(i,dir){opCaptureName();const j=i+dir;if(j<0||j>=OPDRAFT.fields.length)return;const t=OPDRAFT.fields[i];OPDRAFT.fields[i]=OPDRAFT.fields[j];OPDRAFT.fields[j]=t;renderOpEditor();}
function renderFieldEditor(){
  const f=OPDRAFT.fields[OPFIELD_IDX];
  const typeOpts=Object.entries(FIELD_TYPES).map(([k,v])=>`<option value="${k}" ${f.type===k?'selected':''}>${v}</option>`).join('');
  let body=`<div class="fgrid">
    <div class="fld full"><label>Libellé de la question</label><input id="fld_label" value="${esc(f.label)}" placeholder="Ex : Type de chaudière actuelle"></div>
    <div class="fld"><label>Type de champ</label><select id="fld_type" onchange="fieldTypeChange(this.value)">${typeOpts}</select></div>
    <div class="fld"><label>Obligatoire ?</label><select id="fld_req"><option value="no" ${!f.required?'selected':''}>Non</option><option value="yes" ${f.required?'selected':''}>Oui</option></select></div>
    <div class="fld full" id="fld_opts_wrap" style="${f.type==='select'?'':'display:none'}"><label>Options de la liste — une par ligne</label><textarea id="fld_opts" rows="4" placeholder="Maison individuelle&#10;Appartement">${esc((f.options||[]).join('\n'))}</textarea></div>
  </div>
  <p class="muted" style="margin-top:.4rem">Astuce : « Liste déroulante » pour des choix fixes, « Oui / Non » pour une case à cocher, « Texte long » pour un commentaire.</p>`;
  openModal('Champ : '+(f.label||'nouveau'),body,`<button class="btn btn-ghost" onclick="renderOpEditor()">← Retour</button><button class="btn btn-pri" onclick="fieldSave()">✓ Valider le champ</button>`,'wide');
}
function fieldTypeChange(t){const w=document.getElementById('fld_opts_wrap');if(w)w.style.display=t==='select'?'':'none';}
function fieldSave(){
  const f=OPDRAFT.fields[OPFIELD_IDX];
  const label=val('fld_label');
  if(!label){toast('Libellé requis','err');return;}
  f.label=label;f.type=val('fld_type');f.required=val('fld_req')==='yes';
  f.options=f.type==='select'?document.getElementById('fld_opts').value.split('\n').map(s=>s.trim()).filter(Boolean):[];
  renderOpEditor();
}
function saveOperation(){
  opCaptureName();
  if(!OPDRAFT.name){toast("Nom de l'opération requis",'err');return;}
  OPDRAFT.fields=OPDRAFT.fields.filter(f=>f.label&&f.label.trim());
  OPDRAFT.etudeType=val('op_etudetype')||'';
  const ops=getProducts();const idx=ops.findIndex(o=>o.id===OPDRAFT.id);
  if(idx>=0)ops[idx]=OPDRAFT;else ops.push(OPDRAFT);
  save(K.prod,ops);OPDRAFT=null;closeModal();renderSettings();buildNav();toast('Opération enregistrée ✓','ok');
}

   DÉMARRAGE
   ==================================================================== */
seed();
function injectLogos(){
  const f=`<img src="${LOGO_FULL}" alt="EGN Rénovation">`;
  const sb=document.getElementById('sbBrand');if(sb)sb.innerHTML=f;
  const ll=document.getElementById('loginLogo');if(ll)ll.innerHTML=f;
  const hb=document.getElementById('homeBtn');if(hb)hb.innerHTML=`<img src="${LOGO_EMBLEM}" alt="Accueil">`;
}
injectLogos();
(async function boot(){
  const{data:{session}}=await SUPA.auth.getSession();
  if(session){
    const{data:profile}=await SUPA.from('profiles').select('*').eq('id',session.user.id).single();
    if(profile&&profile.active){
      ME={id:profile.id,code:profile.code,prenom:profile.prenom,nom:profile.nom,email:profile.email,team:profile.team,role:profile.role,perms:profile.perms||{},active:profile.active,assignedUsers:profile.assigned_users||[],sourceId:profile.source_id||''};
      startApp();return;
    }
    await SUPA.auth.signOut();
  }
  const hint=document.getElementById('loginHint');
  hint.innerHTML="© 2026 EGN RÉNOVATION. Tous droits réservés.<br><span style='font-size:.66rem'>Ce logiciel est la propriété exclusive de EGN RÉNOVATION et est protégé par le droit d'auteur et les lois relatives à la propriété intellectuelle.</span>";
  setTimeout(()=>document.getElementById('loginCode').focus(),100);
})();
document.getElementById('loginCode').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginPwd').focus();});
document.getElementById('loginPwd').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(e=>console.error('[sw]',e));});}
</script>
