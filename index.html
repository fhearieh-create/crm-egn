<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EGN Rénovation — Maintenance</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#1A2B3D;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .card{background:#fff;border-radius:16px;padding:3rem 2.5rem;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .logo{font-size:2rem;font-weight:800;color:#1A2B3D;letter-spacing:-1px;margin-bottom:.2rem}
    .logo span{color:#7CC242}
    .sub{font-size:.85rem;color:#9aa5b1;margin-bottom:2.5rem;letter-spacing:.5px;text-transform:uppercase}
    .icon{font-size:3.5rem;margin-bottom:1.5rem}
    h1{font-size:1.4rem;font-weight:700;color:#1A2B3D;margin-bottom:.8rem}
    p{font-size:.92rem;color:#6b7785;line-height:1.7;margin-bottom:2rem}
    .badge{display:inline-flex;align-items:center;gap:.5rem;background:#EFF7E8;color:#3B6D11;border-radius:999px;padding:.5rem 1.2rem;font-size:.82rem;font-weight:600}
    .dot{width:8px;height:8px;background:#7CC242;border-radius:50%;animation:pulse 1.4s infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
    .footer{margin-top:2.5rem;font-size:.75rem;color:#c4cdd6}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">EGN <span>Rénovation</span></div>
    <div class="sub">CRM Interne</div>
    <div class="icon">🔧</div>
    <h1>Maintenance en cours</h1>
    <p>Le CRM est temporairement indisponible pour une mise à jour.<br>Nous serons de retour très prochainement.</p>
    <div class="badge"><span class="dot"></span> Mise à jour en cours…</div>
    <div class="footer">Pour toute urgence, contactez votre responsable.</div>
  </div>
</body>
</html>
